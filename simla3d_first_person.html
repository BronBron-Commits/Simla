<!DOCTYPE html>
<html>
<head>
  <title>Simla3D First Person</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe7ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      color: #102030;
      font-size: 13px;
      max-width: 360px;
      backdrop-filter: blur(8px);
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div id="hud">
    <b>Simla3D First Person</b><br>
    Tap/click to lock pointer. WASD moves. Mouse looks.
  </div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#cfe7ff");
    scene.fog = new THREE.FogExp2("#cfe7ff", 0.006);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
    renderer.shadowMap.enabled = false;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight("#ffffff", "#6b8a6f", 1.8));

    const sun = new THREE.DirectionalLight("#ffffff", 1.8);
    sun.position.set(12, 22, 10);
    scene.add(sun);

    const root = new THREE.Group();
    scene.add(root);

    let staticBuilt = false;
    const agents = new Map();

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let locked = false;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    document.body.addEventListener("click", () => {
      document.body.requestPointerLock?.();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === document.body;
    });

    document.addEventListener("mousemove", e => {
      if (!locked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try { return new THREE.Color(v || fallback); }
      catch { return new THREE.Color(fallback); }
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) obj[arr[i]] = arr[i + 1];
      return obj;
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        obj.traverse?.(child => {
          child.geometry?.dispose?.();
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        });
      }
    }

    function mat(o, fallback, roughness = 0.75) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness,
        metalness: 0.03
      });
    }

    function addFloor(o) {
      const geo = new THREE.BoxGeometry(num(o.w, 80), 0.12, num(o.d, 80));
      const mesh = new THREE.Mesh(geo, mat(o, "#2e5a3a", 0.95));
      mesh.position.set(num(o.x), -0.06, num(o.z));
      root.add(mesh);

      const grid = new THREE.GridHelper(Math.max(num(o.w, 80), num(o.d, 80)), 70, "#5d8a62", "#3e6546");
      grid.position.y = 0.02;
      root.add(grid);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);
      const x = num(o.x);
      const y = num(o.y);
      const z = num(o.z);

      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(o, "#999999"));
      mesh.position.set(x, y, z);
      root.add(mesh);

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(w * 1.08, 0.16, d * 1.08),
        new THREE.MeshStandardMaterial({ color: "#1c2530", roughness: 0.85 })
      );
      roof.position.set(x, y + h / 2 + 0.1, z);
      root.add(roof);

      addWindows(x, z, w, h, d, y);
    }

    function addWindows(x, z, w, h, d, centerY) {
      const rows = Math.max(1, Math.floor(h / 2));
      const colsFront = Math.max(2, Math.floor(w / 2));
      const colsSide = Math.max(2, Math.floor(d / 2));

      const winMat = new THREE.MeshStandardMaterial({
        color: "#e8f7ff",
        emissive: "#4d8fbd",
        emissiveIntensity: 0.35,
        roughness: 0.4
      });

      function win(wx, wy, wz, rotY) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.035), winMat);
        m.position.set(wx, wy, wz);
        m.rotation.y = rotY;
        root.add(m);
      }

      for (let r = 0; r < rows; r++) {
        const wy = centerY - h / 2 + 0.8 + r * 1.6;

        for (let c = 0; c < colsFront; c++) {
          const wx = x - w / 2 + 0.7 + c * ((w - 1.4) / Math.max(1, colsFront - 1));
          win(wx, wy, z - d / 2 - 0.025, 0);
          win(wx, wy, z + d / 2 + 0.025, Math.PI);
        }

        for (let c = 0; c < colsSide; c++) {
          const wz = z - d / 2 + 0.7 + c * ((d - 1.4) / Math.max(1, colsSide - 1));
          win(x - w / 2 - 0.025, wy, wz, Math.PI / 2);
          win(x + w / 2 + 0.025, wy, wz, -Math.PI / 2);
        }
      }
    }

    function makePersonGroup(o) {
      const group = new THREE.Group();
      group.position.set(num(o.x), num(o.y, 1), num(o.z));

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.25, 0.7, 4, 8),
        mat(o, "#55ccff", 0.65)
      );
      body.position.y = 0.25;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 12, 8),
        new THREE.MeshStandardMaterial({ color: "#f0c8a0", roughness: 0.8 })
      );
      head.position.y = 0.92;
      group.add(head);

      return group;
    }

    function addPerson(o) {
      const id = String(o.id || "agent");
      const target = new THREE.Vector3(num(o.x), num(o.y, 1), num(o.z));

      if (!agents.has(id)) {
        const group = makePersonGroup(o);
        group.position.copy(target);
        root.add(group);

        agents.set(id, {
          group,
          prev: target.clone(),
          next: target.clone(),
          time: performance.now()
        });

        return;
      }

      const state = agents.get(id);
      state.prev.copy(state.group.position);
      state.next.copy(target);
      state.time = performance.now();
    }

    function addLocation(o) {
      const marker = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.1, 24),
        new THREE.MeshStandardMaterial({
          color: color(o.color, "#ddddff"),
          emissive: color(o.color, "#ddddff"),
          emissiveIntensity: 0.4
        })
      );
      marker.position.set(num(o.x), num(o.y, 0.08), num(o.z));
      root.add(marker);
    }

    function addRoute(o) {
      const from = new THREE.Vector3(num(o.fromX), 0.08, num(o.fromZ));
      const to = new THREE.Vector3(num(o.toX), 0.08, num(o.toZ));
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const line = new THREE.Line(
        geo,
        new THREE.LineBasicMaterial({
          color: color(o.color, "#ffffff"),
          transparent: true,
          opacity: 0.18
        })
      );
      root.add(line);
    }

    async function loadScene() {
      const res = await fetch("/api/scene?file=examples/simla3d_demo.sim&cacheBust=" + Date.now());
      const data = await res.json();

      if (!staticBuilt) {
        clearRoot();
        agents.clear();
      }

      for (const item of data) {
        if (!Array.isArray(item)) continue;
        const o = pairsToObj(item);

        if (o.type === "agent" || o.type === "person") {
          addPerson(o);
          continue;
        }

        if (staticBuilt) continue;

        if (o.type === "floor") addFloor(o);
        else if (o.type === "box") addBox(o);
        else if (o.type === "cube") addBox({ ...o, w: o.size, h: o.size, d: o.size });
        else if (o.type === "location") addLocation(o);
        else if (o.type === "route") addRoute(o);
      }

      staticBuilt = true;
    }

    function updateCamera() {
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const speed = keys.has("shift") ? 0.28 : 0.14;

      if (keys.has("w")) camera.position.addScaledVector(forward, speed);
      if (keys.has("s")) camera.position.addScaledVector(forward, -speed);
      if (keys.has("a")) camera.position.addScaledVector(right, -speed);
      if (keys.has("d")) camera.position.addScaledVector(right, speed);

      camera.position.y = 1.7;
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function updateAgents() {
      const now = performance.now();
      const duration = 400; // ms

      for (const state of agents.values()) {
        const t = Math.min(1, (now - state.time) / duration);

        state.group.position.set(
          state.prev.x + (state.next.x - state.prev.x) * t,
          state.prev.y + (state.next.y - state.prev.y) * t,
          state.prev.z + (state.next.z - state.prev.z) * t
        );
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      updateAgents();
      renderer.render(scene, camera);
    }

    loadScene();
    setInterval(loadScene, 400);
    animate();
  </script>
</body>
</html>
