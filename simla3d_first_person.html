<!DOCTYPE html>
<html>
<head>
  <title>Simla3D First Person</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe7ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      color: #102030;
      font-size: 13px;
      max-width: 360px;
      backdrop-filter: blur(8px);
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0,0,0,.4);
    }

    .joystick {
      position: fixed;
      bottom: 28px;
      width: 264px;
      height: 264px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      z-index: 20;
      touch-action: none;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    .joystick .knob {
      position: absolute;
      left: 84px;
      top: 84px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      border: 2px solid rgba(20,40,60,0.25);
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    #moveJoy {
      left: 26px;
    }

    #lookJoy {
      right: 26px;
    }

    @media (pointer: fine) {
      .joystick {
        opacity: 0.35;
      }
    }

    #talkPrompt {
      position: fixed;
      left: 50%;
      bottom: 210px;
      transform: translateX(-50%);
      z-index: 30;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      color: #102030;
      font-size: 14px;
      font-weight: 700;
      display: none;
      pointer-events: auto;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }

    #dialogueBox {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 320px;
      z-index: 31;
      padding: 16px;
      border-radius: 18px;
      background: rgba(8, 15, 26, 0.88);
      color: #eef7ff;
      display: none;
      box-shadow: 0 18px 60px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(180,220,255,0.24);
    }

    #dialogueName {
      font-weight: 800;
      margin-bottom: 8px;
      color: #9fd3ff;
    }

    #dialogueText {
      line-height: 1.4;
      font-size: 15px;
    }

    #dialogueClose {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  
  <div id="crosshair"></div>

  <div id="talkPrompt">Talk</div>

  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueClose">close</div>
  </div>

  <div id="moveJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <div id="lookJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    window.addEventListener("error", e => {
      console.warn("Simla3D runtime warning:", e.message);
    });

    window.addEventListener("unhandledrejection", e => {
      console.warn("Simla3D async warning:", e.reason);
    });

    const talkPrompt = document.getElementById("talkPrompt");
    const dialogueBox = document.getElementById("dialogueBox");
    const dialogueName = document.getElementById("dialogueName");
    const dialogueText = document.getElementById("dialogueText");
    const dialogueClose = document.getElementById("dialogueClose");

    let nearestNpc = null;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#cfe7ff");
    scene.fog = new THREE.FogExp2("#cfe7ff", 0.006);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
    renderer.shadowMap.enabled = false;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight("#ffffff", "#6b8a6f", 1.8));

    const sun = new THREE.DirectionalLight("#ffffff", 1.8);
    sun.position.set(12, 22, 10);
    scene.add(sun);

    const root = new THREE.Group();
    scene.add(root);

    let staticBuilt = false;
    const agents = new Map();

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let locked = false;

    const moveStick = { x: 0, y: 0 };
    const lookStick = { x: 0, y: 0 };

    let smoothLookX = 0;
    let smoothLookY = 0;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    document.body.addEventListener("click", () => {
      document.body.requestPointerLock?.();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === document.body;
    });

    function setupJoystick(id, state) {
      const joy = document.getElementById(id);
      const knob = joy.querySelector(".knob");
      let activePointer = null;

      function setKnob(dx, dy) {
        const max = 84;
        const len = Math.hypot(dx, dy);
        const scale = len > max ? max / len : 1;

        const x = dx * scale;
        const y = dy * scale;

        knob.style.transform = `translate(${x}px, ${y}px)`;

        state.x = x / max;
        state.y = y / max;
      }

      function reset() {
        activePointer = null;
        state.x = 0;
        state.y = 0;
        knob.style.transform = "translate(0px, 0px)";
      }

      joy.addEventListener("pointerdown", e => {
        activePointer = e.pointerId;
        joy.setPointerCapture(e.pointerId);

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointermove", e => {
        if (activePointer !== e.pointerId) return;

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointerup", reset);
      joy.addEventListener("pointercancel", reset);
      joy.addEventListener("lostpointercapture", reset);
    }

    setupJoystick("moveJoy", moveStick);
    setupJoystick("lookJoy", lookStick);

    document.addEventListener("mousemove", e => {
      if (!locked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try { return new THREE.Color(v || fallback); }
      catch { return new THREE.Color(fallback); }
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) obj[arr[i]] = arr[i + 1];
      return obj;
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        obj.traverse?.(child => {
          child.geometry?.dispose?.();
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        });
      }
    }

    function mat(o, fallback, roughness = 0.75) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness,
        metalness: 0.03
      });
    }

    function addFloor(o) {
      const geo = new THREE.BoxGeometry(num(o.w, 80), 0.12, num(o.d, 80));
      const mesh = new THREE.Mesh(geo, mat(o, "#2e5a3a", 0.95));
      mesh.position.set(num(o.x), -0.06, num(o.z));
      root.add(mesh);

      const grid = new THREE.GridHelper(Math.max(num(o.w, 80), num(o.d, 80)), 70, "#5d8a62", "#3e6546");
      grid.position.y = 0.02;
      root.add(grid);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);
      const x = num(o.x);
      const y = num(o.y);
      const z = num(o.z);

      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(o, "#999999"));
      mesh.position.set(x, y, z);
      root.add(mesh);

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(w * 1.08, 0.16, d * 1.08),
        new THREE.MeshStandardMaterial({ color: "#1c2530", roughness: 0.85 })
      );
      roof.position.set(x, y + h / 2 + 0.1, z);
      root.add(roof);

      addWindows(x, z, w, h, d, y);
    }

    function addWindows(x, z, w, h, d, centerY) {
      const rows = Math.max(1, Math.floor(h / 2));
      const colsFront = Math.max(2, Math.floor(w / 2));
      const colsSide = Math.max(2, Math.floor(d / 2));

      const winMat = new THREE.MeshStandardMaterial({
        color: "#e8f7ff",
        emissive: "#4d8fbd",
        emissiveIntensity: 0.35,
        roughness: 0.4
      });

      function win(wx, wy, wz, rotY) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.035), winMat);
        m.position.set(wx, wy, wz);
        m.rotation.y = rotY;
        root.add(m);
      }

      for (let r = 0; r < rows; r++) {
        const wy = centerY - h / 2 + 0.8 + r * 1.6;

        for (let c = 0; c < colsFront; c++) {
          const wx = x - w / 2 + 0.7 + c * ((w - 1.4) / Math.max(1, colsFront - 1));
          win(wx, wy, z - d / 2 - 0.025, 0);
          win(wx, wy, z + d / 2 + 0.025, Math.PI);
        }

        for (let c = 0; c < colsSide; c++) {
          const wz = z - d / 2 + 0.7 + c * ((d - 1.4) / Math.max(1, colsSide - 1));
          win(x - w / 2 - 0.025, wy, wz, Math.PI / 2);
          win(x + w / 2 + 0.025, wy, wz, -Math.PI / 2);
        }
      }
    }

    function makePersonGroup(o) {
      const group = new THREE.Group();
      group.position.set(num(o.x), num(o.y, 1), num(o.z));

      const outfit = color(o.color, "#55ccff");

      const skinMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#f0c8a0"),
        roughness: 0.8
      });

      const shirtMat = new THREE.MeshStandardMaterial({
        color: outfit,
        roughness: 0.7,
        metalness: 0.02
      });

      const pantsMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#263248"),
        roughness: 0.75
      });

      const hairMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#33251b"),
        roughness: 0.8
      });

      // torso
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.68, 0.24),
        shirtMat
      );
      torso.position.y = 0.45;
      torso.name = "torso";
      group.add(torso);

      // head
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 14, 10),
        skinMat
      );
      head.position.y = 0.98;
      head.name = "head";
      group.add(head);

      // hair cap
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.225, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.48),
        hairMat
      );
      hair.position.y = 1.05;
      hair.rotation.x = Math.PI;
      hair.name = "hair";
      group.add(hair);

      // arms
      const armGeo = new THREE.BoxGeometry(0.13, 0.55, 0.13);

      const leftArm = new THREE.Mesh(armGeo, shirtMat);
      leftArm.position.set(-0.34, 0.43, 0);
      leftArm.name = "leftArm";
      group.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, shirtMat);
      rightArm.position.set(0.34, 0.43, 0);
      rightArm.name = "rightArm";
      group.add(rightArm);

      // legs
      const legGeo = new THREE.BoxGeometry(0.15, 0.58, 0.15);

      const leftLeg = new THREE.Mesh(legGeo, pantsMat);
      leftLeg.position.set(-0.12, -0.2, 0);
      leftLeg.name = "leftLeg";
      group.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, pantsMat);
      rightLeg.position.set(0.12, -0.2, 0);
      rightLeg.name = "rightLeg";
      group.add(rightLeg);

      // feet
      const footGeo = new THREE.BoxGeometry(0.18, 0.08, 0.3);
      const footMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#171b22"),
        roughness: 0.85
      });

      const leftFoot = new THREE.Mesh(footGeo, footMat);
      leftFoot.position.set(-0.12, -0.52, 0.06);
      leftFoot.name = "leftFoot";
      group.add(leftFoot);

      const rightFoot = new THREE.Mesh(footGeo, footMat);
      rightFoot.position.set(0.12, -0.52, 0.06);
      rightFoot.name = "rightFoot";
      group.add(rightFoot);

      group.userData.parts = {
        torso,
        head,
        leftArm,
        rightArm,
        leftLeg,
        rightLeg,
        leftFoot,
        rightFoot
      };

      group.userData.lastPos = group.position.clone();
      group.userData.walkPhase = Math.random() * Math.PI * 2;
      group.userData.variation = 0.75 + Math.random() * 0.55;

      return group;
    }

    function addPerson(o) {
      const id = String(o.id || "agent");
      const target = new THREE.Vector3(num(o.x), num(o.y, 1), num(o.z));

      if (!agents.has(id)) {
        const group = makePersonGroup(o);
        group.position.copy(target);
        group.userData.npcId = id;
        group.userData.targetName = String(o.target || "somewhere");
        root.add(group);

        agents.set(id, {
          group,
          prev: target.clone(),
          next: target.clone(),
          time: performance.now()
        });

        return;
      }

      const state = agents.get(id);
      state.group.userData.targetName = String(o.target || "somewhere");
      state.prev.copy(state.group.position);
      state.next.copy(target);
      state.time = performance.now();
    }

    function addLocation(o) {
      const marker = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.1, 24),
        new THREE.MeshStandardMaterial({
          color: color(o.color, "#ddddff"),
          emissive: color(o.color, "#ddddff"),
          emissiveIntensity: 0.4
        })
      );
      marker.position.set(num(o.x), num(o.y, 0.08), num(o.z));
      root.add(marker);
    }

    function addRoute(o) {
      const from = new THREE.Vector3(num(o.fromX), 0.08, num(o.fromZ));
      const to = new THREE.Vector3(num(o.toX), 0.08, num(o.toZ));
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const line = new THREE.Line(
        geo,
        new THREE.LineBasicMaterial({
          color: color(o.color, "#ffffff"),
          transparent: true,
          opacity: 0.18
        })
      );
      root.add(line);
    }

    async function loadScene() {
      try {
        const res = await fetch("/api/scene?file=examples/simla3d_demo.sim&cacheBust=" + Date.now());
        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error("Scene API did not return an array: " + JSON.stringify(data).slice(0, 300));
        }

        if (!staticBuilt) {
          clearRoot();
          agents.clear();
        }

        for (const item of data) {
          if (!Array.isArray(item)) continue;
          const o = pairsToObj(item);

          if (o.type === "agent" || o.type === "person") {
            addPerson(o);
            continue;
          }

          if (staticBuilt) continue;

          if (o.type === "floor") addFloor(o);
          else if (o.type === "box") addBox(o);
          else if (o.type === "cube") addBox({ ...o, w: o.size, h: o.size, d: o.size });
          else if (o.type === "location") addLocation(o);
          else if (o.type === "route") addRoute(o);
        }

        staticBuilt = true;
      } catch (err) {
        console.warn("Simla3D scene load warning:", err);
      }
    }

    function npcLine(id, target) {
      if (id.startsWith("m")) return `I'm just hanging around the mall. It has been busy today.`;
      if (id.startsWith("n")) return `North mall is quieter, but I like walking over there.`;
      if (id.startsWith("p")) return `The park is the best place to slow down for a minute.`;
      if (id.startsWith("r")) return `I live around here. The neighborhood is getting crowded.`;
      if (id.startsWith("s")) return `I'm heading through town toward ${target}.`;
      if (id.startsWith("c")) return `I'm near the civic district today. Lots of people moving around.`;
      if (id.startsWith("q")) return `This side of the city is growing fast.`;
      return `I'm on my way to ${target}.`;
    }

    function openDialogue(npc) {
      if (!npc) return;

      const id = npc.userData.npcId || "npc";
      const target = npc.userData.targetName || "somewhere";

      dialogueName.textContent = id;
      dialogueText.textContent = npcLine(id, target);
      dialogueBox.style.display = "block";
    }

    function closeDialogue() {
      dialogueBox.style.display = "none";
    }

    function updateInteraction() {
      nearestNpc = null;

      let bestDist = 2.8;

      for (const state of agents.values()) {
        const npc = state.group;
        const dist = camera.position.distanceTo(npc.position);

        if (dist < bestDist) {
          bestDist = dist;
          nearestNpc = npc;
        }
      }

      if (nearestNpc) {
        talkPrompt.style.display = "block";
        talkPrompt.textContent = `Talk to ${nearestNpc.userData.npcId || "NPC"}`;
      } else {
        talkPrompt.style.display = "none";
      }
    }

    talkPrompt.addEventListener("click", () => openDialogue(nearestNpc));
    dialogueClose.addEventListener("click", closeDialogue);

    function updateCamera() {
      smoothLookX += (lookStick.x - smoothLookX) * 0.15;
      smoothLookY += (lookStick.y - smoothLookY) * 0.15;

      yaw -= smoothLookX * 0.008;
      pitch -= smoothLookY * 0.007;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const speed = keys.has("shift") ? 0.08 : 0.035;

      let moveForward = 0;
      let moveRight = 0;

      if (keys.has("w")) moveForward -= 1;
      if (keys.has("s")) moveForward += 1;
      if (keys.has("d")) moveRight += 1;
      if (keys.has("a")) moveRight -= 1;

      moveForward += moveStick.y;
      moveRight += moveStick.x;

      const mag = Math.hypot(moveForward, moveRight);
      if (mag > 1) {
        moveForward /= mag;
        moveRight /= mag;
      }

      camera.position.addScaledVector(forward, moveForward * speed);
      camera.position.addScaledVector(right, moveRight * speed);

      camera.position.y = 1.7;
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function updateAgents() {
      const now = performance.now();
      const duration = 400;

      for (const state of agents.values()) {
        const tRaw = Math.min(1, (now - state.time) / duration);
        const t = tRaw * tRaw * (3 - 2 * tRaw);

        const oldX = state.group.position.x;
        const oldZ = state.group.position.z;

        state.group.position.set(
          state.prev.x + (state.next.x - state.prev.x) * t,
          state.prev.y + (state.next.y - state.prev.y) * t,
          state.prev.z + (state.next.z - state.prev.z) * t
        );

        const dx = state.group.position.x - oldX;
        const dz = state.group.position.z - oldZ;
        const speed = Math.sqrt(dx * dx + dz * dz);

        if (speed > 0.0005) {
          state.group.rotation.y = Math.atan2(dx, dz);
        }

        const parts = state.group.userData.parts;
        if (!parts) continue;

        if (speed > 0.0005) {
          state.group.userData.walkPhase += Math.min(0.35, speed * 24);

          const phase = state.group.userData.walkPhase;
          const v = state.group.userData.variation || 1;
          const swing = Math.sin(phase) * Math.min(0.26 * v, speed * 20);
          const bob = Math.abs(Math.sin(phase)) * Math.min(0.035 * v, speed * 4);

          parts.leftArm.rotation.x = swing;
          parts.rightArm.rotation.x = -swing;
          parts.leftLeg.rotation.x = -swing * 0.75;
          parts.rightLeg.rotation.x = swing * 0.75;
          parts.leftFoot.rotation.x = -swing * 0.25;
          parts.rightFoot.rotation.x = swing * 0.25;

          parts.torso.position.y = 0.45 + bob;
          parts.head.position.y = 0.98 + bob;

          parts.torso.rotation.z = 0;
          parts.head.rotation.y = 0;
        } else {
          const idle = now * 0.002 + state.group.userData.walkPhase;
          const v = state.group.userData.variation || 1;
          const breathe = Math.sin(idle) * 0.014 * v;
          const sway = Math.sin(idle * 0.7) * 0.022 * v;
          const headTurn = Math.sin(idle * 0.45) * 0.09 * v;
          const armDrift = Math.sin(idle * 0.8) * 0.028 * v;

          parts.leftArm.rotation.x = 0.1 + armDrift;
          parts.rightArm.rotation.x = 0.1 - armDrift;
          parts.leftLeg.rotation.x = Math.sin(idle * 0.5) * 0.015;
          parts.rightLeg.rotation.x = -Math.sin(idle * 0.5) * 0.015;
          parts.leftFoot.rotation.x = 0;
          parts.rightFoot.rotation.x = 0;

          parts.torso.position.y = 0.45 + breathe;
          parts.head.position.y = 0.98 + breathe;

          parts.torso.rotation.z = sway;
          parts.head.rotation.y = headTurn;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      updateAgents();
      updateInteraction();
      renderer.render(scene, camera);
    }

    loadScene();
    setInterval(loadScene, 400);
    animate();
  </script>
</body>
</html>
