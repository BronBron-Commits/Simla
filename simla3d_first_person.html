<!DOCTYPE html>
<html>
<head>
  <title>Simla3D First Person</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe7ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      color: #102030;
      font-size: 13px;
      max-width: 360px;
      backdrop-filter: blur(8px);
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0,0,0,.4);
    }

    .joystick {
      position: fixed;
      bottom: 28px;
      width: 264px;
      height: 264px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      z-index: 20;
      touch-action: none;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    .joystick .knob {
      position: absolute;
      left: 84px;
      top: 84px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      border: 2px solid rgba(20,40,60,0.25);
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    #moveJoy {
      left: 26px;
    }

    #lookJoy {
      right: 26px;
    }

    @media (pointer: fine) {
      .joystick {
        display: none !important;
      }
    }

    #talkPrompt {
      position: fixed;
      left: 50%;
      bottom: 210px;
      transform: translateX(-50%);
      z-index: 30;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      color: #102030;
      font-size: 14px;
      font-weight: 700;
      display: none;
      pointer-events: auto;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }

    #dialogueBox {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 320px;
      z-index: 31;
      padding: 16px;
      border-radius: 18px;
      background: rgba(8, 15, 26, 0.88);
      color: #eef7ff;
      display: none;
      box-shadow: 0 18px 60px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(180,220,255,0.24);
    }

    #dialogueName {
      font-weight: 800;
      margin-bottom: 8px;
      color: #9fd3ff;
    }

    #dialogueText {
      line-height: 1.4;
      font-size: 15px;
    }

    #dialogueClose {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 13px;
    }

    #viewToggle {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 40;
      padding: 14px 18px;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,0.88);
      color: #102030;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 10px 32px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div id="splashScreen" style="
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 35%, rgba(120,80,255,.35), transparent 32%),
      radial-gradient(circle at 70% 70%, rgba(255,90,30,.24), transparent 35%),
      linear-gradient(180deg, #050814, #101827 55%, #05070c);
    color:white;
    font-family:system-ui,sans-serif;
  ">
    <div style="
      max-width:720px;
      margin:24px;
      padding:34px;
      border-radius:26px;
      background:rgba(5,10,22,.72);
      border:1px solid rgba(180,210,255,.22);
      box-shadow:0 30px 100px rgba(0,0,0,.6);
      text-align:center;
      backdrop-filter:blur(10px);
    ">
      <div style="
        font-size:13px;
        letter-spacing:.28em;
        text-transform:uppercase;
        color:#9fd3ff;
        margin-bottom:12px;
      ">Simla3D Battle Event</div>

      <h1 style="
        margin:0;
        font-size:clamp(42px, 8vw, 86px);
        line-height:.92;
        letter-spacing:-.06em;
      ">Simla3D</h1>

      <p style="
        margin:18px auto 0;
        max-width:560px;
        color:#d7e7ff;
        font-size:17px;
        line-height:1.5;
      ">
        Wizards, archers, warriors, dragons, summons, storms, and chaos.
      </p>

      <div id="splashStats" style="
        margin:22px auto;
        color:#9eff9e;
        font:13px monospace;
        white-space:pre;
        opacity:.95;
      ">Preparing simulation...</div>

      <button id="startSimulationBtn" style="
        cursor:pointer;
        border:0;
        border-radius:999px;
        padding:15px 24px;
        font-weight:900;
        font-size:16px;
        color:#07101d;
        background:linear-gradient(90deg,#9fd3ff,#ffd36b,#ff7a3d);
        box-shadow:0 12px 40px rgba(255,130,60,.28);
      ">Start Simulation</button>

      <div style="
        margin-top:16px;
        color:rgba(255,255,255,.55);
        font-size:12px;
      ">WASD / mouse on desktop • touch sticks on mobile</div>
    </div>
  </div>
  
  <button id="viewToggle">Isometric</button>
  <div id="crosshair"></div>

  <div id="talkPrompt">Talk</div>

  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueClose">close</div>
  </div>

  <div id="moveJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <div id="lookJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer }  from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass }      from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass }      from "three/addons/postprocessing/ShaderPass.js";
    import { GammaCorrectionShader } from "three/addons/shaders/GammaCorrectionShader.js";

    window.addEventListener("error", e => {
      console.warn("Simla3D runtime warning:", e.message);
    });

    window.addEventListener("unhandledrejection", e => {
      console.warn("Simla3D async warning:", e.reason);
    });

    const talkPrompt = document.getElementById("talkPrompt");
    const dialogueBox = document.getElementById("dialogueBox");
    const dialogueName = document.getElementById("dialogueName");
    const dialogueText = document.getElementById("dialogueText");
    const dialogueClose = document.getElementById("dialogueClose");

    let nearestNpc = null;
    let simulationStarted = false;
    const splashScreen = document.getElementById("splashScreen");
    const startSimulationBtn = document.getElementById("startSimulationBtn");
    const splashStats = document.getElementById("splashStats");

    startSimulationBtn?.addEventListener("click", () => {
      simulationStarted = true;
      if (splashScreen) {
        splashScreen.style.opacity = "0";
        splashScreen.style.transition = "opacity 650ms ease";
        setTimeout(() => splashScreen.style.display = "none", 700);
      }
      document.body.requestPointerLock?.();
    });

    const sceneFile = new URLSearchParams(location.search).get("file") || "examples/building/basic_wall.sim";
    const isDragonScene = sceneFile.includes("dragon");

    const scene = new THREE.Scene();

    function createSkyDome() {
      const geo = new THREE.SphereGeometry(400, 32, 16);

      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          time: { value: 0 }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPos;
          uniform float time;

          void main() {
            float h = normalize(vWorldPos).y;

            // day-night cycle
            float day = 0.5 + 0.5 * sin(time * 0.02);

            vec3 dayTop = vec3(0.2, 0.5, 1.0);
            vec3 dayHorizon = vec3(0.9, 0.7, 0.5);

            vec3 nightTop = vec3(0.01, 0.02, 0.08);
            vec3 nightHorizon = vec3(0.05, 0.08, 0.2);

            vec3 top = mix(nightTop, dayTop, day);
            vec3 horizon = mix(nightHorizon, dayHorizon, day);

            float t = smoothstep(-0.2, 0.8, h);

            vec3 color = mix(horizon, top, t);

            gl_FragColor = vec4(color, 1.0);
          }
        `
      });

      const sky = new THREE.Mesh(geo, mat);
      scene.add(sky);

      return sky;
    }

    const skyDome = createSkyDome();
    scene.background = new THREE.Color("#87ceeb");
    scene.fog = new THREE.FogExp2("#87ceeb", 0.0025);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 3.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ── Post-processing stack ──
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    // Bloom: makes fire, spells, lightning and emissives glow
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      /*strength*/ 0.35,
      /*radius*/   0.5,
      /*threshold*/ 0.75
    );
    composer.addPass(bloomPass);

    // Custom cinematic screen-space pass: vignette + colour grade + grain + chromatic aberration
    const cinematicShader = {
      uniforms: {
        tDiffuse: { value: null },
        time:     { value: 0.0 },
        uVigStrength: { value: 0.06 },
        uSaturation:  { value: 1.18 },
        uContrast:    { value: 1.04 },
        uGrain:       { value: 0.032 },
        uAberration:  { value: 0.0022 },
        // warm highlights, cool shadows colour grade
        uHighlightTint: { value: new THREE.Color(1.04, 0.98, 0.88) },
        uShadowTint:    { value: new THREE.Color(0.82, 0.90, 1.08) },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float uVigStrength;
        uniform float uSaturation;
        uniform float uContrast;
        uniform float uGrain;
        uniform float uAberration;
        uniform vec3  uHighlightTint;
        uniform vec3  uShadowTint;
        varying vec2 vUv;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }

        void main() {
          vec2 uv = vUv;
          vec2 off = (uv - 0.5) * uAberration;
          float r = texture2D(tDiffuse, uv - off).r;
          float g = texture2D(tDiffuse, uv      ).g;
          float b = texture2D(tDiffuse, uv + off).b;
          vec3 col = vec3(r, g, b);

          // contrast
          col = (col - 0.5) * uContrast + 0.5;

          // saturation
          float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
          col = mix(vec3(lum), col, uSaturation);

          // colour grade: warm highlights, cool shadows
          float bright = clamp(lum, 0.0, 1.0);
          vec3 tint = mix(uShadowTint, uHighlightTint, bright);
          col *= tint;

          // vignette
          vec2 vig = uv - 0.5;
          float v = 1.0 - dot(vig, vig) * uVigStrength * 2.8;
          col *= clamp(v, 0.0, 1.0);

          // film grain
          float grain = hash(uv + fract(time * 0.01731)) * 2.0 - 1.0;
          col += grain * uGrain;

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `
    };
    const cinematicPass = new ShaderPass(cinematicShader);
    cinematicPass.renderToScreen = true;
    composer.addPass(cinematicPass);

    window.addEventListener("resize", () => {
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.resolution.set(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    const hemiLight = new THREE.HemisphereLight("#ffffff", "#6b8a6f", 2.8);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight("#fff5e0", 3.5);
    sun.position.set(12, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    sun.shadow.bias = -0.001;
    scene.add(sun);

    const moon = new THREE.DirectionalLight("#9fb7ff", 0.25);
    moon.position.set(-12, 18, -10);
    scene.add(moon);

    const root = new THREE.Group();
    scene.add(root);

    let staticBuilt = false;
    const agents = new Map();
    const dragons = new Map();
    const dragonFlights = new Map();
    const wizardSpells = [];
    const spellExplosions = [];
    const summons = [];

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let locked = false;
    let viewMode = "first";

    const viewToggle = document.getElementById("viewToggle");
    const leftJoy = document.getElementById("moveJoy");
    const rightJoy = document.getElementById("lookJoy");

    viewToggle.addEventListener("click", () => {
      viewMode = viewMode === "first" ? "iso" : "first";

      const isFirst = viewMode === "first";

      viewToggle.textContent = isFirst ? "Isometric" : "Perspective";
      document.getElementById("crosshair").style.display = isFirst ? "block" : "none";

      if (leftJoy) leftJoy.style.display = isFirst ? "block" : "none";
      if (rightJoy) rightJoy.style.display = isFirst ? "block" : "none";
    });

    const moveStick = { x: 0, y: 0 };
    const lookStick = { x: 0, y: 0 };

    let smoothLookX = 0;
    let smoothLookY = 0;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    document.body.addEventListener("click", () => {
      document.body.requestPointerLock?.();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === document.body;
    });

    function setupJoystick(id, state) {
      const joy = document.getElementById(id);
      const knob = joy.querySelector(".knob");
      let activePointer = null;

      function setKnob(dx, dy) {
        const max = 84;
        const len = Math.hypot(dx, dy);
        const scale = len > max ? max / len : 1;

        const x = dx * scale;
        const y = dy * scale;

        knob.style.transform = `translate(${x}px, ${y}px)`;

        state.x = x / max;
        state.y = y / max;
      }

      function reset() {
        activePointer = null;
        state.x = 0;
        state.y = 0;
        knob.style.transform = "translate(0px, 0px)";
      }

      joy.addEventListener("pointerdown", e => {
        activePointer = e.pointerId;
        joy.setPointerCapture(e.pointerId);

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointermove", e => {
        if (activePointer !== e.pointerId) return;

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointerup", reset);
      joy.addEventListener("pointercancel", reset);
      joy.addEventListener("lostpointercapture", reset);
    }

    setupJoystick("moveJoy", moveStick);
    setupJoystick("lookJoy", lookStick);

    document.addEventListener("mousemove", e => {
      if (!locked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    window.addEventListener("wheel", e => {
      if (viewMode !== "iso") return;
      isoHeight = Math.max(6, Math.min(120, isoHeight + e.deltaY * 0.05));
    }, { passive: true });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try { return new THREE.Color(v || fallback); }
      catch { return new THREE.Color(fallback); }
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) obj[arr[i]] = arr[i + 1];
      return obj;
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        obj.traverse?.(child => {
          child.geometry?.dispose?.();
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        });
      }
    }

    function mat(o, fallback, roughness = 0.75) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness,
        metalness: 0.03
      });
    }

    function addFloor(o) {
      const fw = num(o.w, 80), fd = num(o.d, 80);
      // Custom ground shader: hex tile pattern + specular wetness + painted grass colour variance
      const groundMat = new THREE.ShaderMaterial({
        uniforms: {
          time:       { value: 0 },
          uColorA:    { value: new THREE.Color("#2a5230") },
          uColorB:    { value: new THREE.Color("#3e6a42") },
          uColorC:    { value: new THREE.Color("#1e3e24") },
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float time;
          uniform vec3 uColorA;
          uniform vec3 uColorB;
          uniform vec3 uColorC;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPos;

          // hash for variety
          float h21(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }

          // axial hex grid
          vec2 hexCell(vec2 p) {
            vec2 q = vec2(p.x * 1.1547, p.y + p.x * 0.5774);
            vec2 pi = floor(q), pf = fract(q);
            float v = mod(pi.x + pi.y, 3.0);
            float ca = step(1.0, v), cb = step(2.0, v);
            vec2 ma = step(pf.xy, pf.yx);
            return pi + ca * (1.0 - ma) + cb * ma;
          }

          void main() {
            vec2 world = vWorldPos.xz * 0.22;
            vec2 cell  = hexCell(world);
            float n    = h21(cell);

            // tri-colour grass blend
            vec3 col = mix(uColorA, uColorB, smoothstep(0.3, 0.7, n));
            col = mix(col, uColorC, smoothstep(0.65, 1.0, n));

            // subtle hex edge darkening
            vec2 q2 = vec2(vWorldPos.x * 1.1547 * 0.22, vWorldPos.z * 0.22 + vWorldPos.x * 0.22 * 0.5774);
            vec2 pf2 = fract(q2);
            float edge = min(min(pf2.x, pf2.y), min(1.0-pf2.x, 1.0-pf2.y));
            col *= 0.82 + edge * 0.20;

            // specular wetness (Blinn-Phong approximation for directional light)
            vec3 L = normalize(vec3(0.55, 1.0, 0.45));
            vec3 V = normalize(vec3(0.0, 1.0, 0.0)); // approx view from above
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(vNormal, H), 0.0), 28.0) * 0.18 * n;
            col += vec3(spec);

            // slight time-based shimmer on wet patches
            float shimmer = sin(time * 1.8 + vWorldPos.x * 3.1 + vWorldPos.z * 2.7) * 0.012 * n;
            col += shimmer;

            gl_FragColor = vec4(col, 1.0);
          }
        `,
        side: THREE.FrontSide,
      });

      const geo = new THREE.PlaneGeometry(fw, fd, 1, 1);
      const mesh = new THREE.Mesh(geo, groundMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(num(o.x), 0, num(o.z));
      mesh.userData.isGround = true;
      root.add(mesh);

      // store ref so animate loop can tick time uniform
      if (!window._groundMats) window._groundMats = [];
      window._groundMats.push(groundMat);

      // thin grid overlay still shows pathfinding readability
      const grid = new THREE.GridHelper(Math.max(fw, fd), 70, "#4a7a50", "#3a6040");
      grid.position.y = 0.01;
      grid.material.transparent = true;
      grid.material.opacity = 0.22;
      root.add(grid);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);
      const x = num(o.x);
      const y = num(o.y);
      const z = num(o.z);

      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(o, "#999999"));
      mesh.position.set(x, y, z);
      root.add(mesh);

      const id = String(o.id || "");
      const isCreature = id.includes("dragon");

      if (!isCreature) {
        const roof = new THREE.Mesh(
          new THREE.BoxGeometry(w * 1.08, 0.16, d * 1.08),
          new THREE.MeshStandardMaterial({ color: "#1c2530", roughness: 0.85 })
        );
        roof.position.set(x, y + h / 2 + 0.1, z);
        root.add(roof);
}
    }

    function addWindows(x, z, w, h, d, centerY) {
      const rows = Math.max(1, Math.floor(h / 2));
      const colsFront = Math.max(2, Math.floor(w / 2));
      const colsSide = Math.max(2, Math.floor(d / 2));

      const winMat = new THREE.MeshStandardMaterial({
        color: "#e8f7ff",
        emissive: "#4d8fbd",
        emissiveIntensity: 0.35,
        roughness: 0.4
      });

      function win(wx, wy, wz, rotY) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.035), winMat);
        m.position.set(wx, wy, wz);
        m.rotation.y = rotY;
        root.add(m);
      }

      for (let r = 0; r < rows; r++) {
        const wy = centerY - h / 2 + 0.8 + r * 1.6;

        for (let c = 0; c < colsFront; c++) {
          const wx = x - w / 2 + 0.7 + c * ((w - 1.4) / Math.max(1, colsFront - 1));
          win(wx, wy, z - d / 2 - 0.025, 0);
          win(wx, wy, z + d / 2 + 0.025, Math.PI);
        }

        for (let c = 0; c < colsSide; c++) {
          const wz = z - d / 2 + 0.7 + c * ((d - 1.4) / Math.max(1, colsSide - 1));
          win(x - w / 2 - 0.025, wy, wz, Math.PI / 2);
          win(x + w / 2 + 0.025, wy, wz, -Math.PI / 2);
        }
      }
    }

      );

      state.prev.copy(baseNow);
      state.next.copy(target);
      state.time = now;
    }

    function makeScaleTexture(baseColor) {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#" + baseColor.getHexString();
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "rgba(0,0,0,0.75)";
      ctx.lineWidth = 4;

      for (let y = -16; y < size + 16; y += 16) {
        for (let x = -16; x < size + 16; x += 16) {
          const ox = ((y / 16) % 2) * 8;
          ctx.beginPath();
          ctx.arc(x + ox, y, 11, 0, Math.PI);
          ctx.stroke();
        }
      }

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let y = 0; y < size; y += 16) {
        for (let x = 0; x < size; x += 16) {
          ctx.beginPath();
          ctx.arc(x + 4, y + 4, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 7);
      return tex;
    }

    function damageAgent(state, amount, reason = "damage") {
      if (!state || !state.group) return;
      if (state.group.userData.dead) return;

      const hp = Number(state.group.userData.hp ?? 100);
      const nextHp = Math.max(0, hp - amount);

      state.group.userData.hp = nextHp;
      state.group.userData.lastDamageReason = reason;
      state.group.userData.lastDamageTime = performance.now();

      if (nextHp <= 0) {
        state.group.userData.dead = true;
        state.group.userData.deathTime = performance.now();

        if (state.prev) state.prev.copy(state.group.position);
        if (state.next) state.next.copy(state.group.position);
        state.time = performance.now();

        state.group.rotation.z = Math.PI / 2;
        state.group.position.y = 0.25;

        state.group.traverse(child => {
          if (child.material && child.material.opacity !== undefined) {
            child.material.transparent = true;
            child.material.opacity *= 0.45;
          }
        });
      }
    }

    function igniteAgent(state) {
      if (state.group.userData.onFire) return;

      state.group.userData.onFire = true;
      state.group.userData.fireStart = performance.now();

      const fireMat = new THREE.MeshBasicMaterial({
        color: "#ff5a18",
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const fire = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 12, 8),
        fireMat
      );

      fire.name = "burning_fire";
      fire.position.y = 0.55;
      fire.scale.set(0.8, 1.4, 0.8);
      state.group.add(fire);
    }

    function updateBurningAgents() {
      const now = performance.now();

      for (const state of agents.values()) {
        if (!state.group.userData.onFire) continue;

        const fire = state.group.getObjectByName("burning_fire");
        if (!fire) continue;

        const t = now * 0.008 + state.wanderPhase;
        fire.scale.set(
          0.75 + Math.sin(t) * 0.18,
          1.25 + Math.abs(Math.sin(t * 1.3)) * 0.45,
          0.75 + Math.cos(t) * 0.18
        );

        fire.material.opacity = 0.55 + Math.abs(Math.sin(t * 1.8)) * 0.35;

        if (!state.lastBurnTick) state.lastBurnTick = 0;
        if (now - state.lastBurnTick > 900) {
          state.lastBurnTick = now;
          damageAgent(state, 1, "burning");
        }
      }
    }

function dragonBreathHitsAgents(x, y, z, heading, dragonTeam) {
  const forwardX = Math.sin(heading);
  const forwardZ = Math.cos(heading);

  for (const state of agents.values()) {
    if (state.team === dragonTeam) continue;

    const ax = state.group.position.x;
    const ay = state.group.position.y;
    const az = state.group.position.z;

    const dx = ax - x;
    const dz = az - z;
    const dist = Math.sqrt(dx * dx + dz * dz);

    if (dist > 9.5) continue;
    if (Math.abs(ay - y) > 18) continue;

    const dot =
      (dx / Math.max(dist, 0.001)) * forwardX +
      (dz / Math.max(dist, 0.001)) * forwardZ;

    // cone in front of dragon
    if (dot > 0.58) {
      igniteAgent(state);
      damageAgent(state, 8, "dragon_fire");
    }
  }
}

    function nearestDragonTo(x, z, team) {
      let best = null;
      let bestDist = Infinity;

      for (const d of dragonFlights.values()) {
        if (d.team === team) continue;
        const dx = d.group.position.x - x;
        const dz = d.group.position.z - z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < bestDist) {
          bestDist = dist;
          best = d;
        }
      }

      return best;
    }

    function damageDragon(state, amount, reason = "hit") {
      if (!state || !state.group) return;
      if (state.dead) return;

      state.hp = Math.max(0, Number(state.hp ?? 160) - amount);

      if (state.hp <= 0) {
        state.dead = true;
        state.group.userData.dead = true;
        state.group.rotation.z = Math.PI;
        state.group.position.y = 1.2;

        state.group.traverse(child => {
          if (child.material && child.material.opacity !== undefined) {
            child.material.transparent = true;
            child.material.opacity *= 0.35;
          }
        });

        if (state.fireCone) {
          state.fireCone.material.opacity = 0;
        }
      }
    }

    function spawnSpellExplosion(pos) {
      const mat = new THREE.MeshBasicMaterial({
        color: "#88ddff",
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      for (let i = 0; i < 14; i++) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), mat.clone());
        mesh.position.copy(pos);

        const a = Math.random() * Math.PI * 2;
        const up = Math.random() * 1.2 + 0.2;
        const speed = Math.random() * 2.2 + 1.0;

        root.add(mesh);

        spellExplosions.push({
          mesh,
          vx: Math.cos(a) * speed,
          vy: up,
          vz: Math.sin(a) * speed,
          born: performance.now(),
          life: 650
        });
      }
    }

    function updateSpellExplosions() {
      const now = performance.now();

      for (let i = spellExplosions.length - 1; i >= 0; i--) {
        const e = spellExplosions[i];
        const age = now - e.born;
        const t = age / e.life;

        if (t >= 1) {
          root.remove(e.mesh);
          e.mesh.geometry?.dispose?.();
          e.mesh.material?.dispose?.();
          spellExplosions.splice(i, 1);
          continue;
        }

        e.mesh.position.x += e.vx * 0.035;
        e.mesh.position.y += e.vy * 0.035;
        e.mesh.position.z += e.vz * 0.035;
        e.vy -= 0.025;

        const fade = 1 - t;
        e.mesh.material.opacity = fade;
        e.mesh.scale.setScalar(1 + t * 2.5);
      }
    }

    function updateSummons() {
      const now = performance.now();

      for (let i = summons.length - 1; i >= 0; i--) {
        const summon = summons[i];
        const age = now - summon.born;
        const t = age / summon.life;

        if (t >= 1) {
          spawnSpellExplosion(summon.group.position);
          root.remove(summon.group);
          summon.group.traverse(child => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose?.());
            } else {
              child.material?.dispose?.();
            }
          });
          summons.splice(i, 1);
          continue;
        }

        const rise = Math.min(1, age / 3600);
        const easeRise = rise * rise * (3 - 2 * rise);

        const start = summon.start || summon.group.position;
        const spiral = age * 0.006 + summon.phase;

        summon.group.position.set(
          start.x + Math.cos(spiral) * rise * 4.5,
          start.y + easeRise * 32.0,
          start.z + Math.sin(spiral) * rise * 4.5
        );

        summon.group.rotation.y += 0.22;
        summon.group.rotation.z = Math.sin(age * 0.018) * 0.75;

        const summonScale = 0.6 + rise * 2.8;
        summon.group.scale.setScalar(summonScale);

        if (age % 180 < 35) {
          spawnSpellExplosion(summon.group.position);
        }

        const leftWing = summon.group.getObjectByName("phoenix_left_wing");
        const rightWing = summon.group.getObjectByName("phoenix_right_wing");
        const aura = summon.group.getObjectByName("phoenix_aura");

        const flap = Math.sin(now * 0.012 + summon.phase);

        if (leftWing) {
          leftWing.rotation.z = Math.PI / 2 + flap * 1.05;
          leftWing.rotation.x = flap * 0.45;
        }

        if (rightWing) {
          rightWing.rotation.z = -Math.PI / 2 - flap * 1.05;
          rightWing.rotation.x = -flap * 0.45;
        }

        if (aura) {
          const pulse = 1.0 + Math.abs(Math.sin(now * 0.006)) * 0.35;
          aura.scale.setScalar(pulse);
          aura.material.opacity = 0.10 + Math.abs(Math.sin(now * 0.006)) * 0.12;
        }

        if (!summon.exploded && age > 4100) {
          summon.exploded = true;

          for (const state of agents.values()) {
            if (state.group.userData.dead) continue;

            const dist = summon.group.position.distanceTo(state.group.position);
            if (dist > 18) continue;

            if (state.team === summon.team) {
              const maxHp = Number(state.group.userData.maxHp ?? 100);
              const hp = Number(state.group.userData.hp ?? 100);
              state.group.userData.hp = Math.min(maxHp, hp + 18);
              state.group.userData.lastDamageTime = performance.now();
            } else {
              damageAgent(state, 22, "phoenix_explosion");
              igniteAgent(state);
            }
          }

          for (let boom = 0; boom < 12; boom++) {
            spawnSpellExplosion(summon.group.position);
          }

          summon.group.visible = false;
        }
      }
    }

    function updateWizardSpells() {
      const now = performance.now();

      for (const state of agents.values()) {
        if (state.group.userData.dead) continue;

        const role = String(state.group.userData.role || "");

        if (role !== "wizard") continue;

        if (!state.lastSpell) state.lastSpell = 0;
        if (!state.lastSummon) state.lastSummon = 0;

        if (now - state.lastSummon > 14000 + Math.abs(Math.sin(state.wanderPhase || 0)) * 4000) {
          state.lastSummon = now;
          spawnPhoenixSummon(state);
        }

        if (now - state.lastSpell > 1800 + (state.wanderPhase || 0) * 250) {
          const target = nearestDragonTo(state.group.position.x, state.group.position.z, state.team);
          if (target) {
            state.lastSpell = now;
            spawnWizardSpell(state, target);
          }
        }
      }

      for (let i = wizardSpells.length - 1; i >= 0; i--) {
        const spell = wizardSpells[i];
        const raw = (now - spell.created) / spell.duration;

        if (raw >= 1) {
          spawnSpellExplosion(spell.target);
          damageDragon(spell.targetState, 6, "wizard_spell");
          root.remove(spell.mesh);
          spell.mesh.geometry?.dispose?.();
          spell.mesh.material?.dispose?.();
          wizardSpells.splice(i, 1);
          continue;
        }

        const t = raw * raw * (3 - 2 * raw);

        spell.mesh.position.set(
          spell.start.x + (spell.target.x - spell.start.x) * t,
          spell.start.y + (spell.target.y - spell.start.y) * t,
          spell.start.z + (spell.target.z - spell.start.z) * t
        );

        const pulse = 1 + Math.sin(now * 0.03) * 0.35;
        spell.mesh.scale.set(pulse, pulse, pulse);
      }
    }

    function updateDragonFlights() {
      const t = performance.now() * 0.001;

      for (const state of dragonFlights.values()) {
        if (state.dead) continue;

        const p = state.phase;

        const speedX = 0.55 + Math.sin(p + 1) * 0.22;
        const speedZ = 0.48 + Math.cos(p + 2) * 0.18;

        const x =
          state.baseX +
          Math.sin(p + t * speedX) * 12.0 +
          Math.sin(p * 1.7 + t * 1.55) * 3.6;

        const z =
          state.baseZ +
          Math.cos(p + t * speedZ) * 10.0 +
          Math.sin(p * 2.1 + t * 1.35) * 3.2;

        const y =
          16 +
          Math.sin(p + t * 0.9) * 5.2 +
          Math.sin(p * 1.3 + t * 2.6) * 1.2;

        const vx =
          Math.cos(p + t * speedX) * 12.0 +
          Math.cos(p * 1.7 + t * 1.55) * 3.6;

        const vz =
          -Math.sin(p + t * speedZ) * 10.0 +
          Math.cos(p * 2.1 + t * 1.35) * 3.2;

        state.group.position.set(x, y, z);
        state.group.rotation.y = Math.atan2(vx, vz) + Math.PI;

        const heading = state.group.rotation.y;
        const fireCycle = Math.sin(t * 0.7 + p * 1.9);
        const isBreathingFire = fireCycle > 0.86;

        if (state.fireCone) {
          const firePower = isBreathingFire ? (fireCycle - 0.86) / 0.14 : 0;
          state.fireCone.material.opacity = firePower * 0.9;
          state.fireCone.scale.set(
            0.7 + firePower * 1.4,
            0.7 + firePower * 1.7,
            0.7 + firePower * 1.7
          );
        }

        
        if (Math.random() < 0.002) {
          spawnDragonShockwave(x, y, z, state.team);
        }

        if (isBreathingFire && performance.now() - state.lastFire > 500) {
          state.lastFire = performance.now();
          dragonBreathHitsAgents(x, y, z, heading, state.team);
        }

        const flap = Math.sin(t * 7 + p);
        const wingL = state.group.getObjectByName("wing_l");
        const wingR = state.group.getObjectByName("wing_r");

        if (wingL && wingR) {
          wingL.position.y = 0.2 + flap * 1.2;
          wingR.position.y = 0.2 + flap * 1.2;
          wingL.rotation.z = flap * 0.25;
          wingR.rotation.z = -flap * 0.25;
        }
      }
    }

    async function loadScene() {
      try {
        const res = await fetch("/api/scene?file=" + encodeURIComponent(sceneFile) + "&cacheBust=" + Date.now());

        if (!res.ok) {
          throw new Error("Scene API returned " + res.status + " " + res.statusText);
        }

        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error("Scene API did not return an array: " + JSON.stringify(data).slice(0, 300));
        }

        if (isDragonScene) {
          if (!staticBuilt) {
            clearRoot();
            agents.clear();
            dragons.clear();
            dragonFlights.clear();
            staticBuilt = false;
          }
        }

        if (!staticBuilt) {
          clearRoot();
          agents.clear();
          root.add(playerGroup);
          spawnBuilderSquads();
        }

        for (const item of data) {
          if (!Array.isArray(item)) continue;
          const o = pairsToObj(item);

          if (o.type === "dragon_flight") {
            addDragonFlight(o);
            continue;
          }

          if (o.type === "dragon") {
            addDragon(o);
            continue;
          }

          if (o.type === "agent" || o.type === "person") {
            addPerson(o);
            continue;
          }

          if (staticBuilt) continue;

          if (o.type === "floor") addFloor(o);
          else if (o.type === "box") addBox(o);
          else if (o.type === "cube") addBox({ ...o, w: o.size, h: o.size, d: o.size });
          else if (o.type === "location") addLocation(o);
          else if (o.type === "route") addRoute(o);
        }

        staticBuilt = true;
      } catch (err) {
        console.warn("Simla3D scene load warning:", err);
      }
    }

    function npcLine(id, target) {
      if (id.startsWith("civ_")) {
        const idx = parseInt(id.split("_")[1]) || 0;
        return CIVILIAN_DIALOGUES[idx % CIVILIAN_DIALOGUES.length];
      }
      if (id.startsWith("builder_")) return `I'm building defenses as fast as I can. Stand clear!`;
      if (id.startsWith("m")) return `I'm just hanging around the mall. It has been busy today.`;
      if (id.startsWith("n")) return `North mall is quieter, but I like walking over there.`;
      if (id.startsWith("p")) return `The park is the best place to slow down for a minute.`;
      if (id.startsWith("r")) return `I live around here. The neighborhood is getting crowded.`;
      if (id.startsWith("s")) return `I'm heading through town toward ${target}.`;
      if (id.startsWith("c")) return `I'm near the civic district today. Lots of people moving around.`;
      if (id.startsWith("q")) return `This side of the city is growing fast.`;
      return `I'm on my way to ${target}.`;
    }

    const isoTarget = { x: 42, z: 42 };
    let isoHeight = 34;
    let jumpVY = 0;
    let jumpY = 1;
    let jumpsLeft = 2;
    let spaceWasDown = false;
    const GROUND_Y = 1;
    const GRAVITY = 0.012;
    const JUMP_FORCE = 0.22;

    function updateCamera() {
      if (viewMode === "iso") {
        const speed = keys.has("shift") ? 0.55 : 0.22;

        let mx = 0;
        let mz = 0;

        if (keys.has("w")) mz -= 1;
        if (keys.has("s")) mz += 1;
        if (keys.has("d")) mx += 1;
        if (keys.has("a")) mx -= 1;

        mx += moveStick.x;
        mz += moveStick.y;

        const mag = Math.hypot(mx, mz);
        if (mag > 1) { mx /= mag; mz /= mag; }

        isoTarget.x += mx * speed;
        isoTarget.z += mz * speed;

        camera.position.set(isoTarget.x, isoHeight, isoTarget.z + isoHeight * 0.24);
        camera.lookAt(isoTarget.x, 0, isoTarget.z);
        return;
      }

      yaw -= lookStick.x * 0.008;
      pitch -= lookStick.y * 0.007;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const speed = keys.has("shift") ? 0.08 : 0.035;

      let moveForward = 0;
      let moveRight = 0;

      if (keys.has("w")) moveForward -= 1;
      if (keys.has("s")) moveForward += 1;
      if (keys.has("d")) moveRight += 1;
      if (keys.has("a")) moveRight -= 1;

      moveForward += moveStick.y;
      moveRight += moveStick.x;

      const mag = Math.hypot(moveForward, moveRight);
      if (mag > 1) {
        moveForward /= mag;
        moveRight /= mag;
      }

      // move the player in the world
      playerGroup.position.addScaledVector(forward, moveForward * speed);
      playerGroup.position.addScaledVector(right, moveRight * speed);

      // double jump
      const spaceDown = keys.has(" ");
      if (spaceDown && !spaceWasDown && jumpsLeft > 0) {
        jumpVY = JUMP_FORCE;
        jumpsLeft--;
      }
      spaceWasDown = spaceDown;
      jumpVY -= GRAVITY;
      jumpY += jumpVY;
      if (jumpY <= GROUND_Y) {
        jumpY = GROUND_Y;
        jumpVY = 0;
        jumpsLeft = 2;
      }

      playerGroup.position.y = jumpY;
      playerGroup.rotation.y = yaw + Math.PI;

      // 3rd-person camera: sit 5 units behind and 2.5 units above player
      const camBack = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      camera.position.set(
        playerGroup.position.x + camBack.x * 5,
        playerGroup.position.y + 2.5,
        playerGroup.position.z + camBack.z * 5
      );
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function updateDragonHealthBars() {
      for (const state of dragons.values()) {
        const bar = state.group.userData.hpBar;
        const fill = state.group.userData.hpFill;
        if (!bar || !fill) continue;

        bar.lookAt(camera.position);

        const hp = Number(state.hp ?? 1200);
        const maxHp = Math.max(1, Number(state.maxHp ?? 1200));
        const pct = Math.max(0.03, Math.min(1, hp / maxHp));

        fill.scale.x = pct;
        fill.position.x = -2.62 * (1 - pct);
      }

      for (const state of dragonFlights.values()) {
        const bar = state.group.userData.hpBar;
        const fill = state.group.userData.hpFill;
        if (!bar || !fill) continue;

        bar.lookAt(camera.position);

        const hp = Number(state.hp ?? 1200);
        const maxHp = Math.max(1, Number(state.maxHp ?? 1200));
        const pct = Math.max(0.03, Math.min(1, hp / maxHp));

        fill.scale.x = pct;
        fill.position.x = -2.62 * (1 - pct);
      }
    }

    function updateDragons() {
      const now = performance.now();
      const duration = 220;

      for (const state of dragons.values()) {
        if (state.group.userData.dead) {
          continue;
        }

        const raw = (now - state.time) / duration;

        // allow slight extrapolation so dragons never stop between samples
        const t = Math.min(raw, 1.35);

        let drx = state.prev.x + (state.next.x - state.prev.x) * t;
        let dry = state.prev.y + (state.next.y - state.prev.y) * t;
        let drz = state.prev.z + (state.next.z - state.prev.z) * t;

        // ── Dragon structure avoidance ──
        // Push dragon away from any structure within its collision radius
        for (const b of defenseBarriers) {
          if (!b.built) continue;
          const bx = b.mesh.position.x, bz = b.mesh.position.z;
          // collision radius = rough half-footprint of structure at 3× scale
          const stType = b.structureType;
          const colR = stType === 'gatehouse' ? 10 : stType === 'wall_section' ? 9
            : stType === 'palisade_row' ? 9 : stType === 'sandbag_nest' ? 7
            : stType === 'covered_shelter' ? 7 : stType === 'watch_tower' ? 5 : 6;
          const ddx = drx - bx, ddz = drz - bz;
          const ddist = Math.hypot(ddx, ddz);
          if (ddist < colR && ddist > 0.01) {
            // Also push up so dragons fly over rather than through
            const push = (colR - ddist) * 0.4;
            drx += (ddx / ddist) * push;
            drz += (ddz / ddist) * push;
            if (dry < b.mesh.position.y + 8) dry += push * 0.5;
          }
        }

        state.group.position.set(drx, dry, drz);

        let delta = state.nextHeading - state.prevHeading;
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;

        state.group.rotation.y = state.prevHeading + delta * t;
      }
    }

    function updateAgents() {
      const now = performance.now();
      const seconds = now * 0.001;
      const duration = 650;

      for (const state of agents.values()) {
        if (state.group.userData.dead) {
          // release any claimed perch so others can use it
          if (state._perch) { state._perch.slot.occupant = null; state._perch = null; }
          continue;
        }

        const raw = (now - state.time) / duration;
        const t = Math.min(raw, 1.25);

        const baseX = state.prev.x + (state.next.x - state.prev.x) * t;
        const baseY = state.prev.y + (state.next.y - state.prev.y) * t;
        const baseZ = state.prev.z + (state.next.z - state.prev.z) * t;

        const phase = state.wanderPhase || 0;
        const radius = state.wanderRadius || 2;

        const wanderX =
          Math.sin(phase + seconds * 0.55) * radius +
          Math.sin(phase * 1.7 + seconds * 1.05) * radius * 0.35;

        const wanderZ =
          Math.cos(phase + seconds * 0.48) * radius +
          Math.sin(phase * 2.2 + seconds * 0.9) * radius * 0.3;

        let finalX = baseX + wanderX;
        let finalZ = baseZ + wanderZ;

        const role = String(state.group.userData.role || "");
        const hp    = Number(state.group.userData.hp   ?? 100);
        const maxHp = Math.max(1, Number(state.group.userData.maxHp ?? 100));
        const hpPct = hp / maxHp;

        // ── Cover-seeking decision ──
        // Build per-agent threat level: enemy dragons alive + enemy archers alive
        if (!state._threatTimer) state._threatTimer = 0;
        if (now - state._threatTimer > 1500) {
          state._threatTimer = now;
          let threat = 0;
          for (const ds of dragons.values()) {
            if (ds.group && ds.team !== state.team) threat += 1;
          }
          for (const other of agents.values()) {
            if (!other.group.userData.dead && other.team !== state.team &&
                String(other.group.userData.role || "") === "archer") threat += 0.5;
          }
          state._threat = threat;
        }
        const threat = state._threat || 0;

        const wantsCover = (role === "archer" && threat >= 1)
                        || (role === "warrior" && hpPct < 0.4 && threat >= 1)
                        || (role !== "builder" && hpPct < 0.25);

        // ── Release perch if no longer wanting cover or structure destroyed ──
        if (!wantsCover && state._perch) {
          state._perch.slot.occupant = null;
          state._perch = null;
          state._coverTarget = null;
        }

        // ── Re-evaluate cover/perch target every ~2 s ──
        if (!state._coverLastCheck) state._coverLastCheck = 0;
        if (wantsCover && now - state._coverLastCheck > 2000) {
          state._coverLastCheck = now;

          // Score every available perch slot; archers strongly favour height
          let bestScore = -Infinity, bestSlot = null, bestBarrier = null;
          const ax = state.group.position.x, az = state.group.position.z;
          const _wp = new THREE.Vector3();

          for (const b of defenseBarriers) {
            if (b.team !== state.team || !b.built) continue;
            for (const slot of b.perches) {
              if (slot.occupant !== null && slot.occupant !== state) continue;
              _wp.set(slot.lx, slot.ly, slot.lz);
              b.mesh.localToWorld(_wp);
              const dist = Math.hypot(_wp.x - ax, _wp.z - az);
              const elevBonus = (role === "archer") ? slot.elevScore * 3 : 0;
              const score = elevBonus - dist * 0.15;
              if (score > bestScore) {
                bestScore = score; bestSlot = slot; bestBarrier = b;
              }
            }
          }

          // Release old perch if switching
          if (state._perch && state._perch.slot !== bestSlot) {
            state._perch.slot.occupant = null;
            state._perch = null;
          }

          if (bestSlot) {
            bestSlot.occupant = state;
            state._perch = { slot: bestSlot, barrier: bestBarrier };
            state._coverTarget = bestBarrier;
          }
        }
        if (!wantsCover) state._coverTarget = null;

        let perchY = null; // set below if on a perch

        if (state._perch) {
          const { slot, barrier } = state._perch;
          // Guard: if barrier was evicted from defenseBarriers, release it
          if (!defenseBarriers.includes(barrier)) {
            slot.occupant = null;
            state._perch = null;
            state._coverTarget = null;
          } else {
            const _wp2 = new THREE.Vector3(slot.lx, slot.ly, slot.lz);
            barrier.mesh.localToWorld(_wp2);
            // Sanity-clamp: never send an agent higher than 30 world units
            perchY = Math.min(_wp2.y, 30);

            const ddx = _wp2.x - finalX, ddz = _wp2.z - finalZ;
            const ddist = Math.hypot(ddx, ddz);
            if (ddist > 0.4) {
              const spd = ddist > 6 ? 0.7 : 0.5;
              finalX += (ddx / ddist) * spd;
              finalZ += (ddz / ddist) * spd;
            } else {
              finalX = _wp2.x; finalZ = _wp2.z;
            }
          }
        } else if (state._coverTarget) {
          // Ground-level cover — cluster tightly around structure footprint
          // footprint radius based on structure type (local half-width × 3 scale + small margin)
          const stType = state._coverTarget.structureType;
          const footR = stType === 'gatehouse' ? 8 : stType === 'wall_section' ? 7
            : stType === 'sandbag_nest' ? 5 : stType === 'covered_shelter' ? 5
            : stType === 'watch_tower' ? 3 : 4; // barricade / palisade
          const cx = state._coverTarget.mesh.position.x;
          const cz = state._coverTarget.mesh.position.z;
          // unique slot angle per agent, ring at edge of footprint
          const slotAngle = (state.wanderPhase || 0) * 2.5;
          const destX = cx + Math.cos(slotAngle) * footR;
          const destZ = cz + Math.sin(slotAngle) * footR;
          const ddx = destX - finalX, ddz = destZ - finalZ;
          const ddist = Math.hypot(ddx, ddz);
          if (ddist > 0.4) {
            finalX += (ddx / ddist) * 0.58;
            finalZ += (ddz / ddist) * 0.58;
          } else {
            finalX = destX; finalZ = destZ;
          }
        } else {
          // Normal: charge toward nearest living enemy center
          let enemyCx = 0;
          let enemyCz = 0;
          let enemyCount = 0;

          for (const other of agents.values()) {
            if (other === state) continue;
            if (other.group.userData.dead) continue;
            if (other.team === state.team) continue;
            enemyCx += other.group.position.x;
            enemyCz += other.group.position.z;
            enemyCount++;
          }

          if (enemyCount > 0) {
            enemyCx /= enemyCount;
            enemyCz /= enemyCount;
            const dxEnemy = enemyCx - finalX;
            const dzEnemy = enemyCz - finalZ;
            const distEnemy = Math.hypot(dxEnemy, dzEnemy);
            if (distEnemy > 0.01) {
              const chargeSpeed = state.team === 1 ? 0.42 : 0.36;
              finalX += (dxEnemy / distEnemy) * chargeSpeed;
              finalZ += (dzEnemy / distEnemy) * chargeSpeed;
            }
          }
        } // end cover/perch/charge

        // simple crowd avoidance (skip when on perch — they should stay put)
        if (!state._perch) {
        for (const other of agents.values()) {
          if (other === state) continue;

          const ox = other.group.position.x;
          const oz = other.group.position.z;
          const dxAway = finalX - ox;
          const dzAway = finalZ - oz;
          const distSq = dxAway * dxAway + dzAway * dzAway;

          if (distSq > 0.0001 && distSq < 4.0) {
            const dist = Math.sqrt(distSq);
            const push = (2.0 - dist) * 0.35;

            finalX += (dxAway / dist) * push;
            finalZ += (dzAway / dist) * push;
          }
        }
        } // end crowd avoidance

        const oldX = state.group.position.x;
        const oldZ = state.group.position.z;

        // Use perchY override when standing on a structure, else normal baseY
        const finalY = (perchY !== null) ? perchY : baseY;
        state.group.position.set(finalX, finalY, finalZ);

        const dx = state.group.position.x - oldX;
        const dz = state.group.position.z - oldZ;
        const speed = Math.sqrt(dx * dx + dz * dz);

        if (speed > 0.0005) {
          state.group.rotation.y = Math.atan2(dx, dz);
        }

        const parts = state.group.userData.parts;
        if (!parts) continue;

        if (parts.healthBack) {
          parts.healthBack.lookAt(camera.position);
        }

        if (parts.healthFill) {
          parts.healthFill.lookAt(camera.position);
          const hp = Number(state.group.userData.hp ?? 100);
          const maxHp = Math.max(1, Number(state.group.userData.maxHp ?? 100));
          const pct = Math.max(0.03, Math.min(1, hp / maxHp));

          parts.healthFill.scale.x = pct;
          parts.healthFill.position.x = -0.52 * (1 - pct);

          if (pct > 0.6) {
            parts.healthFill.material.color.set("#33ff66");
          } else if (pct > 0.3) {
            parts.healthFill.material.color.set("#ffd43b");
          } else {
            parts.healthFill.material.color.set("#ff3333");
          }

          const lastDamageTime = Number(state.group.userData.lastDamageTime || 0);
          const damageAge = performance.now() - lastDamageTime;

          if (damageAge < 180) {
            parts.healthFill.material.color.set("#ffffff");
            parts.healthFill.scale.y = 1.8;
          } else {
            parts.healthFill.scale.y = 1.0;
          }
        }

        state.group.userData.walkPhase += 0.08;
        const phaseWalk = state.group.userData.walkPhase;
        const swing = Math.sin(phaseWalk) * 0.28;
        const bob = Math.abs(Math.sin(phaseWalk)) * 0.035;

        parts.leftArm.rotation.x = swing;
        parts.rightArm.rotation.x = -swing;
        parts.leftLeg.rotation.x = -swing * 0.75;
        parts.rightLeg.rotation.x = swing * 0.75;
        parts.leftFoot.rotation.x = -swing * 0.25;
        parts.rightFoot.rotation.x = swing * 0.25;
        parts.torso.position.y = 0.45 + bob;
        parts.head.position.y = 0.98 + bob;
      }
    }

    

    // ===== WARRIOR MELEE SYSTEM =====

    function nearestEnemyAgentTo(x, z, team, maxRange = Infinity) {
      let best = null;
      let bestDist = maxRange;

      for (const other of agents.values()) {
        if (other.team === team) continue;
        if (other.group.userData.dead) continue;

        const dx = other.group.position.x - x;
        const dz = other.group.position.z - z;
        const dist = Math.hypot(dx, dz);

        if (dist < bestDist) {
          bestDist = dist;
          best = other;
        }
      }

      return best;
    }

    function spawnMeleeSlash(pos, team) {
      const mat = new THREE.MeshBasicMaterial({
        color: team === 0 ? "#ff5555" : "#55aaff",
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const slash = new THREE.Mesh(
        new THREE.TorusGeometry(0.75, 0.035, 8, 32, Math.PI * 1.25),
        mat
      );

      slash.position.copy(pos);
      slash.position.y += 0.8;
      slash.rotation.x = Math.PI / 2;
      root.add(slash);

      spellExplosions.push({
        mesh: slash,
        vx: 0,
        vy: 0,
        vz: 0,
        born: performance.now(),
        life: 260
      });
    }

    function updateWarriorMelee() {
      const now = performance.now();

      for (const state of agents.values()) {
        if (state.group.userData.dead) continue;

        const role = String(state.group.userData.role || "");
        if (role !== "warrior") continue;

        if (!state.lastMelee) state.lastMelee = 0;

        const target = nearestEnemyAgentTo(
          state.group.position.x,
          state.group.position.z,
          state.team,
          2.2
        );

        if (!target) continue;

        const dx = target.group.position.x - state.group.position.x;
        const dz = target.group.position.z - state.group.position.z;
        state.group.rotation.y = Math.atan2(dx, dz);

        if (now - state.lastMelee > 850) {
          state.lastMelee = now;

          damageAgent(target, 14, "warrior_melee");
          spawnMeleeSlash(target.group.position, state.team);
        }
      }
    }


    // ===== ARCHER ARROW SYSTEM =====

    const archerArrows = [];

    function spawnArrow(from, toState, team) {
      const arrowGroup = new THREE.Group();

      // shaft
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.025, 0.9, 6),
        new THREE.MeshStandardMaterial({ color: "#8b6914", roughness: 0.8 })
      );
      arrowGroup.add(shaft);

      // tip
      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(0.045, 0.2, 6),
        new THREE.MeshStandardMaterial({ color: "#c0c0c0", metalness: 0.8, roughness: 0.2 })
      );
      tip.position.y = 0.55;
      arrowGroup.add(tip);

      // fletching
      const fletchMat = new THREE.MeshBasicMaterial({
        color: team === 0 ? "#cc3333" : "#3366cc",
        side: THREE.DoubleSide
      });
      for (let i = 0; i < 3; i++) {
        const fletch = new THREE.Mesh(
          new THREE.PlaneGeometry(0.14, 0.22),
          fletchMat
        );
        fletch.position.y = -0.38;
        fletch.rotation.y = (i / 3) * Math.PI * 2;
        fletch.rotation.x = 0.3;
        arrowGroup.add(fletch);
      }

      arrowGroup.position.copy(from);
      arrowGroup.position.y += 0.9;
      root.add(arrowGroup);

      archerArrows.push({
        group: arrowGroup,
        targetState: toState,
        start: arrowGroup.position.clone(),
        born: performance.now(),
        duration: 480 + from.distanceTo(toState.group.position) * 14,
        team,
        hit: false
      });
    }

    function updateArcherArrows() {
      const now = performance.now();

      // fire new arrows from archers
      for (const state of agents.values()) {
        if (state.group.userData.dead) continue;
        const role = String(state.group.userData.role || "");
        if (role !== "archer") continue;

        if (!state.lastArrow) state.lastArrow = Math.random() * 1200;

        if (now - state.lastArrow > 1200 + (state.wanderPhase || 0) * 300) {
          const target = nearestEnemyAgentTo(
            state.group.position.x,
            state.group.position.z,
            state.team,
            28
          );
          if (target) {
            state.lastArrow = now;
            // face target
            const dx = target.group.position.x - state.group.position.x;
            const dz = target.group.position.z - state.group.position.z;
            state.group.rotation.y = Math.atan2(dx, dz);
            spawnArrow(state.group.position, target, state.team);

            // animate bow string pull
            const bow = state.group.getObjectByName("archer_bow");
            if (bow) {
              const str = bow.getObjectByName("archer_bow_string");
              if (str) {
                str.scale.x = 0.6;
                setTimeout(() => { if (str) str.scale.x = 1; }, 200);
              }
            }
          }
        }
      }

      // move arrows in flight
      for (let i = archerArrows.length - 1; i >= 0; i--) {
        const arrow = archerArrows[i];
        const age = now - arrow.born;
        const t = age / arrow.duration;

        if (t >= 1 || arrow.hit) {
          root.remove(arrow.group);
          arrow.group.traverse(c => { c.geometry?.dispose?.(); c.material?.dispose?.(); });
          archerArrows.splice(i, 1);

          if (!arrow.hit && arrow.targetState && !arrow.targetState.group.userData.dead) {
            damageAgent(arrow.targetState, 18, "arrow");
            spawnSpellExplosion(arrow.targetState.group.position);
          }
          continue;
        }

        const targetPos = arrow.targetState.group.position.clone();
        targetPos.y += 0.9;

        // arc: lerp x/z, parabola on y
        const x = arrow.start.x + (targetPos.x - arrow.start.x) * t;
        const z = arrow.start.z + (targetPos.z - arrow.start.z) * t;
        const arcY = arrow.start.y + (targetPos.y - arrow.start.y) * t
          + Math.sin(t * Math.PI) * 3.5;

        arrow.group.position.set(x, arcY, z);

        // orient arrow along velocity
        const nx = targetPos.x - arrow.start.x;
        const nz = targetPos.z - arrow.start.z;
        const ny = (targetPos.y - arrow.start.y) + Math.cos(t * Math.PI) * 3.5 * (Math.PI / arrow.duration) * arrow.duration;
        arrow.group.rotation.y = Math.atan2(nx, nz);
        arrow.group.rotation.x = -Math.atan2(arcY - (t > 0.01 ? (arrow.start.y + (targetPos.y - arrow.start.y) * (t - 0.01) + Math.sin((t - 0.01) * Math.PI) * 3.5) : arrow.start.y), Math.hypot(nx, nz) * 0.01 + 0.001);

        // barrier hit detection: arrows blocked by enemy-team's barriers
        if (!arrow.hit) {
          for (const b of defenseBarriers) {
            if (b.team === arrow.team) continue; // only block arrows heading toward this team's barriers
            if (!b.built) continue;
            const dist = Math.hypot(
              arrow.group.position.x - b.mesh.position.x,
              arrow.group.position.z - b.mesh.position.z
            );
            if (dist < 1.4 && arcY < 2.2) {
              arrow.hit = true;
              b.hp -= 18;
              spawnSpellExplosion(arrow.group.position);
              break;
            }
          }
        }

        // hit detection: within 1.2 units
        if (arrow.targetState && !arrow.targetState.group.userData.dead) {
          const dist = arrow.group.position.distanceTo(arrow.targetState.group.position);
          if (dist < 1.2) {
            arrow.hit = true;
            damageAgent(arrow.targetState, 18, "arrow");
            spawnSpellExplosion(arrow.group.position);
          }
        }
      }
    }

    // ===== BUILDER DEFENSE SYSTEM =====

    const defenseBarriers = []; // { mesh, team, hp, maxHp, born, built, structureType, coverRadius, lodMesh }
    const MAX_STRUCTURES_PER_TEAM = 22; // hard cap — oldest evicted when exceeded
    let lodFrameCounter = 0;

    // track which structure type each builder builds next (cycles through variety)
    const builderStructureIndex = new Map();
    // track how many structures each builder has placed (for grid snapping)
    const builderBuildCount = new Map();

    const STRUCTURE_TYPES = ["barricade", "palisade_row", "wall_section", "sandbag_nest", "watch_tower", "covered_shelter", "gatehouse"];
    // structures that provide overhead cover against lightning/spells
    const COVER_STRUCTURES = new Set(["covered_shelter", "gatehouse"]);

    function spawnBarrier(x, z, team, structureType, faceAngle) {
      // don't stack structures too close — check ALL structures, not just same team
      // minDist accounts for 3x world scale so structures don't clip through each other
      const minDist = structureType === "gatehouse" ? 22.0
        : structureType === "palisade_row" ? 20.0
        : structureType === "wall_section" ? 18.0
        : structureType === "sandbag_nest" ? 16.0
        : structureType === "covered_shelter" ? 14.0
        : structureType === "watch_tower" ? 10.0
        : 12.0; // barricade
      for (const b of defenseBarriers) {
        if (Math.hypot(b.mesh.position.x - x, b.mesh.position.z - z) < minDist) return;
      }

      const woodMat  = new THREE.MeshStandardMaterial({ color: team === 0 ? "#7a3e12" : "#1a3a6a", roughness: 0.88 });
      const darkMat  = new THREE.MeshStandardMaterial({ color: "#3a200a", roughness: 0.95 });
      const stoneMat = new THREE.MeshStandardMaterial({ color: team === 0 ? "#8a7a6a" : "#5a6a8a", roughness: 0.92 });
      const sandMat  = new THREE.MeshStandardMaterial({ color: "#c8b87a", roughness: 0.98 });
      const ropeMat  = new THREE.MeshStandardMaterial({ color: "#8a7040", roughness: 0.97 });
      const metalMat = new THREE.MeshStandardMaterial({ color: "#555566", roughness: 0.6, metalness: 0.5 });

      const group = new THREE.Group();
      group.name = "structure_" + structureType;

      let maxHp = 120;

      if (structureType === "barricade") {
        // ── angled spike barricade with cross-planks, stakes and rope lashings ──
        maxHp = 110;
        const planks = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.5, 0.22), woodMat);
        planks.name = "planks"; planks.position.y = 0.75; group.add(planks);

        // diagonal brace planks
        for (const [ang, side] of [[0.4, -1], [-0.4, 1]]) {
          const diag = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.12, 0.2), darkMat);
          diag.position.set(side * 0.2, 0.75, 0); diag.rotation.z = ang; group.add(diag);
        }
        // wooden spikes along top
        for (let i = -1.1; i <= 1.1; i += 0.55) {
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.55, 5), darkMat);
          spike.position.set(i, 1.62, 0); group.add(spike);
        }
        // side support posts
        for (const side of [-1.3, 1.3]) {
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.9, 0.26), darkMat);
          post.position.set(side, 0.95, 0); group.add(post);
          // angled foot brace
          const foot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.1, 0.22), darkMat);
          foot.position.set(side, 0.45, 0.4); foot.rotation.x = -0.55; group.add(foot);
        }
        // rope lashings (small cylinders crossing the planks)
        for (const yp of [0.45, 1.05]) {
          const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.9, 6), ropeMat);
          rope.rotation.z = Math.PI / 2; rope.position.y = yp; group.add(rope);
        }

      } else if (structureType === "watch_tower") {
        // ── tall watch tower with open platform, roof, and ladder ──
        maxHp = 280;
        const towerH = 5.5;
        // four corner pillars
        for (const [px, pz] of [[-0.65,-0.65],[-0.65,0.65],[0.65,-0.65],[0.65,0.65]]) {
          const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.22, towerH, 0.22), stoneMat);
          pillar.position.set(px, towerH / 2, pz); group.add(pillar);
        }
        // horizontal ring beams at base, mid, top
        for (const yb of [0.55, towerH * 0.5, towerH - 0.18]) {
          for (const [rx, rz, rw, rh] of [
            [0, -0.65, 1.5, 0.14], [0, 0.65, 1.5, 0.14],
            [-0.65, 0, 0.14, 1.5], [0.65, 0, 0.14, 1.5]
          ]) {
            const beam = new THREE.Mesh(new THREE.BoxGeometry(rw, 0.14, rh), woodMat);
            beam.position.set(rx, yb, rz); group.add(beam);
          }
        }
        // diagonal cross-bracing (two sides)
        for (const [px, ang] of [[-0.65, 0.45],[0.65, -0.45]]) {
          const xbrace = new THREE.Mesh(new THREE.BoxGeometry(0.1, towerH * 0.72, 0.1), darkMat);
          xbrace.position.set(px, towerH * 0.5, 0); xbrace.rotation.x = ang; group.add(xbrace);
        }
        // platform floor
        const floor = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.14, 1.6), woodMat);
        floor.name = "planks"; floor.position.y = towerH; group.add(floor);
        // platform railings
        for (const [rox, roz, rw, rh] of [
          [0, -0.75, 1.6, 0.08], [0, 0.75, 1.6, 0.08],
          [-0.75, 0, 0.08, 1.6], [0.75, 0, 0.08, 1.6]
        ]) {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(rw, 0.5, rh), woodMat);
          rail.position.set(rox, towerH + 0.35, roz); group.add(rail);
        }
        // crenellations along the top railing
        for (let ci = -0.6; ci <= 0.6; ci += 0.4) {
          for (const [csx, csz] of [[ci, -0.75],[ci, 0.75],[-0.75, ci],[0.75, ci]]) {

      } else if (structureType === "wall_section") {

        // crenellations (merlons) along top

        }
        // arrow slits
        for (const slitX of [-1.2, 0, 1.2]) {

          slit.position.set(slitX, 1.6, 0); group.add(slit);
        }
        // side buttress piers
        for (const side of [-2.0, 2.0]) {
          const buttress = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.85, 0.95), stoneMat);

          const buttTop = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.28, 1.0), stoneMat);
          buttTop.position.set(side, 2.99, 0); group.add(buttTop);

        // walk-behind ledge on inside face
        const ledge = new THREE.Mesh(new THREE.BoxGeometry(4.1, 0.16, 0.55), woodMat);
        ledge.position.set(0, 2.55, 0.38); group.add(ledge);
        // rope-and-lantern detail
        const glow = new THREE.PointLight(team === 0 ? "#ffcc66" : "#6688ff", 0.9, 7);
        glow.name = "build_glow"; glow.position.y = 2.2; group.add(glow);

      } else if (structureType === "sandbag_nest") {
        // ── layered sandbag fighting position with stakes and planked floor ──
        maxHp = 90;
        // planked floor
        const floor = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.1, 2.8), woodMat);
        floor.position.y = 0.05; group.add(floor);
        // sandbag layers — outer ring then inner partial ring
        const bagPositions = [
          // front row
          [-1.2,0.3,-1.0],[-0.4,0.3,-1.0],[0.4,0.3,-1.0],[1.2,0.3,-1.0],
          // front second layer
          [-0.8,0.72,-1.0],[0,0.72,-1.0],[0.8,0.72,-1.0],
          // side rows
          [-1.45,0.3,-0.45],[-1.45,0.3,0.2],[-1.45,0.3,0.85],
          [1.45,0.3,-0.45],[1.45,0.3,0.2],[1.45,0.3,0.85],
          // back row partial
          [-1.0,0.3,1.15],[0,0.3,1.15],[1.0,0.3,1.15],
        ];
        for (const [bx, by, bz] of bagPositions) {
          const bag = new THREE.Mesh(new THREE.BoxGeometry(0.68 + Math.random()*0.1, 0.38, 0.52 + Math.random()*0.08), sandMat);
          bag.position.set(bx, by, bz);
          bag.rotation.y = (Math.random()-0.5)*0.3;
          group.add(bag);
        }
        // name one bag as planks for HP colouring
        group.children[1].name = "planks";
        // pointed wooden stakes in front
        for (let si = -1.2; si <= 1.2; si += 0.6) {
          const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 1.05, 5), darkMat);
          stake.position.set(si, 0.52, -1.55); stake.rotation.x = -0.35; group.add(stake);
        }
        // small crate inside
        const crate = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.4, 0.42), woodMat);
        crate.position.set(0.7, 0.45, 0.4); group.add(crate);
        // ammo barrel
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5, 10), woodMat);
        barrel.position.set(-0.6, 0.5, 0.5); group.add(barrel);
        const barrelTop = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.04, 10), metalMat);
        barrelTop.position.set(-0.6, 0.77, 0.5); group.add(barrelTop);
        const glow = new THREE.PointLight(team === 0 ? "#ffaa44" : "#4488ff", 0.6, 4);
        glow.name = "build_glow"; glow.position.set(0, 0.8, 0); group.add(glow);

      } else if (structureType === "covered_shelter") {
        // ── roofed bunker: four posts, angled plank roof, reinforced walls, protects from lightning ──

        const postH = 2.8;
        // corner posts
        for (const [px, pz] of [[-1.3,-1.0],[-1.3,1.0],[1.3,-1.0],[1.3,1.0]]) {

      } else if (structureType === "palisade_row") {
        // ── long row of sharpened palisade stakes with crossbar lashing and a forward ditch rim ──
        maxHp = 140;
        const stakeCount = 9;
        const stakeSpacing = 0.52;
        const rowWidth = stakeCount * stakeSpacing;
        for (let si = 0; si < stakeCount; si++) {
          const sx = (si - (stakeCount-1)/2) * stakeSpacing;

        for (const yb of [0.55, 1.35]) {

          bar.name = "planks"; bar.position.y = yb; group.add(bar);
          // lashing knots at each stake
          for (let si = 0; si < stakeCount; si++) {
            const lx = (si - (stakeCount-1)/2) * stakeSpacing;
            const lash = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.022, 5, 8), ropeMat);

        // forward-angled abatis stakes (shorter, diagonal)

      } else { // gatehouse
        // ── reinforced gatehouse arch with portcullis, flanking towers, and flag ──
        maxHp = 340;
        // flanking tower pillars (L & R)
        for (const sx of [-2.2, 2.2]) {
          for (const [px, pz] of [[-0.38,-0.38],[-0.38,0.38],[0.38,-0.38],[0.38,0.38]]) {
            const col = new THREE.Mesh(new THREE.BoxGeometry(0.22, 4.2, 0.22), stoneMat);
            col.position.set(sx + px, 2.1, pz); group.add(col);
          }
          // tower faces
          const face = new THREE.Mesh(new THREE.BoxGeometry(0.9, 4.2, 0.9), stoneMat);
          face.name = "planks"; face.position.set(sx, 2.1, 0); group.add(face);
          // tower battlements
          for (const bz of [-0.3, 0, 0.3]) {

            m.position.set(sx, 4.5, bz); group.add(m);

        lintel.position.y = 3.8; group.add(lintel);
        // arch sides (gate posts)
        for (const sx of [-1.25, 1.25]) {
          const gp = new THREE.Mesh(new THREE.BoxGeometry(0.55, 3.8, 0.6), stoneMat);
          gp.position.set(sx, 1.9, 0); group.add(gp);
        }
        // portcullis bars
        for (let bi = -0.8; bi <= 0.8; bi += 0.4) {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.0, 0.08), metalMat);
          bar.position.set(bi, 1.65, 0); group.add(bar);
        }
        // portcullis horizontal cross bars
        for (const yb of [0.8, 1.8, 2.8]) {
          const hbar = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.08, 0.08), metalMat);
          hbar.position.set(0, yb, 0); group.add(hbar);
