        // base foundation
        const found = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.3, 1.0), stoneMat);
        found.position.y = 0.15; group.add(found);
        // lantern above gate
        const lanternBody = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.22,0.18), metalMat);
        lanternBody.position.set(0, 4.15, 0); group.add(lanternBody);
        const glow = new THREE.PointLight(team === 0 ? "#ffcc44" : "#6699ff", 2.2, 12);
        glow.name = "build_glow"; glow.position.set(0, 4.1, 0); group.add(glow);
      }

      group.position.set(x, 0, z);
      // faceAngle puts local +Z toward enemy.
      // Structures that are WALLS (extend along X) are already correct — their flat face fronts the enemy.
      // sandbag_nest has its front row at local -Z, so flip it PI so the bags face the enemy.
      const typeYOffset = {
        barricade:       0,
        palisade_row:    0,
        wall_section:    0,
        sandbag_nest:    Math.PI,
        watch_tower:     0,
        covered_shelter: 0,
        gatehouse:       0,
      };
      group.rotation.y = (faceAngle ?? 0) + (typeYOffset[structureType] ?? 0);
      group.scale.set(3, 0.12, 3); // 3x size; starts flat, rises in update
      root.add(group);

      const coverRadius = COVER_STRUCTURES.has(structureType) ? 3.5 : 0;

      // --- build a cheap single-box LOD mesh (hidden until far away) ---
      const lodColor = team === 0 ? "#7a3e12" : "#1a3a6a";
      const lodSizes = {
        barricade:       [2.8, 1.5, 0.3],
        palisade_row:    [4.8, 2.0, 0.3],
        wall_section:    [4.2, 3.5, 0.7],
        sandbag_nest:    [3.4, 1.1, 2.8],
        watch_tower:     [1.4, 5.8, 1.4],
        covered_shelter: [2.8, 3.0, 2.2],
        gatehouse:       [5.0, 4.5, 1.0],
      };
      const [lw, lh, ld] = lodSizes[structureType] || [2, 2, 2];
      const lodMesh = new THREE.Mesh(
        new THREE.BoxGeometry(lw, lh, ld),
        new THREE.MeshStandardMaterial({ color: lodColor, roughness: 0.9 })
      );
      lodMesh.position.y = lh / 2;
      lodMesh.visible = false;
      group.add(lodMesh);

      defenseBarriers.push({ mesh: group, team, hp: maxHp, maxHp, born: performance.now(), built: false, structureType, coverRadius, lodMesh,
        // Perch slots in LOCAL (unscaled) geometry space — localToWorld handles the 3× scale at runtime.
        // Each slot: { lx, ly, lz, elevScore, occupant }
        // elevScore drives archer preference (higher = better sniper spot)
        perches: ({
          watch_tower:     [
            { lx:  0.5, ly: 5.6, lz:  0,   elevScore: 10 },
            { lx: -0.5, ly: 5.6, lz:  0,   elevScore: 10 },
            { lx:  0,   ly: 5.6, lz:  0.5, elevScore: 10 },
            { lx:  0,   ly: 5.6, lz: -0.5, elevScore: 10 },
          ],
          wall_section:    [
            { lx: -1.5, ly: 2.6, lz: 0.4, elevScore: 7 },
            { lx: -0.5, ly: 2.6, lz: 0.4, elevScore: 7 },
            { lx:  0.5, ly: 2.6, lz: 0.4, elevScore: 7 },
            { lx:  1.5, ly: 2.6, lz: 0.4, elevScore: 7 },
          ],
          gatehouse:       [
            { lx: -2.2, ly: 4.3, lz: -0.3, elevScore: 9 },
            { lx: -2.2, ly: 4.3, lz:  0.3, elevScore: 9 },
            { lx:  2.2, ly: 4.3, lz: -0.3, elevScore: 9 },
            { lx:  2.2, ly: 4.3, lz:  0.3, elevScore: 9 },
          ],
          covered_shelter: [
            { lx: -0.8, ly: 0.2, lz:  0,   elevScore: 1 },
            { lx:  0,   ly: 0.2, lz:  0,   elevScore: 1 },
            { lx:  0.8, ly: 0.2, lz:  0,   elevScore: 1 },
          ],
          sandbag_nest:    [
            { lx: -0.6, ly: 0.5, lz: 0.3, elevScore: 2 },
            { lx:  0,   ly: 0.5, lz: 0.3, elevScore: 2 },
            { lx:  0.6, ly: 0.5, lz: 0.3, elevScore: 2 },
          ],
          barricade:       [
            { lx: -0.6, ly: 0.2, lz: -0.4, elevScore: 1 },
            { lx:  0,   ly: 0.2, lz: -0.4, elevScore: 1 },
            { lx:  0.6, ly: 0.2, lz: -0.4, elevScore: 1 },
          ],
          palisade_row:    [
            { lx: -1.5, ly: 0.1, lz: 0.6, elevScore: 1 },
            { lx:  0,   ly: 0.1, lz: 0.6, elevScore: 1 },
            { lx:  1.5, ly: 0.1, lz: 0.6, elevScore: 1 },
          ],
        }[structureType] || []).map(p => ({ ...p, occupant: null })),
      });
    }

    function updateBuilderDefenses() {
      const now = performance.now();

      // builders place new structures periodically, cycling through variety
      for (const state of agents.values()) {
        if (state.group.userData.dead) continue;
        const role = String(state.group.userData.role || "");
        if (role !== "builder") continue;

        if (!state.lastBuild) state.lastBuild = Math.random() * 2000;

        const id = state.group.userData.npcId || state.group.uuid;
        if (!builderStructureIndex.has(id)) builderStructureIndex.set(id, Math.floor(Math.random() * STRUCTURE_TYPES.length));
        if (!builderBuildCount.has(id)) builderBuildCount.set(id, 0);

        // vary interval by structure type
        const curType = STRUCTURE_TYPES[builderStructureIndex.get(id) % STRUCTURE_TYPES.length];
        const typeInterval = curType === "watch_tower" ? 1400 : curType === "gatehouse" ? 2200
          : curType === "covered_shelter" ? 1200 : curType === "wall_section" ? 900
          : curType === "palisade_row" ? 600 : 400;

        if (now - state.lastBuild > typeInterval + (state.wanderPhase || 0) * 300) {
          state.lastBuild = now;

          // ── Snap-to-defensive-line placement ──
          // Find enemy center of mass
          let enemyCx = 0, enemyCz = 0, enemyCount = 0;
          for (const other of agents.values()) {
            if (other.team === state.team || other.group.userData.dead) continue;
            enemyCx += other.group.position.x;
            enemyCz += other.group.position.z;
            enemyCount++;
          }
          const myX = state.group.position.x;
          const myZ = state.group.position.z;

          let toNx = 1, toNz = 0; // default: face +x
          if (enemyCount > 0) {
            enemyCx /= enemyCount; enemyCz /= enemyCount;
            const dx = enemyCx - myX, dz = enemyCz - myZ;
            const d = Math.hypot(dx, dz) || 1;
            toNx = dx / d; toNz = dz / d;
          }
          // perpendicular (wall line runs along this)
          const perpX = -toNz, perpZ = toNx;

          // face angle: structure faces toward enemy
          const faceAngle = Math.atan2(toNx, toNz);

          // snap slot along perp axis, centered on builder
          // gridStep in world units at 3x scale — just wide enough to avoid overlap
          const gridStep = curType === "gatehouse" ? 24.0
            : curType === "palisade_row" ? 22.0
            : curType === "wall_section" ? 20.0
            : curType === "sandbag_nest" ? 18.0
            : curType === "covered_shelter" ? 16.0
            : 13.0; // barricade / watch_tower
          const buildCount = builderBuildCount.get(id);
          const slot = buildCount === 0 ? 0 : (buildCount % 2 === 1 ? Math.ceil(buildCount/2) : -Math.ceil(buildCount/2));
          // push slightly toward enemy from builder position
          const pushDist = curType === "covered_shelter" ? -2.5   // shelters behind the line
            : curType === "watch_tower" ? 0 : 2.2 + Math.random() * 1.0;
          const bx = myX + toNx * pushDist + perpX * slot * gridStep;
          const bz = myZ + toNz * pushDist + perpZ * slot * gridStep;

          // ── Distance cap: don't build more than 18 units from builder's home position ──
          const builderDef = builderDefs.find(d => d.id === id);
          const homeX = builderDef ? builderDef.x : myX;
          const homeZ = builderDef ? builderDef.z : myZ;
          const MAX_BUILD_RADIUS = 18;
          if (Math.hypot(bx - homeX, bz - homeZ) > MAX_BUILD_RADIUS) {
            // clamp onto the radius boundary instead of skipping entirely
            const clampAngle = Math.atan2(bz - homeZ, bx - homeX);
            const cbx = homeX + Math.cos(clampAngle) * MAX_BUILD_RADIUS;
            const cbz = homeZ + Math.sin(clampAngle) * MAX_BUILD_RADIUS;
            spawnBarrier(cbx, cbz, state.team, curType, faceAngle);
          } else {
            spawnBarrier(bx, bz, state.team, curType, faceAngle);
          }

          // enforce per-team cap — evict oldest if over limit
          const teamStructures = defenseBarriers.filter(b => b.team === state.team);
          if (teamStructures.length > MAX_STRUCTURES_PER_TEAM) {
            const oldest = teamStructures[0];
            root.remove(oldest.mesh);
            oldest.mesh.traverse(c => { c.geometry?.dispose?.(); c.material?.dispose?.(); });
            defenseBarriers.splice(defenseBarriers.indexOf(oldest), 1);
          }

          // advance structure type and build count
          builderStructureIndex.set(id, (builderStructureIndex.get(id) + 1) % STRUCTURE_TYPES.length);
          builderBuildCount.set(id, buildCount + 1);
        }
      }

      // animate barriers rising and handle decay
      lodFrameCounter++;
      const doLod = lodFrameCounter % 60 === 0;
      const camPos = camera.position;

      for (let i = defenseBarriers.length - 1; i >= 0; i--) {
        const b = defenseBarriers[i];
        const age = now - b.born;

        // rise over 0.5 seconds
        const rise = Math.min(1, age / 500);
        b.mesh.scale.y = rise * 3;

        // fade build glow once fully built
        const glow = b.mesh.getObjectByName("build_glow");
        if (glow) {
          glow.intensity = (1 - rise) * 1.2;
        }

        // LOD: every 60 frames swap between full detail / single box / hidden
        if (doLod) {
          const dist = camPos.distanceTo(b.mesh.position);
          const useLod = dist > 40;
          const hide   = dist > 110;
          b.lodMesh.visible = useLod && !hide;
          // toggle all direct children except the lod mesh
          b.mesh.children.forEach(c => {
            if (c === b.lodMesh) return;
            c.visible = !useLod && !hide;
          });
          b.mesh.visible = !hide;
        }

        // colour the planks to show HP
        const planks = b.mesh.getObjectByName("planks");
        if (planks && b.built) {
          const pct = b.hp / b.maxHp;
          planks.material.color.setRGB(
            b.team === 0 ? 0.55 - pct * 0.35 : 0.1,
            b.team === 0 ? 0.27 - pct * 0.15 : 0.33 + pct * 0.2,
            b.team === 0 ? 0.075 : 0.67 - pct * 0.35
          );
        }

        if (rise >= 1) b.built = true;

        // remove destroyed barriers — clear any agent perch references first
        if (b.hp <= 0) {
          // evict every agent perched on this structure back to ground
          for (const st of agents.values()) {
            if (st._perch && st._perch.barrier === b) {
              st._perch.slot.occupant = null;
              st._perch = null;
              st._coverTarget = null;
              st._coverLastCheck = 0; // force re-eval next frame
            }
          }
          spawnSpellExplosion(b.mesh.position);
          root.remove(b.mesh);
          b.mesh.traverse(c => { c.geometry?.dispose?.(); c.material?.dispose?.(); });
          defenseBarriers.splice(i, 1);
        }
      }
    }

    function updateDayNightCycle() {
      const t = performance.now() * 0.00025;
      const cycle = (Math.sin(t) + 1) * 0.5;

      // cycle: 1 = day, 0 = night
      const day = cycle;
      const night = 1 - cycle;

      scene.background = new THREE.Color(
        0.05 + day * 0.48,
        0.08 + day * 0.62,
        0.16 + day * 0.78
      );

      if (scene.fog) {
        scene.fog.color.copy(scene.background);
        scene.fog.density = 0.0015 + night * 0.006;
      }

      hemiLight.intensity = 1.8 + day * 2.2;
      hemiLight.color.setRGB(
        0.45 + day * 0.55,
        0.50 + day * 0.50,
        0.70 + day * 0.30
      );

      sun.intensity = 1.2 + day * 3.8;
      sun.position.set(
        Math.sin(t) * 28,
        8 + day * 26,
        Math.cos(t) * 28
      );

      moon.intensity = 0.15 + night * 0.85;
      moon.position.set(
        -Math.sin(t) * 24,
        10 + night * 20,
        -Math.cos(t) * 24
      );
    }

    

    // ===== DRAMATIC EFFECTS =====

    let dramaFlash = 0;

    function updateDramaEffects() {
      const now = performance.now();

      // occasional lightning flash (more frequent at night)
      const t = performance.now() * 0.00025;
      const cycle = (Math.sin(t) + 1) * 0.5;
      const night = 1 - cycle;

      if (Math.random() < 0.002 + night * 0.01) {
        dramaFlash = 1;
      }

      dramaFlash *= 0.92;

      // flash lighting boost
      if (dramaFlash > 0.02) {
        sun.intensity += dramaFlash * 2.5;
        hemiLight.intensity += dramaFlash * 1.5;
      }

      // camera shake during heavy action
      let shake = 0;

      if (night > 0.5) shake += 0.03;

      if (typeof wizardSpells !== "undefined") {
        shake += Math.min(0.05, wizardSpells.length * 0.002);
      }

      if (typeof summons !== "undefined") {
        shake += Math.min(0.06, summons.length * 0.01);
      }

      if (shake > 0) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        camera.position.z += (Math.random() - 0.5) * shake;
      }

      // slight color shift at night (more cinematic)
      if (scene.background) {
        const c = scene.background;
        c.r *= 1.0;
        c.g *= 0.95;
        c.b *= 1.05 + night * 0.2;
      }
    }


    

    // ===== DRAGON SHOCKWAVE =====

    const dragonShockwaves = [];

    function spawnDragonShockwave(x, y, z, team) {
      const mat = new THREE.MeshBasicMaterial({
        color: "#ff8844",
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(
        new THREE.RingGeometry(0.5, 0.8, 32),
        mat
      );

      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, y + 0.1, z);

      root.add(mesh);

      dragonShockwaves.push({
        mesh,
        team,
        radius: 0.5,
        max: 14,
        born: performance.now(),
        life: 900
      });
    }

    function updateDragonShockwaves() {
      const now = performance.now();

      for (let i = dragonShockwaves.length - 1; i >= 0; i--) {
        const sw = dragonShockwaves[i];
        const t = (now - sw.born) / sw.life;

        if (t >= 1) {
          root.remove(sw.mesh);
          sw.mesh.geometry.dispose();
          sw.mesh.material.dispose();
          dragonShockwaves.splice(i, 1);
          continue;
        }

        const radius = sw.max * t;
        sw.mesh.scale.set(radius, radius, radius);
        sw.mesh.material.opacity = 0.7 * (1 - t);

        for (const state of agents.values()) {
          if (state.team === sw.team) continue;
          if (state.group.userData.dead) continue;

          const dx = state.group.position.x - sw.mesh.position.x;
          const dz = state.group.position.z - sw.mesh.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < radius && dist > radius - 1.5) {
            // knockback
            const force = 0.6;
            state.group.position.x += (dx / (dist || 1)) * force;
            state.group.position.z += (dz / (dist || 1)) * force;

            // damage
            damageAgent(state, 6, "dragon_roar");

            // small explosion feedback
            spawnSpellExplosion(state.group.position);
          }
        }
      }
    }

    function spawnLightning() {
      const points = [];
      const startX = (Math.random() - 0.5) * 80;
      const startZ = (Math.random() - 0.5) * 80;

      let x = startX;
      let y = 25;
      let z = startZ;

      for (let i = 0; i < 8; i++) {
        points.push(new THREE.Vector3(x, y, z));
        x += (Math.random() - 0.5) * 2;
        z += (Math.random() - 0.5) * 2;
        y -= 3 + Math.random() * 2;
      }

      const geo = new THREE.BufferGeometry().setFromPoints(points);

      const mat = new THREE.LineBasicMaterial({
        color: "#ffffff",
        transparent: true,
        opacity: 0.9
      });

      const bolt = new THREE.Line(geo, mat);
      scene.add(bolt);

      const light = new THREE.PointLight("#ffffff", 6, 40);
      light.position.set(startX, 10, startZ);
      scene.add(light);

      lightningBolts.push({
        bolt,
        light,
        strikeX: startX,
        strikeZ: startZ,
        damaged: false,
        born: performance.now(),
        life: 180
      });
    }

    function lightningStrikeDamage(x, z) {
      const strikePos = new THREE.Vector3(x, 0.15, z);

      spawnDragonShockwave?.(x, 0.15, z, -1);

      for (const state of agents.values()) {
        if (state.group.userData.dead) continue;

        const dx = state.group.position.x - x;
        const dz = state.group.position.z - z;
        const dist = Math.hypot(dx, dz);

        if (dist <= 5) {
          // check if agent is sheltered under a cover structure (covered_shelter or gatehouse)
          let sheltered = false;
          for (const b of defenseBarriers) {
            if (!b.built || b.coverRadius <= 0) continue;
            if (b.team !== state.team) continue;
            const bDist = Math.hypot(b.mesh.position.x - state.group.position.x,
                                     b.mesh.position.z - state.group.position.z);
            if (bDist <= b.coverRadius) { sheltered = true; break; }
          }
          if (sheltered) continue; // structure roof blocks lightning

          const damage = Math.round(6 * (1 - dist / 8)) + 2;
          damageAgent(state, damage, "lightning_strike");

          const push = 0.25 * (1 - dist / 8);
          state.group.position.x += (dx / (dist || 1)) * push;
          state.group.position.z += (dz / (dist || 1)) * push;

          spawnSpellExplosion(state.group.position);
        }
      }

      const marker = new THREE.Mesh(
        new THREE.RingGeometry(0.5, 8, 40),
        new THREE.MeshBasicMaterial({
          color: "#99ccff",
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      marker.rotation.x = -Math.PI / 2;
      marker.position.copy(strikePos);
      root.add(marker);

      spellExplosions.push({
        mesh: marker,
        vx: 0,
        vy: 0,
        vz: 0,
        born: performance.now(),
        life: 420
      });
    }

    function updateCloudsAndLightning() {
      const now = performance.now();

      // drift clouds
      for (const c of clouds) {
        c.position.x += c.userData.speed;

        if (c.position.x > 80) {
          c.position.x = -80;
        }
      }

      // lightning chance (higher at night)
      const t = performance.now() * 0.00025;
      const cycle = (Math.sin(t) + 1) * 0.5;
      const night = 1 - cycle;

      if (Math.random() < 0.002 + night * 0.02) {
        spawnLightning();
      }

      // cleanup lightning
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const l = lightningBolts[i];
        const age = now - l.born;

        if (!l.damaged && age > 35) {
          l.damaged = true;
          lightningStrikeDamage(l.strikeX, l.strikeZ);
        }

        if (age > l.life) {
          scene.remove(l.bolt);
          scene.remove(l.light);
          l.bolt.geometry.dispose();
          l.bolt.material.dispose();
          lightningBolts.splice(i, 1);
        } else {
          l.bolt.material.opacity = 1 - age / l.life;
          l.light.intensity = 6 * (1 - age / l.life);
        }
      }
    }

      const _now = performance.now() * 0.001;
      if (skyDome?.material?.uniforms?.time) {

      if (window._groundMats) {
        for (const gm of window._groundMats) gm.uniforms.time.value = _now;

      requestAnimationFrame(animate);
      updateDayNightCycle();
      updateCloudsAndLightning();
      updateDramaEffects();
      if (simulationStarted) {
        updateCamera();
      }
      updateAgents();
      updateDragons();
      updateDragonFlights();
      updateDragonShockwaves();
      updateBurningAgents();
      updateWarriorMelee();
      updateArcherArrows();
      updateBuilderDefenses();
      updateWizardSpells();
      updateSummons();
      updateSpellExplosions();
      updateCivilians();
      updateInteraction();
      updatePlayerCharacter();
      cinematicPass.uniforms.time.value = _now;

    }

    function addTownBuilding(cx, cz, w, h, d, roofColor, wallColor, hasChimney, hasLight) {

      const woodMat = new THREE.MeshStandardMaterial({ color: "#5a3810", roughness: 0.9 });

      // walls
      const walls = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      walls.position.set(cx, h/2, cz);
      root.add(walls);

      // door

      door.position.set(cx, 0.7, cz + d/2 + 0.02);
      root.add(door);

        win.position.set(cx + wx, h * 0.62, cz + d/2 + 0.02);

      // gabled roof
      const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d) * 0.78, h * 0.55, 4), roofMat);
      roof.position.set(cx, h + h * 0.28, cz);

      // stone base
      const base = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.22, d + 0.1), stoneMat);
      base.position.set(cx, 0.11, cz);
      root.add(base);

      if (hasChimney) {
        const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.42, h * 0.55, 0.42), stoneMat);
        chimney.position.set(cx + w*0.28, h + h*0.15, cz - d*0.28);
        root.add(chimney);
        // smoke puff (static visual)
        const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.35, 7, 5),
          new THREE.MeshStandardMaterial({ color: "#aaaaaa", transparent: true, opacity: 0.35, roughness: 1.0 }));
        smoke.position.set(cx + w*0.28, h + h*0.55, cz - d*0.28);
        smoke.userData.smokeBase = smoke.position.y;
        smoke.userData.isSmoke = true;
        root.add(smoke);
      }

      if (hasLight) {
        const lantern = new THREE.PointLight("#ffcc88", 1.4, 10);
        lantern.position.set(cx, h * 0.85, cz + d/2 + 0.5);
        root.add(lantern);
      }
    }

    function addMarketStall(cx, cz, rotation) {
      const woodMat   = new THREE.MeshStandardMaterial({ color: "#7a4e1a", roughness: 0.9 });
      const awningMat = new THREE.MeshStandardMaterial({ color: "#cc4422", roughness: 0.75, side: THREE.DoubleSide });
      const goodsMat  = new THREE.MeshStandardMaterial({ color: "#e8b86a", roughness: 0.8 });

      const g = new THREE.Group();
      // counter
      const counter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.14, 0.9), woodMat);
      counter.position.y = 1.0; g.add(counter);
      // legs
      for (const [px, pz] of [[-0.95,-0.4],[-0.95,0.4],[0.95,-0.4],[0.95,0.4]]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 0.1), woodMat);
        leg.position.set(px, 0.5, pz); g.add(leg);
      }
      // awning poles
      for (const px of [-0.9, 0.9]) {
        const pole = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.5, 0.08), woodMat);
        pole.position.set(px, 1.8, -0.35); g.add(pole);
      }
      // awning cloth
      const awning = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.06, 1.1), awningMat);
      awning.position.set(0, 2.5, -0.2); awning.rotation.x = 0.2; g.add(awning);
      // goods on counter (small boxes)
      for (const [gx, gz] of [[-0.6,0],[0,0],[0.6,0]]) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.28+Math.random()*0.1, 0.22+Math.random()*0.12, 0.24), goodsMat);
        box.position.set(gx, 1.14, gz); g.add(box);
      }

      g.position.set(cx, 0, cz);
      g.rotation.y = rotation;
      root.add(g);
    }

    function addWell(cx, cz) {
      const stoneMat = new THREE.MeshStandardMaterial({ color: "#8a8070", roughness: 0.92 });
      const woodMat  = new THREE.MeshStandardMaterial({ color: "#5a3010", roughness: 0.9 });
      const ropeMat  = new THREE.MeshStandardMaterial({ color: "#8a7040", roughness: 0.95 });
      // base cylinder
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.9, 0.85, 14), stoneMat);
      base.position.set(cx, 0.42, cz); root.add(base);
      // two A-frame posts
      for (const ox of [-0.7, 0.7]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.1), woodMat);
        post.position.set(cx+ox, 1.4, cz); root.add(post);
      }
      // crossbar
      const bar = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.1), woodMat);
      bar.position.set(cx, 2.15, cz); root.add(bar);
      // hanging rope
      const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 5), ropeMat);
      rope.position.set(cx, 1.7, cz); root.add(rope);
      // bucket
      const bucket = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.28, 8), woodMat);
      bucket.position.set(cx, 1.1, cz); root.add(bucket);
    }

    function addTownFence(x1, z1, x2, z2) {
      const woodMat = new THREE.MeshStandardMaterial({ color: "#6a4020", roughness: 0.9 });
      const dx = x2 - x1, dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const cx = (x1+x2)/2, cz = (z1+z2)/2;
      const angle = Math.atan2(dx, dz);
      const plank = new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.1), woodMat);
      for (const yp of [0.6, 1.1]) {
        const p = plank.clone(); p.position.set(cx, yp, cz); p.rotation.y = angle; root.add(p);
      }
      const postCount = Math.max(2, Math.round(len / 1.8));
      for (let i = 0; i <= postCount; i++) {
        const t = i / postCount;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.1), woodMat);
        post.position.set(x1 + dx*t, 0.7, z1 + dz*t); root.add(post);
      }
    }

    function buildTown(cx, cz, teamColor) {
      // Ground plaza
      const plaza = new THREE.Mesh(new THREE.BoxGeometry(38, 0.08, 32),
        new THREE.MeshStandardMaterial({ color: "#c0a870", roughness: 0.95 }));
      plaza.position.set(cx, 0.04, cz); root.add(plaza);

      // Houses ring
      const houseLayouts = [
        { ox:-10, oz:-10, w:5, h:4.5, d:4, roof:"#8b2020", wall:"#e8d8b0", chimney:true,  light:true  },
        { ox: 10, oz:-10, w:4, h:4.0, d:3.5,roof:"#1a4a8a", wall:"#ddd4b8", chimney:false, light:true  },
        { ox:-10, oz: 10, w:4.5,h:5,  d:4, roof:"#3a6020", wall:"#e0cfa8", chimney:true,  light:false },
        { ox: 10, oz: 10, w:5, h:4.2, d:3.8,roof:"#7a2a10", wall:"#f0e0c0", chimney:true,  light:true  },
        { ox:  0, oz:-13, w:7, h:5.5, d:5, roof:"#3a2060", wall:"#dcd8d0", chimney:true,  light:true  }, // tavern
        { ox: 14, oz:  0, w:3.5,h:3.8,d:3, roof:"#5a3010", wall:"#c8bca0", chimney:false, light:false },
        { ox:-14, oz:  0, w:3, h:3.5, d:3, roof:"#2a5030", wall:"#d8d0b8", chimney:false, light:true  },
      ];
      for (const b of houseLayouts) {
        addTownBuilding(cx+b.ox, cz+b.oz, b.w, b.h, b.d, b.roof, b.wall, b.chimney, b.light);
      }

      // Market square (3 stalls)
      addMarketStall(cx - 1, cz + 1, 0);
      addMarketStall(cx + 2.5, cz + 1, 0.15);
      addMarketStall(cx - 1, cz + 3.5, Math.PI / 2);

      // Well in centre
      addWell(cx, cz - 2);

      // Perimeter fences
      addTownFence(cx-17, cz-15, cx+17, cz-15);
      addTownFence(cx+17, cz-15, cx+17, cz+15);
      addTownFence(cx+17, cz+15, cx-17, cz+15);
      addTownFence(cx-17, cz+15, cx-17, cz-15);

      // Road paving strips
      const roadMat = new THREE.MeshStandardMaterial({ color: "#a89870", roughness: 0.95 });
      const roadH = new THREE.Mesh(new THREE.BoxGeometry(38, 0.09, 3.5), roadMat);
      roadH.position.set(cx, 0.045, cz); root.add(roadH);
      const roadV = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.09, 32), roadMat);
      roadV.position.set(cx, 0.045, cz); root.add(roadV);
    }

    // Waypoint routes for civilians within each town
    function makeTownWaypoints(cx, cz) {
      return [
        new THREE.Vector3(cx,      1, cz),
        new THREE.Vector3(cx+6,    1, cz-4),
        new THREE.Vector3(cx+8,    1, cz+3),
        new THREE.Vector3(cx,      1, cz+7),
        new THREE.Vector3(cx-7,    1, cz+3),
        new THREE.Vector3(cx-6,    1, cz-5),
        new THREE.Vector3(cx+3,    1, cz-8),
      ];
    }

    const TOWN_A = { cx: -45, cz: 0  };
    const TOWN_B = { cx:  50, cz: 14 };

    const CIVILIAN_SKIN_TONES = ["#f0c8a0","#c8903a","#e8b87a","#8a5020","#f8e0c0","#d4945a"];
    const CIVILIAN_SHIRTS = [
      "#b05030","#3a6a9a","#4a8a4a","#9a7a20","#8a3a7a","#5a5a9a",
      "#c06020","#2a7a5a","#aa5050","#6a6a30","#3a8aaa","#aa6030"
    ];
    const CIVILIAN_PANTS = ["#2a3a4a","#4a3020","#3a4a2a","#5a4a30","#2a2a4a","#4a3a2a"];

    function spawnCivilians() {
      const towns = [
        { ...TOWN_A, count: 16, team: 0 },
        { ...TOWN_B, count: 16, team: 1 },
      ];
      let civIdx = 0;

      for (const town of towns) {
        const waypoints = makeTownWaypoints(town.cx, town.cz);
        for (let i = 0; i < town.count; i++) {
          const skin  = CIVILIAN_SKIN_TONES[Math.floor(Math.random() * CIVILIAN_SKIN_TONES.length)];
          const shirt = CIVILIAN_SHIRTS[Math.floor(Math.random() * CIVILIAN_SHIRTS.length)];
          const pants = CIVILIAN_PANTS[Math.floor(Math.random() * CIVILIAN_PANTS.length)];
          const hair  = ["#1a0f08","#3a2510","#8a6020","#a08040","#c8c0b0","#0a0a0a"][Math.floor(Math.random()*6)];

          const group = makeCivilianGroup(skin, shirt, pants, hair);
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * 10;
          group.position.set(town.cx + Math.cos(angle)*r, 1, town.cz + Math.sin(angle)*r);
          root.add(group);

          const startWp = Math.floor(Math.random() * waypoints.length);
          civilians.push({
            group,
            parts: group.userData.parts,
            phase: Math.random() * Math.PI * 2,
            speed: 0.045 + Math.random() * 0.02,
            home: new THREE.Vector3(town.cx, 1, town.cz),
            waypoints,
            wpIdx: startWp,
            idleUntil: performance.now() + Math.random() * 1500,
            dialogue: CIVILIAN_DIALOGUES[civIdx % CIVILIAN_DIALOGUES.length],
            npcId: "civ_" + civIdx,
            team: town.team,
            hp: 60,
            maxHp: 60,
            lastMelee: 0,
            dead: false,
          });
          group.userData.npcId = "civ_" + civIdx;
          group.userData.isCivilian = true;
          group.userData.team = town.team;
          civIdx++;
        }
      }
    }

    let _civFrameSkip = 0;
    function updateCivilians() {
      const now = performance.now();
      _civFrameSkip++;
      if (_civFrameSkip % 2 !== 0) return;

      for (const civ of civilians) {
        if (civ.dead) continue;
        const g = civ.group;
        const parts = civ.parts;

        // ── Find nearest living enemy civilian ──
        let nearestEnemy = null, nearestDist = Infinity;
        for (const other of civilians) {
          if (other === civ || other.dead || other.team === civ.team) continue;
          const d = Math.hypot(other.group.position.x - g.position.x, other.group.position.z - g.position.z);
          if (d < nearestDist) { nearestDist = d; nearestEnemy = other; }
        }

        const MELEE_RANGE = 1.4;
        const CHARGE_SPEED = civ.speed;

        if (nearestEnemy) {
          const ex = nearestEnemy.group.position.x - g.position.x;
          const ez = nearestEnemy.group.position.z - g.position.z;

          if (nearestDist > MELEE_RANGE) {
            // Charge toward enemy
            g.position.x += (ex / nearestDist) * CHARGE_SPEED;
            g.position.z += (ez / nearestDist) * CHARGE_SPEED;
            g.rotation.y = Math.atan2(ex, ez);
          } else {
            // In range — face them and strike
            g.rotation.y = Math.atan2(ex, ez);
            if (now - civ.lastMelee > 900) {
              civ.lastMelee = now;
              nearestEnemy.hp -= 8 + Math.random() * 6;
              // death check
              if (nearestEnemy.hp <= 0) {
                nearestEnemy.dead = true;
                // slump the corpse
                nearestEnemy.group.rotation.z = Math.PI / 2;
                nearestEnemy.group.position.y = 0.2;
              }
            }
          }
        } else {
          // No enemies — wander waypoints
          const isIdle = now < civ.idleUntil;
          if (!isIdle) {
            const target = civ.waypoints[civ.wpIdx];
            const dx = target.x - g.position.x;
            const dz = target.z - g.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 0.6) {
              civ.idleUntil = now + 1000 + Math.random() * 2000;
              civ.wpIdx = (civ.wpIdx + 1) % civ.waypoints.length;
            } else {
              g.position.x += (dx / dist) * civ.speed;
              g.position.z += (dz / dist) * civ.speed;
              g.rotation.y = Math.atan2(dx / dist, dz / dist);
            }
          }
        }

        // ── Walk & combat animation ──
        g.userData.walkPhase += 0.10;
        const wp = g.userData.walkPhase;
        const fighting = nearestEnemy && nearestDist <= MELEE_RANGE * 2;
        const swing = Math.sin(wp) * 0.30;
        const bob   = Math.abs(Math.sin(wp)) * 0.03;

        parts.leftArm.rotation.x  = fighting ?  0.3 : swing;
        parts.leftLeg.rotation.x  = -swing * 0.7;
        parts.rightLeg.rotation.x =  swing * 0.7;
        parts.torso.position.y    = 0.44 + bob;

        // Sword arm: overhead slash when in combat, normal swing otherwise
        if (fighting) {
          const strikePhase = (now - civ.lastMelee) / 900;
          parts.rightArm.rotation.x = -Math.PI * 0.55 + Math.sin(strikePhase * Math.PI) * Math.PI * 0.8;
        } else {
          parts.rightArm.rotation.x = -swing;
        }
      }
    }

    // Build both towns immediately on startup (static geometry, not in loadScene loop)
    (function initCivilianWorld() {
      buildTown(TOWN_A.cx, TOWN_A.cz, 0);
      buildTown(TOWN_B.cx, TOWN_B.cz, 1);
      spawnCivilians();
    })();

    const builderDefs = [
      // Team 0 (red) — behind their back line around x:-30...-38
      { id: "builder_r0", x: -32, z:  0, team: 0 },
      { id: "builder_r1", x: -35, z:  3, team: 0 },
      { id: "builder_r2", x: -34, z: -4, team: 0 },
      { id: "builder_r3", x: -30, z:  6, team: 0 },
      { id: "builder_r4", x: -37, z: -2, team: 0 },
      { id: "builder_r5", x: -29, z: -6, team: 0 },
      // Team 1 (blue) — behind their back line around x:+30...+38
      { id: "builder_b0", x: 32, z:  0, team: 1 },
      { id: "builder_b1", x: 35, z:  3, team: 1 },
      { id: "builder_b2", x: 34, z: -4, team: 1 },
      { id: "builder_b3", x: 30, z:  6, team: 1 },
      { id: "builder_b4", x: 37, z: -2, team: 1 },
      { id: "builder_b5", x: 29, z: -6, team: 1 },
    ];

    function spawnBuilderSquads() {
      for (const def of builderDefs) {
        if (agents.has(def.id)) continue; // already present
        const o = { id: def.id, x: def.x, y: 1, z: def.z, team: def.team, role: "builder" };
        const group = makePersonGroup(o);
        group.position.set(def.x, 1, def.z);
        group.userData.npcId = def.id;
        group.userData.role = "builder";
        root.add(group);
        agents.set(def.id, {
          group,
          team: def.team,
          prev: new THREE.Vector3(def.x, 1, def.z),
          next: new THREE.Vector3(def.x, 1, def.z),
          time: performance.now(),
          wanderPhase: Math.random() * Math.PI * 2,
          wanderRadius: 2.5
        });
      }
    }

    function updatePlayerCharacter() {
      playerGroup.visible = true;

      const parts = playerGroup.userData.parts;
      const now = performance.now();
      const moving = keys.has("w") || keys.has("s") || keys.has("a") || keys.has("d")
        || Math.hypot(moveStick.x, moveStick.y) > 0.1;

      if (moving) playerGroup.userData.walkPhase += 0.1;
      const swing = Math.sin(playerGroup.userData.walkPhase) * (moving ? 0.32 : 0);
      const bob = Math.abs(Math.sin(playerGroup.userData.walkPhase)) * (moving ? 0.04 : 0);

      parts.leftArm.rotation.x = swing;
      parts.leftLeg.rotation.x = -swing * 0.8;
      parts.rightLeg.rotation.x = swing * 0.8;
      parts.torso.position.y = 0.46 + bob;

      // sword attack swing
      const attackAge = now - playerGroup.userData.attackTime;
      const ATTACK_DUR = 320; // ms
      if (attackAge < ATTACK_DUR) {
        const t = attackAge / ATTACK_DUR;
        // swing rightArm forward (positive X direction)
        parts.rightArm.rotation.x = Math.sin(t * Math.PI) * 2.2;
        parts.rightArm.rotation.z = 0;
      } else {
        parts.rightArm.rotation.x = -swing;
        parts.rightArm.rotation.z = 0;
      }

      // In iso mode, player follows camera target
      if (viewMode === "iso") {
        playerGroup.position.set(isoTarget.x, 1, isoTarget.z);
        playerGroup.rotation.y = yaw + Math.PI;
      }
    }

    loadScene();

    setInterval(() => {
      if (simulationStarted) {
        loadScene();
      }
    }, isDragonScene ? 180 : 400);

    animate();
  </script>
