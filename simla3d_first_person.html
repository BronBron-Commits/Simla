<!DOCTYPE html>
<html>
<head>
  <title>Simla3D First Person</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfe7ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      color: #102030;
      font-size: 13px;
      max-width: 360px;
      backdrop-filter: blur(8px);
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      z-index: 9;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0,0,0,.4);
    }

    .joystick {
      position: fixed;
      bottom: 28px;
      width: 264px;
      height: 264px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      z-index: 20;
      touch-action: none;
      user-select: none;
      backdrop-filter: blur(6px);
    }

    .joystick .knob {
      position: absolute;
      left: 84px;
      top: 84px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      border: 2px solid rgba(20,40,60,0.25);
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    #moveJoy {
      left: 26px;
    }

    #lookJoy {
      right: 26px;
    }

    @media (pointer: fine) {
      .joystick {
        opacity: 0.35;
      }
    }

    #talkPrompt {
      position: fixed;
      left: 50%;
      bottom: 210px;
      transform: translateX(-50%);
      z-index: 30;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      color: #102030;
      font-size: 14px;
      font-weight: 700;
      display: none;
      pointer-events: auto;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }

    #dialogueBox {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 320px;
      z-index: 31;
      padding: 16px;
      border-radius: 18px;
      background: rgba(8, 15, 26, 0.88);
      color: #eef7ff;
      display: none;
      box-shadow: 0 18px 60px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(180,220,255,0.24);
    }

    #dialogueName {
      font-weight: 800;
      margin-bottom: 8px;
      color: #9fd3ff;
    }

    #dialogueText {
      line-height: 1.4;
      font-size: 15px;
    }

    #dialogueClose {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 13px;
    }

    #viewToggle {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 40;
      padding: 14px 18px;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,0.88);
      color: #102030;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 10px 32px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  
  <button id="viewToggle">Isometric</button>
  <div id="crosshair"></div>

  <div id="talkPrompt">Talk</div>

  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialogueClose">close</div>
  </div>

  <div id="moveJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <div id="lookJoy" class="joystick">
    <div class="knob"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    window.addEventListener("error", e => {
      console.warn("Simla3D runtime warning:", e.message);
    });

    window.addEventListener("unhandledrejection", e => {
      console.warn("Simla3D async warning:", e.reason);
    });

    const talkPrompt = document.getElementById("talkPrompt");
    const dialogueBox = document.getElementById("dialogueBox");
    const dialogueName = document.getElementById("dialogueName");
    const dialogueText = document.getElementById("dialogueText");
    const dialogueClose = document.getElementById("dialogueClose");

    let nearestNpc = null;

    const sceneFile = new URLSearchParams(location.search).get("file") || "examples/simla3d_demo.sim";
    const isDragonScene = sceneFile.includes("dragon");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#87ceeb");
    scene.fog = new THREE.FogExp2("#87ceeb", 0.0025);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
    renderer.shadowMap.enabled = false;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight("#ffffff", "#6b8a6f", 1.6));

    const sun = new THREE.DirectionalLight("#ffffff", 1.6);
    sun.position.set(12, 22, 10);
    scene.add(sun);

    const root = new THREE.Group();
    scene.add(root);

    let staticBuilt = false;
    const agents = new Map();
    const dragons = new Map();
    const dragonFlights = new Map();
    const wizardSpells = [];

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let locked = false;
    let viewMode = "first";

    const viewToggle = document.getElementById("viewToggle");
    const leftJoy = document.getElementById("moveJoy");
    const rightJoy = document.getElementById("lookJoy");

    viewToggle.addEventListener("click", () => {
      viewMode = viewMode === "first" ? "iso" : "first";

      const isFirst = viewMode === "first";

      viewToggle.textContent = isFirst ? "Isometric" : "Perspective";
      document.getElementById("crosshair").style.display = isFirst ? "block" : "none";

      if (leftJoy) leftJoy.style.display = isFirst ? "block" : "none";
      if (rightJoy) rightJoy.style.display = isFirst ? "block" : "none";
    });

    const moveStick = { x: 0, y: 0 };
    const lookStick = { x: 0, y: 0 };

    let smoothLookX = 0;
    let smoothLookY = 0;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    document.body.addEventListener("click", () => {
      document.body.requestPointerLock?.();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === document.body;
    });

    function setupJoystick(id, state) {
      const joy = document.getElementById(id);
      const knob = joy.querySelector(".knob");
      let activePointer = null;

      function setKnob(dx, dy) {
        const max = 84;
        const len = Math.hypot(dx, dy);
        const scale = len > max ? max / len : 1;

        const x = dx * scale;
        const y = dy * scale;

        knob.style.transform = `translate(${x}px, ${y}px)`;

        state.x = x / max;
        state.y = y / max;
      }

      function reset() {
        activePointer = null;
        state.x = 0;
        state.y = 0;
        knob.style.transform = "translate(0px, 0px)";
      }

      joy.addEventListener("pointerdown", e => {
        activePointer = e.pointerId;
        joy.setPointerCapture(e.pointerId);

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointermove", e => {
        if (activePointer !== e.pointerId) return;

        const rect = joy.getBoundingClientRect();
        setKnob(
          e.clientX - (rect.left + rect.width / 2),
          e.clientY - (rect.top + rect.height / 2)
        );
      });

      joy.addEventListener("pointerup", reset);
      joy.addEventListener("pointercancel", reset);
      joy.addEventListener("lostpointercapture", reset);
    }

    setupJoystick("moveJoy", moveStick);
    setupJoystick("lookJoy", lookStick);

    document.addEventListener("mousemove", e => {
      if (!locked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try { return new THREE.Color(v || fallback); }
      catch { return new THREE.Color(fallback); }
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) obj[arr[i]] = arr[i + 1];
      return obj;
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        obj.traverse?.(child => {
          child.geometry?.dispose?.();
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        });
      }
    }

    function mat(o, fallback, roughness = 0.75) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness,
        metalness: 0.03
      });
    }

    function addFloor(o) {
      const geo = new THREE.BoxGeometry(num(o.w, 80), 0.12, num(o.d, 80));
      const mesh = new THREE.Mesh(geo, mat(o, "#2e5a3a", 0.95));
      mesh.position.set(num(o.x), -0.06, num(o.z));
      root.add(mesh);

      const grid = new THREE.GridHelper(Math.max(num(o.w, 80), num(o.d, 80)), 70, "#5d8a62", "#3e6546");
      grid.position.y = 0.02;
      root.add(grid);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);
      const x = num(o.x);
      const y = num(o.y);
      const z = num(o.z);

      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(o, "#999999"));
      mesh.position.set(x, y, z);
      root.add(mesh);

      const id = String(o.id || "");
      const isCreature = id.includes("dragon");

      if (!isCreature) {
        const roof = new THREE.Mesh(
          new THREE.BoxGeometry(w * 1.08, 0.16, d * 1.08),
          new THREE.MeshStandardMaterial({ color: "#1c2530", roughness: 0.85 })
        );
        roof.position.set(x, y + h / 2 + 0.1, z);
        root.add(roof);
}
    }

    function addWindows(x, z, w, h, d, centerY) {
      const rows = Math.max(1, Math.floor(h / 2));
      const colsFront = Math.max(2, Math.floor(w / 2));
      const colsSide = Math.max(2, Math.floor(d / 2));

      const winMat = new THREE.MeshStandardMaterial({
        color: "#e8f7ff",
        emissive: "#4d8fbd",
        emissiveIntensity: 0.35,
        roughness: 0.4
      });

      function win(wx, wy, wz, rotY) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.035), winMat);
        m.position.set(wx, wy, wz);
        m.rotation.y = rotY;
        root.add(m);
      }

      for (let r = 0; r < rows; r++) {
        const wy = centerY - h / 2 + 0.8 + r * 1.6;

        for (let c = 0; c < colsFront; c++) {
          const wx = x - w / 2 + 0.7 + c * ((w - 1.4) / Math.max(1, colsFront - 1));
          win(wx, wy, z - d / 2 - 0.025, 0);
          win(wx, wy, z + d / 2 + 0.025, Math.PI);
        }

        for (let c = 0; c < colsSide; c++) {
          const wz = z - d / 2 + 0.7 + c * ((d - 1.4) / Math.max(1, colsSide - 1));
          win(x - w / 2 - 0.025, wy, wz, Math.PI / 2);
          win(x + w / 2 + 0.025, wy, wz, -Math.PI / 2);
        }
      }
    }

    function makePersonGroup(o) {
      const group = new THREE.Group();
      group.position.set(num(o.x), num(o.y, 1), num(o.z));

      const outfit = color(o.color, "#55ccff");
        const role = String(o.role || "commoner");

      const skinMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#f0c8a0"),
        roughness: 0.8
      });

      const shirtMat = new THREE.MeshStandardMaterial({
        color: outfit,
        roughness: 0.7,
        metalness: 0.02
      });

      const pantsMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#263248"),
        roughness: 0.75
      });

      const hairMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#33251b"),
        roughness: 0.8
      });

      // torso
      const torso = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.68, 0.24),
        shirtMat
      );
      torso.position.y = 0.45;
      torso.name = "torso";
      group.add(torso);

      // head
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 14, 10),
        skinMat
      );
      head.position.y = 0.98;
      head.name = "head";
      group.add(head);

      // hair cap
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.225, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.48),
        hairMat
      );
      hair.position.y = 1.05;
      hair.rotation.x = Math.PI;
      hair.name = "hair";
      group.add(hair);

      // arms
      const armGeo = new THREE.BoxGeometry(0.13, 0.55, 0.13);

      const leftArm = new THREE.Mesh(armGeo, shirtMat);
      leftArm.position.set(-0.34, 0.43, 0);
      leftArm.name = "leftArm";
      group.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, shirtMat);
      rightArm.position.set(0.34, 0.43, 0);
      rightArm.name = "rightArm";
      group.add(rightArm);

      // legs
      const legGeo = new THREE.BoxGeometry(0.15, 0.58, 0.15);

      const leftLeg = new THREE.Mesh(legGeo, pantsMat);
      leftLeg.position.set(-0.12, -0.2, 0);
      leftLeg.name = "leftLeg";
      group.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, pantsMat);
      rightLeg.position.set(0.12, -0.2, 0);
      rightLeg.name = "rightLeg";
      group.add(rightLeg);

      // feet
      const footGeo = new THREE.BoxGeometry(0.18, 0.08, 0.3);
      const footMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#171b22"),
        roughness: 0.85
      });

      const leftFoot = new THREE.Mesh(footGeo, footMat);
      leftFoot.position.set(-0.12, -0.52, 0.06);
      leftFoot.name = "leftFoot";
      group.add(leftFoot);

      const rightFoot = new THREE.Mesh(footGeo, footMat);
      rightFoot.position.set(0.12, -0.52, 0.06);
      rightFoot.name = "rightFoot";
      group.add(rightFoot);

      

        // === ROLE VARIANTS ===

        if (role === "wizard") {
          const robe = new THREE.Mesh(
            new THREE.ConeGeometry(0.5, 1.4, 10),
            new THREE.MeshStandardMaterial({ color: outfit, roughness: 0.8 })
          );
          robe.position.y = 0.2;
          group.add(robe);

          const hat = new THREE.Mesh(
            new THREE.ConeGeometry(0.28, 0.6, 10),
            new THREE.MeshStandardMaterial({ color: outfit, roughness: 0.7 })
          );
          hat.position.y = 1.45;
          group.add(hat);

          const staff = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.04, 1.4),
            new THREE.MeshStandardMaterial({ color: "#6b4a2d" })
          );
          staff.position.set(0.5, 0.3, 0);
          group.add(staff);

          const orb = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 12, 10),
            new THREE.MeshStandardMaterial({
              color: "#66ccff",
              emissive: "#3399ff",
              emissiveIntensity: 1.5
            })
          );
          orb.position.set(0.5, 1.0, 0);
          group.add(orb);
        }

        if (role === "warrior") {
          const chest = new THREE.Mesh(
            new THREE.BoxGeometry(0.55, 0.75, 0.28),
            new THREE.MeshStandardMaterial({ color: "#666666", metalness: 0.4, roughness: 0.6 })
          );
          chest.position.y = 0.45;
          group.add(chest);

          const sword = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 1.2, 0.08),
            new THREE.MeshStandardMaterial({ color: "#cccccc", metalness: 0.8 })
          );
          sword.position.set(0.55, 0.2, 0);
          group.add(sword);

          const shield = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
            new THREE.MeshStandardMaterial({ color: "#884422", roughness: 0.8 })
          );
          shield.rotation.z = Math.PI / 2;
          shield.position.set(-0.5, 0.4, 0);
          group.add(shield);
        }

group.userData.parts = {
        torso,
        head,
        leftArm,
        rightArm,
        leftLeg,
        rightLeg,
        leftFoot,
        rightFoot
      };

      group.userData.lastPos = group.position.clone();
      group.userData.walkPhase = Math.random() * Math.PI * 2;
      group.userData.variation = 0.75 + Math.random() * 0.55;

      return group;
    }

    function addPerson(o) {
      const id = String(o.id || "agent");
      const target = new THREE.Vector3(num(o.x), num(o.y, 1), num(o.z));

      if (!agents.has(id)) {
        const group = makePersonGroup(o);
        group.position.copy(target);
        group.userData.npcId = id;
        group.userData.targetName = String(o.target || "somewhere");
        group.userData.role = String(o.role || "commoner");
        root.add(group);

        agents.set(id, {
          group,
          prev: target.clone(),
          next: target.clone(),
          time: performance.now(),
          wanderPhase: Math.random() * Math.PI * 2,
          wanderRadius: 1.5 + Math.random() * 4.0
        });

        return;
      }

      const state = agents.get(id);
      state.group.userData.targetName = String(o.target || "somewhere");

      const now = performance.now();
      const raw = (now - state.time) / 650;
      const t = Math.min(raw, 1.25);

      const baseNow = new THREE.Vector3(
        state.prev.x + (state.next.x - state.prev.x) * t,
        state.prev.y + (state.next.y - state.prev.y) * t,
        state.prev.z + (state.next.z - state.prev.z) * t
      );

      state.prev.copy(baseNow);
      state.next.copy(target);
      state.time = now;
    }

    function makeScaleTexture(baseColor) {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#" + baseColor.getHexString();
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "rgba(0,0,0,0.75)";
      ctx.lineWidth = 4;

      for (let y = -16; y < size + 16; y += 16) {
        for (let x = -16; x < size + 16; x += 16) {
          const ox = ((y / 16) % 2) * 8;
          ctx.beginPath();
          ctx.arc(x + ox, y, 11, 0, Math.PI);
          ctx.stroke();
        }
      }

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let y = 0; y < size; y += 16) {
        for (let x = 0; x < size; x += 16) {
          ctx.beginPath();
          ctx.arc(x + 4, y + 4, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 7);
      return tex;
    }

    function makeDragonGroup(o) {
      const group = new THREE.Group();

      const sc = num(o.scale, 1);
      group.position.set(num(o.x), num(o.y, 8), num(o.z));
      group.rotation.y = num(o.heading, 0) + Math.PI;
      group.scale.set(sc, sc, sc);

      const baseA = color(o.colorA, "#244c2a");
      const baseB = color(o.colorB, "#2a5f31");

      const matA = new THREE.MeshStandardMaterial({
        color: baseA,
        map: makeScaleTexture(baseA),
        roughness: 0.82,
        metalness: 0.02
      });

      const matB = new THREE.MeshStandardMaterial({
        color: baseB,
        map: makeScaleTexture(baseB),
        roughness: 0.8,
        metalness: 0.02
      });
      const hornMat = new THREE.MeshStandardMaterial({ color: "#ddddbb", roughness: 0.8 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: "#ffdd44", emissive: "#ffbb22", emissiveIntensity: 0.8 });

      function part(lx, ly, lz, w, h, d, mat) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(lx, ly, lz);
        group.add(mesh);
      }

      part(0, 0, 0, 6, 2.2, 10, matA);
      part(0, 0.2, -3.2, 4.2, 2.4, 3.4, matB);
      part(0, 0.9, -6.0, 1.6, 1.5, 3.4, matB);
      part(0, 1.15, -8.5, 2.7, 1.8, 2.4, matB);
      part(0, 0.95, -10.0, 1.7, 0.9, 1.7, matA);

      part(-0.9, 2.15, -8.7, 0.35, 1.1, 0.35, hornMat);
      part(0.9, 2.15, -8.7, 0.35, 1.1, 0.35, hornMat);
      part(-0.6, 1.48, -10.85, 0.28, 0.28, 0.08, eyeMat);
      part(0.6, 1.48, -10.85, 0.28, 0.28, 0.08, eyeMat);

      part(0, -0.25, 6.4, 2.2, 1.3, 3.5, matB);
      part(0, -0.65, 9.0, 1.4, 1.0, 3.2, matA);
      part(0, -0.95, 11.3, 0.8, 0.7, 2.6, matA);

      const flap = Math.sin(Date.now() * 0.008 + num(o.x) + num(o.z));
      part(-5.2, 0.2 + flap * 1.2, -0.8, 7.2, 0.25, 8.5, matA);
      part(5.2, 0.2 + flap * 1.2, -0.8, 7.2, 0.25, 8.5, matA);

      return group;
    }

    function addDragon(o) {
      const id = String(o.id || "dragon");
      const targetPos = new THREE.Vector3(num(o.x), num(o.y, 8), num(o.z));
      const targetHeading = num(o.heading, 0) + Math.PI;

      if (!dragons.has(id)) {
        const group = makeDragonGroup(o);
        group.position.copy(targetPos);
        group.rotation.y = targetHeading;
        root.add(group);

        dragons.set(id, {
          group,
          prev: targetPos.clone(),
          next: targetPos.clone(),
          prevHeading: targetHeading,
          nextHeading: targetHeading,
          time: performance.now()
        });
        return;
      }

      const state = dragons.get(id);
      state.prev.copy(state.group.position);
      state.next.copy(targetPos);
      state.prevHeading = state.group.rotation.y;
      state.nextHeading = targetHeading;
      state.time = performance.now();
    }

    function addDragonFlight(o) {
      const id = String(o.id || "dragon_flight");

      if (!dragonFlights.has(id)) {
        const group = makeDragonGroup({
          id,
          x: 0,
          y: 8,
          z: 0,
          heading: 0,
          scale: o.scale,
          colorA: o.colorA,
          colorB: o.colorB
        });

        const fireMat = new THREE.MeshBasicMaterial({
          color: "#ff6a1a",
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const fireCone = new THREE.Mesh(
          new THREE.ConeGeometry(1.2, 8, 16),
          fireMat
        );
        fireCone.name = "fire_breath";
        fireCone.rotation.x = Math.PI / 2;
        fireCone.position.set(0, 0.6, -9.5);
        fireCone.scale.set(1, 1, 1);
        group.add(fireCone);

        root.add(group);

        dragonFlights.set(id, {
          group,
          fireCone,
          baseX: num(o.baseX),
          baseZ: num(o.baseZ),
          phase: num(o.phase),
          scale: num(o.scale, 1),
          lastFire: 0
        });
      }
    }

    function igniteAgent(state) {
      if (state.group.userData.onFire) return;

      state.group.userData.onFire = true;
      state.group.userData.fireStart = performance.now();

      const fireMat = new THREE.MeshBasicMaterial({
        color: "#ff5a18",
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const fire = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 12, 8),
        fireMat
      );

      fire.name = "burning_fire";
      fire.position.y = 0.55;
      fire.scale.set(0.8, 1.4, 0.8);
      state.group.add(fire);
    }

    function updateBurningAgents() {
      const now = performance.now();

      for (const state of agents.values()) {
        if (!state.group.userData.onFire) continue;

        const fire = state.group.getObjectByName("burning_fire");
        if (!fire) continue;

        const t = now * 0.008 + state.wanderPhase;
        fire.scale.set(
          0.75 + Math.sin(t) * 0.18,
          1.25 + Math.abs(Math.sin(t * 1.3)) * 0.45,
          0.75 + Math.cos(t) * 0.18
        );

        fire.material.opacity = 0.55 + Math.abs(Math.sin(t * 1.8)) * 0.35;
      }
    }

    function dragonBreathHitsAgents(x, y, z, heading) {
      const forwardX = Math.sin(heading);
      const forwardZ = Math.cos(heading);

      for (const state of agents.values()) {
        const ax = state.group.position.x;
        const ay = state.group.position.y;
        const az = state.group.position.z;

        const dx = ax - x;
        const dz = az - z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist > 9.5) continue;
        if (Math.abs(ay - y) > 18) continue;

        const dot = ((dx / Math.max(dist, 0.001)) * forwardX) + ((dz / Math.max(dist, 0.001)) * forwardZ);

        // cone in front of dragon
        if (dot > 0.58) {
          igniteAgent(state);
        }
      }
    }

    function nearestDragonTo(x, z) {
      let best = null;
      let bestDist = Infinity;

      for (const d of dragonFlights.values()) {
        const dx = d.group.position.x - x;
        const dz = d.group.position.z - z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < bestDist) {
          bestDist = dist;
          best = d;
        }
      }

      return best;
    }

    function spawnWizardSpell(wizardState, dragonState) {
      if (!wizardState || !dragonState) return;

      const start = wizardState.group.position.clone();
      start.y += 1.25;

      const target = dragonState.group.position.clone();

      const mat = new THREE.MeshBasicMaterial({
        color: "#66ccff",
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const bolt = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 12, 8),
        mat
      );

      bolt.position.copy(start);
      root.add(bolt);

      wizardSpells.push({
        mesh: bolt,
        start,
        target,
        created: performance.now(),
        duration: 700
      });
    }

    function updateWizardSpells() {
      const now = performance.now();

      for (const state of agents.values()) {
        const role = String(state.group.userData.role || "");

        if (role !== "wizard") continue;

        if (!state.lastSpell) state.lastSpell = 0;

        if (now - state.lastSpell > 1800 + (state.wanderPhase || 0) * 250) {
          const target = nearestDragonTo(state.group.position.x, state.group.position.z);
          if (target) {
            state.lastSpell = now;
            spawnWizardSpell(state, target);
          }
        }
      }

      for (let i = wizardSpells.length - 1; i >= 0; i--) {
        const spell = wizardSpells[i];
        const raw = (now - spell.created) / spell.duration;

        if (raw >= 1) {
          root.remove(spell.mesh);
          spell.mesh.geometry?.dispose?.();
          spell.mesh.material?.dispose?.();
          wizardSpells.splice(i, 1);
          continue;
        }

        const t = raw * raw * (3 - 2 * raw);

        spell.mesh.position.set(
          spell.start.x + (spell.target.x - spell.start.x) * t,
          spell.start.y + (spell.target.y - spell.start.y) * t,
          spell.start.z + (spell.target.z - spell.start.z) * t
        );

        const pulse = 1 + Math.sin(now * 0.03) * 0.35;
        spell.mesh.scale.set(pulse, pulse, pulse);
      }
    }

    function updateDragonFlights() {
      const t = performance.now() * 0.001;

      for (const state of dragonFlights.values()) {
        const p = state.phase;

        const speedX = 0.55 + Math.sin(p + 1) * 0.22;
        const speedZ = 0.48 + Math.cos(p + 2) * 0.18;

        const x =
          state.baseX +
          Math.sin(p + t * speedX) * 12.0 +
          Math.sin(p * 1.7 + t * 1.55) * 3.6;

        const z =
          state.baseZ +
          Math.cos(p + t * speedZ) * 10.0 +
          Math.sin(p * 2.1 + t * 1.35) * 3.2;

        const y =
          16 +
          Math.sin(p + t * 0.9) * 5.2 +
          Math.sin(p * 1.3 + t * 2.6) * 1.2;

        const vx =
          Math.cos(p + t * speedX) * 12.0 +
          Math.cos(p * 1.7 + t * 1.55) * 3.6;

        const vz =
          -Math.sin(p + t * speedZ) * 10.0 +
          Math.cos(p * 2.1 + t * 1.35) * 3.2;

        state.group.position.set(x, y, z);
        state.group.rotation.y = Math.atan2(vx, vz) + Math.PI;

        const heading = state.group.rotation.y;
        const fireCycle = Math.sin(t * 0.7 + p * 1.9);
        const isBreathingFire = fireCycle > 0.86;

        if (state.fireCone) {
          const firePower = isBreathingFire ? (fireCycle - 0.86) / 0.14 : 0;
          state.fireCone.material.opacity = firePower * 0.9;
          state.fireCone.scale.set(
            0.7 + firePower * 1.4,
            0.7 + firePower * 1.7,
            0.7 + firePower * 1.7
          );
        }

        if (isBreathingFire && performance.now() - state.lastFire > 500) {
          state.lastFire = performance.now();
          dragonBreathHitsAgents(x, y, z, heading);
        }

        const flap = Math.sin(t * 7 + p);
        const wingL = state.group.getObjectByName("wing_l");
        const wingR = state.group.getObjectByName("wing_r");

        if (wingL && wingR) {
          wingL.position.y = 0.2 + flap * 1.2;
          wingR.position.y = 0.2 + flap * 1.2;
          wingL.rotation.z = flap * 0.25;
          wingR.rotation.z = -flap * 0.25;
        }
      }
    }

    function addLocation(o) {
      const marker = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.1, 24),
        new THREE.MeshStandardMaterial({
          color: color(o.color, "#ddddff"),
          emissive: color(o.color, "#ddddff"),
          emissiveIntensity: 0.4
        })
      );
      marker.position.set(num(o.x), num(o.y, 0.08), num(o.z));
      root.add(marker);
    }

    function addRoute(o) {
      const from = new THREE.Vector3(num(o.fromX), 0.08, num(o.fromZ));
      const to = new THREE.Vector3(num(o.toX), 0.08, num(o.toZ));
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const line = new THREE.Line(
        geo,
        new THREE.LineBasicMaterial({
          color: color(o.color, "#ffffff"),
          transparent: true,
          opacity: 0.18
        })
      );
      root.add(line);
    }

    async function loadScene() {
      try {
        const res = await fetch("/api/scene?file=" + encodeURIComponent(sceneFile) + "&cacheBust=" + Date.now());
        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error("Scene API did not return an array: " + JSON.stringify(data).slice(0, 300));
        }

        if (isDragonScene) {
          if (!staticBuilt) {
            clearRoot();
            agents.clear();
            dragons.clear();
            dragonFlights.clear();
            staticBuilt = false;
          }
        }

        if (!staticBuilt) {
          clearRoot();
          agents.clear();
        }

        for (const item of data) {
          if (!Array.isArray(item)) continue;
          const o = pairsToObj(item);

          if (o.type === "dragon_flight") {
            addDragonFlight(o);
            continue;
          }

          if (o.type === "dragon") {
            addDragon(o);
            continue;
          }

          if (o.type === "agent" || o.type === "person") {
            addPerson(o);
            continue;
          }

          if (staticBuilt) continue;

          if (o.type === "floor") addFloor(o);
          else if (o.type === "box") addBox(o);
          else if (o.type === "cube") addBox({ ...o, w: o.size, h: o.size, d: o.size });
          else if (o.type === "location") addLocation(o);
          else if (o.type === "route") addRoute(o);
        }

        staticBuilt = true;
      } catch (err) {
        console.warn("Simla3D scene load warning:", err);
      }
    }

    function npcLine(id, target) {
      if (id.startsWith("m")) return `I'm just hanging around the mall. It has been busy today.`;
      if (id.startsWith("n")) return `North mall is quieter, but I like walking over there.`;
      if (id.startsWith("p")) return `The park is the best place to slow down for a minute.`;
      if (id.startsWith("r")) return `I live around here. The neighborhood is getting crowded.`;
      if (id.startsWith("s")) return `I'm heading through town toward ${target}.`;
      if (id.startsWith("c")) return `I'm near the civic district today. Lots of people moving around.`;
      if (id.startsWith("q")) return `This side of the city is growing fast.`;
      return `I'm on my way to ${target}.`;
    }

    function openDialogue(npc) {
      if (!npc) return;

      const id = npc.userData.npcId || "npc";
      const target = npc.userData.targetName || "somewhere";

      dialogueName.textContent = id;
      dialogueText.textContent = npcLine(id, target);
      dialogueBox.style.display = "block";
    }

    function closeDialogue() {
      dialogueBox.style.display = "none";
    }

    function updateInteraction() {
      nearestNpc = null;

      let bestDist = 2.8;

      for (const state of agents.values()) {
        const npc = state.group;
        const dist = camera.position.distanceTo(npc.position);

        if (dist < bestDist) {
          bestDist = dist;
          nearestNpc = npc;
        }
      }

      if (nearestNpc) {
        talkPrompt.style.display = "block";
        talkPrompt.textContent = `Talk to ${nearestNpc.userData.npcId || "NPC"}`;
      } else {
        talkPrompt.style.display = "none";
      }
    }

    talkPrompt.addEventListener("click", () => openDialogue(nearestNpc));
    dialogueClose.addEventListener("click", closeDialogue);

    function updateCamera() {
      if (viewMode === "iso") {
        const t = Date.now() * 0.00008;
        const cx = Math.sin(t) * 8;
        const cz = Math.cos(t * 0.8) * 8;

        camera.position.set(cx + 42, 34, cz + 42);
        camera.lookAt(cx, 0, cz);
        return;
      }

      yaw -= lookStick.x * 0.008;
      pitch -= lookStick.y * 0.007;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const speed = keys.has("shift") ? 0.08 : 0.035;

      let moveForward = 0;
      let moveRight = 0;

      if (keys.has("w")) moveForward -= 1;
      if (keys.has("s")) moveForward += 1;
      if (keys.has("d")) moveRight += 1;
      if (keys.has("a")) moveRight -= 1;

      moveForward += moveStick.y;
      moveRight += moveStick.x;

      const mag = Math.hypot(moveForward, moveRight);
      if (mag > 1) {
        moveForward /= mag;
        moveRight /= mag;
      }

      camera.position.addScaledVector(forward, moveForward * speed);
      camera.position.addScaledVector(right, moveRight * speed);

      camera.position.y = 1.7;
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function updateDragons() {
      const now = performance.now();
      const duration = 220;

      for (const state of dragons.values()) {
        const raw = (now - state.time) / duration;

        // allow slight extrapolation so dragons never stop between samples
        const t = Math.min(raw, 1.35);

        state.group.position.set(
          state.prev.x + (state.next.x - state.prev.x) * t,
          state.prev.y + (state.next.y - state.prev.y) * t,
          state.prev.z + (state.next.z - state.prev.z) * t
        );

        let delta = state.nextHeading - state.prevHeading;
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;

        state.group.rotation.y = state.prevHeading + delta * t;
      }
    }

    function updateAgents() {
      const now = performance.now();
      const seconds = now * 0.001;
      const duration = 650;

      for (const state of agents.values()) {
        const raw = (now - state.time) / duration;
        const t = Math.min(raw, 1.25);

        const baseX = state.prev.x + (state.next.x - state.prev.x) * t;
        const baseY = state.prev.y + (state.next.y - state.prev.y) * t;
        const baseZ = state.prev.z + (state.next.z - state.prev.z) * t;

        const phase = state.wanderPhase || 0;
        const radius = state.wanderRadius || 2;

        const wanderX =
          Math.sin(phase + seconds * 0.55) * radius +
          Math.sin(phase * 1.7 + seconds * 1.05) * radius * 0.35;

        const wanderZ =
          Math.cos(phase + seconds * 0.48) * radius +
          Math.sin(phase * 2.2 + seconds * 0.9) * radius * 0.3;

        let finalX = baseX + wanderX;
        let finalZ = baseZ + wanderZ;

        // simple crowd avoidance
        for (const other of agents.values()) {
          if (other === state) continue;

          const ox = other.group.position.x;
          const oz = other.group.position.z;
          const dxAway = finalX - ox;
          const dzAway = finalZ - oz;
          const distSq = dxAway * dxAway + dzAway * dzAway;

          if (distSq > 0.0001 && distSq < 4.0) {
            const dist = Math.sqrt(distSq);
            const push = (2.0 - dist) * 0.35;

            finalX += (dxAway / dist) * push;
            finalZ += (dzAway / dist) * push;
          }
        }

        const oldX = state.group.position.x;
        const oldZ = state.group.position.z;

        state.group.position.set(finalX, baseY, finalZ);

        const dx = state.group.position.x - oldX;
        const dz = state.group.position.z - oldZ;
        const speed = Math.sqrt(dx * dx + dz * dz);

        if (speed > 0.0005) {
          state.group.rotation.y = Math.atan2(dx, dz);
        }

        const parts = state.group.userData.parts;
        if (!parts) continue;

        state.group.userData.walkPhase += 0.08;
        const phaseWalk = state.group.userData.walkPhase;
        const swing = Math.sin(phaseWalk) * 0.28;
        const bob = Math.abs(Math.sin(phaseWalk)) * 0.035;

        parts.leftArm.rotation.x = swing;
        parts.rightArm.rotation.x = -swing;
        parts.leftLeg.rotation.x = -swing * 0.75;
        parts.rightLeg.rotation.x = swing * 0.75;
        parts.leftFoot.rotation.x = -swing * 0.25;
        parts.rightFoot.rotation.x = swing * 0.25;
        parts.torso.position.y = 0.45 + bob;
        parts.head.position.y = 0.98 + bob;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      updateAgents();
      updateDragons();
      updateDragonFlights();
      updateBurningAgents();
      updateWizardSpells();
      updateInteraction();
      renderer.render(scene, camera);
    }

    loadScene();
    setInterval(loadScene, isDragonScene ? 180 : 400);
    animate();
  </script>
</body>
</html>
