<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simla Canvas Viewer (No Three.js)</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #222;
    }
    #hud { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; font-family: sans-serif; z-index: 10; }
    #inspector {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 300px;
      color: #eef6ff;
      background: rgba(0, 0, 0, 0.62);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      z-index: 10;
      box-sizing: border-box;
      border: 1px solid rgba(210, 230, 255, 0.18);
      backdrop-filter: blur(2px);
    }
    #inspectorTitle {
      font-family: sans-serif;
      font-size: 14px;
      margin: 0 0 8px;
      color: #fff;
    }
    #inspectorBody {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #222;
    }
  </style>
</head>
<body>
  <div id="hud">Simla Canvas Viewer<br>Click canvas to mouse-look, WASD fly, wheel zoom, Space/Ctrl up/down</div>
  <div id="inspector">
    <h2 id="inspectorTitle">Inspector</h2>
    <pre id="inspectorBody">Click an object to inspect it.</pre>
  </div>
  <canvas id="scene"></canvas>
  <script>
    // --- Config ---
    const sceneFile = new URLSearchParams(location.search).get('file') || 'examples/building/simla_only_sanctum.sim';
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const inspectorBody = document.getElementById('inspectorBody');
    // Camera as free-fly (position + yaw/pitch)
    let camera = {
      x: 0,
      y: 8,
      z: 34,
      yaw: Math.PI,
      pitch: -0.18,
      fov: Math.PI / 3
    };
    const keyState = new Set();
    let lastFrameTime = performance.now();
    let animationStarted = false;
    const MOVE_SPEED = 18;
    const LOOK_SENSITIVITY = 0.0022;
    let objects = [];
    let selectedIndex = -1;
    const MIN_CAMERA_FOV = Math.PI / 7.5;
    const MAX_CAMERA_FOV = Math.PI / 1.9;
    const NEAR_PLANE = 0.1;
    const KEY_LIGHT = normalizeVec({ x: 0.55, y: 0.95, z: 0.7 });
    const FILL_LIGHT = normalizeVec({ x: -0.8, y: 0.35, z: 0.25 });
    const AMBIENT_STRENGTH = 0.32;

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function normalizeVec(v) {
      const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }

    function computeLightShade(nx, ny, nz, nlen, options = {}) {
      const nnx = nx / nlen;
      const nny = ny / nlen;
      const nnz = nz / nlen;
      const key = Math.max(0, nnx * KEY_LIGHT.x + nny * KEY_LIGHT.y + nnz * KEY_LIGHT.z);
      const fill = Math.max(0, nnx * FILL_LIGHT.x + nny * FILL_LIGHT.y + nnz * FILL_LIGHT.z);
      const hemi = 0.5 + 0.5 * nny;

      const ambient = options.ambient ?? AMBIENT_STRENGTH;
      const keyStrength = options.keyStrength ?? 0.55;
      const fillStrength = options.fillStrength ?? 0.2;
      const hemiStrength = options.hemiStrength ?? 0.28;
      const shade = ambient + key * keyStrength + fill * fillStrength + hemi * hemiStrength;
      return clamp(shade, options.minShade ?? 0.2, options.maxShade ?? 1.4);
    }

    function drawSkyBackground() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#5f7fa5');
      sky.addColorStop(0.35, '#334b67');
      sky.addColorStop(1, '#141a24');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      const sunX = w * 0.62;
      const sunY = h * 0.18;
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, Math.max(w, h) * 0.45);
      sunGlow.addColorStop(0, 'rgba(255, 235, 190, 0.38)');
      sunGlow.addColorStop(0.25, 'rgba(255, 210, 120, 0.16)');
      sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(0, 0, w, h);

      const vignette = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.15, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
      vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vignette.addColorStop(1, 'rgba(0, 0, 0, 0.48)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, w, h);
    }

    function resizeCanvasToViewport() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = Math.max(1, Math.floor(window.innerWidth));
      const h = Math.max(1, Math.floor(window.innerHeight));
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // --- Simla scene loader (minimal) ---
    async function loadSimlaScene(file) {
      const res = await fetch('/api/scene?file=' + encodeURIComponent(file));
      const raw = await res.json();
      // Accepts either {objects: [...]}, or just [...]
      if (Array.isArray(raw)) return raw;
      if (raw && Array.isArray(raw.objects)) return raw.objects;
      return [];
    }

    // --- Perspective projection (true 3D) ---
    function getCameraBasis() {
      const cp = Math.cos(camera.pitch);
      const sp = Math.sin(camera.pitch);
      const cy = Math.cos(camera.yaw);
      const sy = Math.sin(camera.yaw);

      const forward = normalizeVec({
        x: sy * cp,
        y: sp,
        z: cy * cp
      });

      const worldUp = { x: 0, y: 1, z: 0 };
      let right = normalizeVec({
        x: worldUp.y * forward.z - worldUp.z * forward.y,
        y: worldUp.z * forward.x - worldUp.x * forward.z,
        z: worldUp.x * forward.y - worldUp.y * forward.x
      });

      if (Math.abs(right.x) + Math.abs(right.y) + Math.abs(right.z) < 1e-6) {
        right = { x: 1, y: 0, z: 0 };
      }

      const up = normalizeVec({
        x: forward.y * right.z - forward.z * right.y,
        y: forward.z * right.x - forward.x * right.z,
        z: forward.x * right.y - forward.y * right.x
      });

      return { forward, right, up };
    }

    // Transform a point to camera space
    function worldToCamera(x, y, z) {
      const basis = getCameraBasis();
      const px = x - camera.x;
      const py = y - camera.y;
      const pz = z - camera.z;
      // Camera space coordinates
      return {
        x: px*basis.right.x + py*basis.right.y + pz*basis.right.z,
        y: px*basis.up.x + py*basis.up.y + pz*basis.up.z,
        z: px*basis.forward.x + py*basis.forward.y + pz*basis.forward.z
      };
    }

    // Canonical perspective projection (from camera space)
    function projectCameraTo2D(cx, cy, cz) {
      const fov = camera.fov;
      if (cz < NEAR_PLANE) return null;
      const f = 0.5 * window.innerHeight / Math.tan(fov/2);
      return {
        x: window.innerWidth/2 + cx * f / cz,
        y: window.innerHeight/2 - cy * f / cz
      };
    }

    function project3Dto2D(x, y, z) {
      const cam = worldToCamera(x, y, z);
      return projectCameraTo2D(cam.x, cam.y, cam.z);
    }

    function projectedRadiusAt(cameraZ, worldRadius) {
      const fov = camera.fov;
      if (cameraZ < NEAR_PLANE) return 0;
      const f = 0.5 * window.innerHeight / Math.tan(fov/2);
      return Math.max(0, (worldRadius * f) / cameraZ);
    }

    function updateFlyCamera(dtSec) {
      const basis = getCameraBasis();
      const up = { x: 0, y: 1, z: 0 };

      let forwardInput = 0;
      if (keyState.has('w') || keyState.has('arrowup')) forwardInput += 1;
      if (keyState.has('s') || keyState.has('arrowdown')) forwardInput -= 1;

      let strafeInput = 0;
      if (keyState.has('d') || keyState.has('arrowright')) strafeInput += 1;
      if (keyState.has('a') || keyState.has('arrowleft')) strafeInput -= 1;

      let verticalInput = 0;
      if (keyState.has(' ') || keyState.has('space')) verticalInput += 1;
      if (keyState.has('control') || keyState.has('controlleft') || keyState.has('controlright') || keyState.has('c')) verticalInput -= 1;

      let mvx = basis.forward.x * forwardInput + basis.right.x * strafeInput + up.x * verticalInput;
      let mvy = basis.forward.y * forwardInput + basis.right.y * strafeInput + up.y * verticalInput;
      let mvz = basis.forward.z * forwardInput + basis.right.z * strafeInput + up.z * verticalInput;
      const mlen = Math.sqrt(mvx*mvx + mvy*mvy + mvz*mvz);
      if (mlen > 1e-6) {
        mvx /= mlen;
        mvy /= mlen;
        mvz /= mlen;
      }

      const boost = keyState.has('shift') || keyState.has('shiftleft') || keyState.has('shiftright') ? 2 : 1;
      const speed = MOVE_SPEED * boost;
      camera.x += mvx * speed * dtSec;
      camera.y += mvy * speed * dtSec;
      camera.z += mvz * speed * dtSec;
    }

    function clipPolygonToNearPlane(camVerts, near = NEAR_PLANE) {
      if (!camVerts || camVerts.length < 3) return [];
      let out = camVerts;
      const next = [];
      for (let i = 0; i < out.length; i++) {
        const a = out[i];
        const b = out[(i + 1) % out.length];
        const aIn = a.z >= near;
        const bIn = b.z >= near;

        if (aIn && bIn) {
          next.push(b);
          continue;
        }

        if (!aIn && !bIn) {
          continue;
        }

        const dz = b.z - a.z;
        if (Math.abs(dz) < 1e-8) continue;
        const t = (near - a.z) / dz;
        const ix = a.x + (b.x - a.x) * t;
        const iy = a.y + (b.y - a.y) * t;
        const iz = near;

        if (aIn && !bIn) {
          next.push({ x: ix, y: iy, z: iz });
        } else if (!aIn && bIn) {
          next.push({ x: ix, y: iy, z: iz });
          next.push(b);
        }
      }
      return next.length >= 3 ? next : [];
    }

    function drawCameraFace(camVerts, rgb, options = {}) {
      const clipped = clipPolygonToNearPlane(camVerts);
      if (clipped.length < 3) return;

      const v0 = clipped[0], v1 = clipped[1], v2 = clipped[2];
      const ux = v1.x - v0.x, uy = v1.y - v0.y, uz = v1.z - v0.z;
      const vx = v2.x - v0.x, vy = v2.y - v0.y, vz = v2.z - v0.z;
      const nx = uy*vz - uz*vy;
      const ny = uz*vx - ux*vz;
      const nz = ux*vy - uy*vx;
      const nlen = Math.sqrt(nx*nx + ny*ny + nz*nz);
      if (nlen < 1e-8) return;

      let cx = 0, cy = 0, cz = 0;
      for (const v of clipped) {
        cx += v.x;
        cy += v.y;
        cz += v.z;
      }
      cx /= clipped.length;
      cy /= clipped.length;
      cz /= clipped.length;

      const facing = nx * (-cx) + ny * (-cy) + nz * (-cz);
      if (facing <= 0) return;

      const shade = computeLightShade(nx, ny, nz, nlen, options);

      const projected = clipped.map(v => {
        const p = projectCameraTo2D(v.x, v.y, v.z);
        return p;
      });

      ctx.save();
      ctx.globalAlpha = options.alpha ?? 0.95;
      ctx.fillStyle = `rgb(${Math.round(rgb.r*shade)},${Math.round(rgb.g*shade)},${Math.round(rgb.b*shade)})`;
      ctx.strokeStyle = options.strokeStyle || '#222';
      ctx.lineWidth = options.lineWidth ?? 1;
      ctx.beginPath();
      ctx.moveTo(projected[0].x, projected[0].y);
      for (let i = 1; i < projected.length; i++) {
        ctx.lineTo(projected[i].x, projected[i].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function numberOr(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function objectScreenInfo(o) {
      const x = numberOr(o.x);
      const y = numberOr(o.y);
      const z = numberOr(o.z);
      const cam = worldToCamera(x, y, z);
      const p = projectCameraTo2D(cam.x, cam.y, cam.z);
      if (!p) return null;

      let worldRadius = 1;
      if (o.type === 'sphere') {
        worldRadius = numberOr(o.radius, 1);
      } else if (o.type === 'cylinder') {
        worldRadius = Math.max(numberOr(o.radiusTop, 1), numberOr(o.radiusBottom, 1));
      } else {
        worldRadius = Math.max(numberOr(o.sx, 1), numberOr(o.sy, 1), numberOr(o.sz, 1)) * 0.5;
      }

      const pxRadius = Math.max(8, projectedRadiusAt(cam.z, worldRadius));
      return { x: p.x, y: p.y, z: cam.z, pxRadius };
    }

    function distanceSq(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;
      return dx*dx + dy*dy;
    }

    function findNearestObjectAtScreen(sx, sy) {
      let best = null;
      for (let i = 0; i < objects.length; i++) {
        const o = objects[i];
        const info = objectScreenInfo(o);
        if (!info) continue;
        const d2 = distanceSq(sx, sy, info.x, info.y);
        const hitR = info.pxRadius * 1.05;
        if (d2 > hitR * hitR) continue;
        if (!best || info.z < best.z || (info.z === best.z && d2 < best.d2)) {
          best = { index: i, z: info.z, d2 };
        }
      }
      return best ? best.index : -1;
    }

    function toFixedNumber(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n.toFixed(2) : '0.00';
    }

    function updateInspector() {
      if (selectedIndex < 0 || selectedIndex >= objects.length) {
        inspectorBody.textContent = 'Click an object to inspect it.';
        return;
      }
      const o = objects[selectedIndex] || {};
      const lines = [
        `index: ${selectedIndex}`,
        `type: ${o.type || 'unknown'}`,
        '',
        `position: (${toFixedNumber(o.x)}, ${toFixedNumber(o.y)}, ${toFixedNumber(o.z)})`,
      ];

      if (o.type === 'cube') {
        lines.push(`size: (${toFixedNumber(o.sx)}, ${toFixedNumber(o.sy)}, ${toFixedNumber(o.sz)})`);
      } else if (o.type === 'sphere') {
        lines.push(`radius: ${toFixedNumber(o.radius)}`);
      } else if (o.type === 'cylinder') {
        lines.push(`radiusTop: ${toFixedNumber(o.radiusTop)}`);
        lines.push(`radiusBottom: ${toFixedNumber(o.radiusBottom)}`);
        lines.push(`height: ${toFixedNumber(o.height)}`);
      }

      lines.push(`color: rgb(${numberOr(o.r, 180)}, ${numberOr(o.g, 180)}, ${numberOr(o.b, 180)})`);

      inspectorBody.textContent = lines.join('\n');
    }

    function drawSelection(o) {
      const info = objectScreenInfo(o);
      if (!info) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 235, 120, 0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(info.x, info.y, info.pxRadius + 6, info.pxRadius + 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // --- Draw primitives (true 3D) ---
    function drawCube(o) {
      // 8 vertices of a cube centered at (x,y,z)
      const { x, y, z, sx=1, sy=1, sz=1, r=180, g=180, b=180 } = o;
      const verts = [
        [x-sx/2, y-sy/2, z-sz/2],
        [x+sx/2, y-sy/2, z-sz/2],
        [x+sx/2, y+sy/2, z-sz/2],
        [x-sx/2, y+sy/2, z-sz/2],
        [x-sx/2, y-sy/2, z+sz/2],
        [x+sx/2, y-sy/2, z+sz/2],
        [x+sx/2, y+sy/2, z+sz/2],
        [x-sx/2, y+sy/2, z+sz/2],
      ];
      // Transform all verts to camera space
      const camVerts = verts.map(([vx,vy,vz]) => worldToCamera(vx,vy,vz));
      // 6 faces, each as [vertex indices]
      const faces = [
        [0,3,2,1], // back (-z)
        [4,5,6,7], // front (+z)
        [0,1,5,4], // bottom (-y)
        [2,3,7,6], // top (+y)
        [1,2,6,5], // right (+x)
        [0,4,7,3], // left (-x)
      ];
      // Compute face depths for painter's order (average z in camera space)
      const faceDepths = faces.map(face => {
        let zsum = 0;
        for (const i of face) {
          zsum += camVerts[i].z;
        }
        return { idx: face, z: zsum/4 };
      });
      faceDepths.sort((a,b)=>a.z-b.z); // draw farthest first
      for (const f of faceDepths) {
        const faceVerts = f.idx.map(idx => camVerts[idx]);
        drawCameraFace(faceVerts, { r, g, b }, {
          alpha: 0.97,
          lineWidth: 1.5,
          ambient: 0.34,
          keyStrength: 0.56,
          fillStrength: 0.22,
          hemiStrength: 0.28,
          minShade: 0.22,
          maxShade: 1.35
        });
      }
    }
    function drawSphere(o) {
      const { x, y, z, radius=1, r=180, g=180, b=180 } = o;
      const latSegments = 16;
      const lonSegments = 24;
      const centerCam = worldToCamera(x, y, z);

      const camGrid = [];
      for (let lat = 0; lat <= latSegments; lat++) {
        const theta = (lat / latSegments) * Math.PI;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        const row = [];

        for (let lon = 0; lon <= lonSegments; lon++) {
          const phi = (lon / lonSegments) * Math.PI * 2;
          const sinP = Math.sin(phi);
          const cosP = Math.cos(phi);
          const wx = x + cosP * sinT * radius;
          const wy = y + cosT * radius;
          const wz = z + sinP * sinT * radius;
          row.push(worldToCamera(wx, wy, wz));
        }
        camGrid.push(row);
      }

      function orientOutward(a, b, c) {
        const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
        const vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
        const nx = uy*vz - uz*vy;
        const ny = uz*vx - ux*vz;
        const nz = ux*vy - uy*vx;
        const cx = (a.x + b.x + c.x) / 3 - centerCam.x;
        const cy = (a.y + b.y + c.y) / 3 - centerCam.y;
        const cz = (a.z + b.z + c.z) / 3 - centerCam.z;
        const outward = nx * cx + ny * cy + nz * cz;
        return outward >= 0 ? [a, b, c] : [a, c, b];
      }

      const faces = [];
      for (let lat = 0; lat < latSegments; lat++) {
        for (let lon = 0; lon < lonSegments; lon++) {
          const v00 = camGrid[lat][lon];
          const v01 = camGrid[lat][lon + 1];
          const v10 = camGrid[lat + 1][lon];
          const v11 = camGrid[lat + 1][lon + 1];
          faces.push(orientOutward(v00, v10, v11));
          faces.push(orientOutward(v00, v11, v01));
        }
      }

      const sortedFaces = faces.map((verts) => {
        const z = (verts[0].z + verts[1].z + verts[2].z) / 3;
        return { verts, z };
      }).sort((a, b) => a.z - b.z);

      for (const face of sortedFaces) {
        drawCameraFace(face.verts, { r, g, b }, {
          alpha: 0.97,
          lineWidth: 0.5,
          strokeStyle: 'rgba(8, 10, 14, 0.12)',
          ambient: 0.34,
          keyStrength: 0.58,
          fillStrength: 0.2,
          hemiStrength: 0.26,
          minShade: 0.2,
          maxShade: 1.32
        });
      }
    }
    function drawCylinder(o) {
      const { x, y, z, radiusTop=1, radiusBottom=1, height=2, r=180, g=180, b=180 } = o;
      const segments = 18;
      const halfH = height * 0.5;

      const topRing = [];
      const bottomRing = [];
      for (let i = 0; i < segments; i++) {
        const t = (i / segments) * Math.PI * 2;
        const ct = Math.cos(t);
        const st = Math.sin(t);
        topRing.push(worldToCamera(x + ct * radiusTop, y + halfH, z + st * radiusTop));
        bottomRing.push(worldToCamera(x + ct * radiusBottom, y - halfH, z + st * radiusBottom));
      }

      const centerTop = worldToCamera(x, y + halfH, z);
      const centerBottom = worldToCamera(x, y - halfH, z);
      const faces = [];

      for (let i = 0; i < segments; i++) {
        const j = (i + 1) % segments;
        // Side quad winding points outward.
        faces.push([topRing[i], topRing[j], bottomRing[j], bottomRing[i]]);
      }

      // Top cap (+y) and bottom cap (-y).
      for (let i = 0; i < segments; i++) {
        const j = (i + 1) % segments;
        faces.push([centerTop, topRing[j], topRing[i]]);
        faces.push([centerBottom, bottomRing[i], bottomRing[j]]);
      }

      const sortedFaces = faces.map((verts) => {
        let zsum = 0;
        for (const v of verts) zsum += v.z;
        return { verts, z: zsum / verts.length };
      }).sort((a, b) => a.z - b.z);

      for (const face of sortedFaces) {
        const verts = face.verts;
        drawCameraFace(verts, { r, g, b }, {
          alpha: 0.94,
          lineWidth: 1,
          ambient: 0.35,
          keyStrength: 0.5,
          fillStrength: 0.23,
          hemiStrength: 0.24,
          minShade: 0.24,
          maxShade: 1.28
        });
      }
    }

    // --- Main render loop ---
    function render() {
      drawSkyBackground();
      // Sort by camera-space depth for painter's order across object types
      const sorted = [...objects].sort((a, b) => {
        const ca = worldToCamera(a.x||0, a.y||0, a.z||0);
        const cb = worldToCamera(b.x||0, b.y||0, b.z||0);
        return cb.z - ca.z;
      });
      for (const o of sorted) {
        if (o.type === 'cube') drawCube(o);
        else if (o.type === 'sphere') drawSphere(o);
        else if (o.type === 'cylinder') drawCylinder(o);
      }

      if (selectedIndex >= 0 && selectedIndex < objects.length) {
        drawSelection(objects[selectedIndex]);
      }
    }

    // --- Controls (fly camera + mouse look) ---
    document.addEventListener('keydown', e => {
      keyState.add(e.key.toLowerCase());
      if (e.key === ' ') e.preventDefault();
    });

    document.addEventListener('keyup', e => {
      keyState.delete(e.key.toLowerCase());
    });

    canvas.addEventListener('click', e => {
      if (e.shiftKey) {
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        selectedIndex = findNearestObjectAtScreen(sx, sy);
        updateInspector();
        return;
      }
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
      }
    });

    document.addEventListener('mousemove', e => {
      if (document.pointerLockElement !== canvas) return;
      camera.yaw += e.movementX * LOOK_SENSITIVITY;
      camera.pitch -= e.movementY * LOOK_SENSITIVITY;
      camera.pitch = clamp(camera.pitch, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);
    });

    function animationFrame(now) {
      const dtSec = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
      lastFrameTime = now;
      updateFlyCamera(dtSec);
      render();
      requestAnimationFrame(animationFrame);
    }

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      camera.fov = clamp(camera.fov + e.deltaY * 0.0012, MIN_CAMERA_FOV, MAX_CAMERA_FOV);
    }, { passive: false });

    window.addEventListener('resize', () => {
      resizeCanvasToViewport();
      render();
    });

    // --- Init ---
    loadSimlaScene(sceneFile).then(objs => {
      objects = objs;
      selectedIndex = -1;
      updateInspector();
      resizeCanvasToViewport();
      if (!animationStarted) {
        animationStarted = true;
        lastFrameTime = performance.now();
        requestAnimationFrame(animationFrame);
      }
    });
  </script>
</body>
</html>
