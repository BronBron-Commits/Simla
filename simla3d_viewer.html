<!DOCTYPE html>
<html>
<head>
  <title>Simla3D Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      color: #eaf6ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      max-width: 420px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(5, 12, 20, 0.82);
      border: 1px solid rgba(120, 180, 255, 0.25);
      box-shadow: 0 20px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    #hud h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    #hud p {
      margin: 4px 0;
      color: #b8cce0;
      font-size: 13px;
      line-height: 1.35;
    }

    #status {
      margin-top: 8px;
      color: #88ffcc;
      font-size: 12px;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 8px;
      color: #ff7777;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Simla3D Viewer</h1>
    <p>Scene source: <code>examples/simla3d_demo.sim</code></p>
    <p>WASD / arrows move camera. Drag mouse to orbit. Scroll zooms.</p>
    <div id="status">loading...</div>
    <div id="error"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#071018");

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(20, 16, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));

    const root = new THREE.Group();
    scene.add(root);

    const keys = new Set();

    let yaw = -0.65;
    let pitch = -0.45;
    let radius = 34;
    let target = new THREE.Vector3(0, 0, 0);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    window.addEventListener("pointerdown", e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointerup", () => {
      dragging = false;
    });

    window.addEventListener("pointermove", e => {
      if (!dragging) return;

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      lastX = e.clientX;
      lastY = e.clientY;

      yaw -= dx * 0.006;
      pitch -= dy * 0.004;
      pitch = Math.max(-1.25, Math.min(-0.12, pitch));
    });

    window.addEventListener("wheel", e => {
      radius += e.deltaY * 0.015;
      radius = Math.max(6, Math.min(80, radius));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try {
        return new THREE.Color(v || fallback);
      } catch {
        return new THREE.Color(fallback);
      }
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) {
        obj[arr[i]] = arr[i + 1];
      }
      return obj;
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        obj.traverse?.(child => {
          child.geometry?.dispose?.();
          child.material?.dispose?.();
          if (child.material?.map) child.material.map.dispose?.();
        });
      }
    }

    function makeMaterial(o, fallback) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness: 0.65,
        metalness: 0.05
      });
    }

    function addFloor(o) {
      const w = num(o.w, 20);
      const d = num(o.d, 20);

      const geo = new THREE.BoxGeometry(w, 0.12, d);
      const mat = makeMaterial(o, "#203020");
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.set(num(o.x), num(o.y) - 0.06, num(o.z));
      root.add(mesh);

      const grid = new THREE.GridHelper(Math.max(w, d), Math.max(w, d));
      grid.position.y = 0.02;
      root.add(grid);
    }

    function addCube(o) {
      const size = num(o.size, 1);
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = makeMaterial(o, "#ffffff");

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(num(o.x), num(o.y), num(o.z));
      mesh.name = String(o.id || "cube");
      root.add(mesh);

      addLabelFor(o, size * 0.75);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);

      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = makeMaterial(o, "#999999");

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(num(o.x), num(o.y), num(o.z));
      mesh.name = String(o.id || "box");
      root.add(mesh);

      const roofGeo = new THREE.BoxGeometry(w * 1.08, 0.18, d * 1.08);
      const roofMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#1c2530"),
        roughness: 0.8
      });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(num(o.x), num(o.y) + h / 2 + 0.12, num(o.z));
      root.add(roof);

      addLabelFor(o, h * 0.65);
    }

    function addPerson(o) {
      const x = num(o.x);
      const y = num(o.y, 1);
      const z = num(o.z);

      const group = new THREE.Group();
      group.name = String(o.id || "person");
      group.position.set(x, y, z);

      const bodyGeo = new THREE.CapsuleGeometry(0.28, 0.75, 4, 10);
      const bodyMat = makeMaterial(o, "#55ccff");
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.25;
      group.add(body);

      const headGeo = new THREE.SphereGeometry(0.24, 16, 12);
      const headMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#f0c8a0"),
        roughness: 0.75
      });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 0.95;
      group.add(head);

      const shadowGeo = new THREE.CircleGeometry(0.42, 24);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.28,
        depthWrite: false
      });
      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -0.97;
      group.add(shadow);

      root.add(group);

      const labelText = o.target ? `${o.id} → ${o.target}` : o.id;
      addLabelFor({ id: labelText, x, y: y + 1.65, z }, 0);
    }

    function addLocation(o) {
      const x = num(o.x);
      const y = num(o.y, 0.08);
      const z = num(o.z);

      const geo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: color(o.color, "#ddddff"),
        emissive: color(o.color, "#ddddff"),
        emissiveIntensity: 0.25,
        roughness: 0.45
      });

      const marker = new THREE.Mesh(geo, mat);
      marker.position.set(x, y, z);
      root.add(marker);

      addLabelFor(o, 0.7);
    }

    function addRoute(o) {
      const from = new THREE.Vector3(num(o.fromX), num(o.fromY, 1.05), num(o.fromZ));
      const to = new THREE.Vector3(num(o.toX), num(o.toY, 0.15), num(o.toZ));

      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const mat = new THREE.LineBasicMaterial({
        color: color(o.color, "#ffffff"),
        transparent: true,
        opacity: 0.75
      });

      const line = new THREE.Line(geo, mat);
      root.add(line);

      const dotGeo = new THREE.SphereGeometry(0.14, 12, 8);
      const dotMat = new THREE.MeshStandardMaterial({
        color: color(o.color, "#ffffff"),
        emissive: color(o.color, "#ffffff"),
        emissiveIntensity: 0.3
      });

      const dot = new THREE.Mesh(dotGeo, dotMat);
      const pulse = (Math.sin(Date.now() * 0.004) + 1) * 0.5;
      dot.position.lerpVectors(from, to, pulse);
      root.add(dot);
    }

    function addLight(o) {
      const light = new THREE.DirectionalLight(
        color(o.color, "#ffffff"),
        num(o.intensity, 1)
      );

      light.position.set(num(o.x), num(o.y, 8), num(o.z));
      root.add(light);
    }

    function applyCamera(o) {
      target.set(num(o.tx), num(o.ty), num(o.tz));

      camera.position.set(num(o.x, 20), num(o.y, 16), num(o.z, 28));
      radius = camera.position.distanceTo(target);
      camera.lookAt(target);
    }

    function addLabelFor(o, yOffset) {
      if (!o.id) return;

      const label = makeLabel(String(o.id));
      label.position.set(num(o.x), num(o.y) + yOffset, num(o.z));
      root.add(label);
    }

    function makeLabel(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 64;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";
      ctx.font = "28px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 32);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.4, 0.6, 1);

      return sprite;
    }

    async function loadScene() {
      errorEl.textContent = "";

      try {
        const res = await fetch("/api/scene?file=examples/simla3d_demo.sim&cacheBust=" + Date.now());
        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error(JSON.stringify(data, null, 2));
        }

        clearRoot();

        let count = 0;

        for (const item of data) {
          if (!Array.isArray(item)) continue;

          const o = pairsToObj(item);

          if (o.type === "floor") addFloor(o);
          else if (o.type === "cube") addCube(o);
          else if (o.type === "box") addBox(o);
          else if (o.type === "person") addPerson(o);
          else if (o.type === "agent") addPerson(o);
          else if (o.type === "location") addLocation(o);
          else if (o.type === "route") addRoute(o);
          else if (o.type === "light") addLight(o);
          else if (o.type === "camera") applyCamera(o);

          count++;
        }

        statusEl.textContent = `loaded ${count} Simla3D objects`;
      } catch (err) {
        errorEl.textContent = String(err.message || err);
        statusEl.textContent = "scene load failed";
      }
    }

    function updateCamera() {
      const speed = 0.24;

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      if (keys.has("w") || keys.has("arrowup")) target.addScaledVector(forward, speed);
      if (keys.has("s") || keys.has("arrowdown")) target.addScaledVector(forward, -speed);
      if (keys.has("a") || keys.has("arrowleft")) target.addScaledVector(right, -speed);
      if (keys.has("d") || keys.has("arrowright")) target.addScaledVector(right, speed);

      camera.position.x = target.x + Math.sin(yaw) * Math.cos(pitch) * radius;
      camera.position.z = target.z + Math.cos(yaw) * Math.cos(pitch) * radius;
      camera.position.y = target.y + Math.sin(-pitch) * radius;

      camera.lookAt(target);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      renderer.render(scene, camera);
    }

    loadScene();
    setInterval(loadScene, 1000);
    animate();
  </script>
</body>
</html>
