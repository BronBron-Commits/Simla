<!DOCTYPE html>
<html>
<head>
  <title>Simla3D Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      color: #eaf6ff;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      max-width: 420px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(5, 12, 20, 0.76);
      border: 1px solid rgba(120, 180, 255, 0.25);
      box-shadow: 0 20px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    #hud h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    #hud p {
      margin: 4px 0;
      color: #b8cce0;
      font-size: 13px;
      line-height: 1.35;
    }

    #status {
      margin-top: 8px;
      color: #88ffcc;
      font-size: 12px;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 8px;
      color: #ff7777;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Simla3D Viewer</h1>
    <p>Scene source: <code>examples/simla3d_demo.sim</code></p>
    <p>WASD / arrows move camera. Drag mouse to orbit. Scroll zooms.</p>
    <div id="status">loading...</div>
    <div id="error"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#cfe7ff");
    scene.fog = new THREE.FogExp2("#cfe7ff", 0.004);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(20, 16, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight("#eaf6ff", "#6b8a6f", 1.8);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight("#ffffff", 2.4);
    sun.position.set(12, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -45;
    sun.shadow.camera.right = 45;
    sun.shadow.camera.top = 45;
    sun.shadow.camera.bottom = -45;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 80;
    scene.add(sun);

    const root = new THREE.Group();
    scene.add(root);

    const keys = new Set();

    let yaw = -0.65;
    let pitch = -0.45;
    let radius = 34;
    let target = new THREE.Vector3(0, 0, 0);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    window.addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
    window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

    window.addEventListener("pointerdown", e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointerup", () => dragging = false);

    window.addEventListener("pointermove", e => {
      if (!dragging) return;

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      lastX = e.clientX;
      lastY = e.clientY;

      yaw -= dx * 0.006;
      pitch -= dy * 0.004;
      pitch = Math.max(-1.25, Math.min(-0.12, pitch));
    });

    window.addEventListener("wheel", e => {
      radius += e.deltaY * 0.015;
      radius = Math.max(6, Math.min(80, radius));
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function num(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function color(v, fallback = "#ffffff") {
      try {
        return new THREE.Color(v || fallback);
      } catch {
        return new THREE.Color(fallback);
      }
    }

    function isPairList(value) {
      if (!Array.isArray(value) || value.length % 2 !== 0) return false;
      for (let i = 0; i < value.length; i += 2) {
        if (typeof value[i] !== "string") return false;
      }
      return true;
    }

    function isSimlaObject(value) {
      return !!value && typeof value === "object" && value.__simlaKind === "object" && value.props && typeof value.props === "object";
    }

    function isSimlaNode(value) {
      return !!value && typeof value === "object" && value.__simlaKind === "node";
    }

    function pairsToObj(arr) {
      const obj = {};
      for (let i = 0; i < arr.length - 1; i += 2) {
        if (typeof arr[i] === "string") obj[arr[i]] = arr[i + 1];
      }
      return obj;
    }

    function objectProps(value) {
      if (isSimlaObject(value)) return value.props;
      if (isPairList(value)) return pairsToObj(value);
      if (value && typeof value === "object" && !Array.isArray(value)) return value;
      return {};
    }

    function mergeTransform(inherited, local) {
      return {
        x: num(inherited.x) + num(local.x),
        y: num(inherited.y) + num(local.y),
        z: num(inherited.z) + num(local.z),
        rotX: num(inherited.rotX) + num(local.rotX),
        rotY: num(inherited.rotY) + num(local.rotY),
        rotZ: num(inherited.rotZ) + num(local.rotZ)
      };
    }

    function applyTransform(props, tf) {
      return {
        ...props,
        x: num(props.x) + num(tf.x),
        y: num(props.y) + num(tf.y),
        z: num(props.z) + num(tf.z),
        rotX: num(props.rotX) + num(tf.rotX),
        rotY: num(props.rotY) + num(tf.rotY),
        rotZ: num(props.rotZ) + num(tf.rotZ)
      };
    }

    function normalizeSceneItems(payload) {
      const root = payload && payload.result ? payload.result : payload;
      const out = [];

      function walkNode(node, inheritedTf) {
        const props = objectProps(node.props);
        const nextTf = mergeTransform(inheritedTf, props);
        const emitted = props.type ? applyTransform(props, inheritedTf) : null;

        if (emitted) out.push(emitted);

        const children = Array.isArray(node.children) ? node.children : [];
        for (const child of children) {
          if (isSimlaNode(child)) {
            walkNode(child, nextTf);
            continue;
          }
          if (isPairList(child)) {
            out.push(pairsToObj(child));
            continue;
          }
          if (isSimlaObject(child)) {
            out.push({ ...child.props });
          }
        }
      }

      if (Array.isArray(root)) {
        for (const item of root) {
          if (isSimlaNode(item)) {
            walkNode(item, { x: 0, y: 0, z: 0, rotX: 0, rotY: 0, rotZ: 0 });
            continue;
          }
          if (isPairList(item)) {
            out.push(pairsToObj(item));
            continue;
          }
          if (isSimlaObject(item)) {
            out.push({ ...item.props });
            continue;
          }
          if (item && typeof item === "object" && !Array.isArray(item)) {
            out.push(item);
          }
        }
      } else if (isSimlaNode(root)) {
        walkNode(root, { x: 0, y: 0, z: 0, rotX: 0, rotY: 0, rotZ: 0 });
      }

      return out;
    }

    function disposeObj(obj) {
      obj.traverse?.(child => {
        child.geometry?.dispose?.();

        if (Array.isArray(child.material)) {
          child.material.forEach(m => {
            m.map?.dispose?.();
            m.dispose?.();
          });
        } else {
          child.material?.map?.dispose?.();
          child.material?.dispose?.();
        }
      });
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children.pop();
        disposeObj(obj);
      }
    }

    function makeMaterial(o, fallback, roughness = 0.7) {
      return new THREE.MeshStandardMaterial({
        color: color(o.color, fallback),
        roughness,
        metalness: 0.04
      });
    }

    function addRoad(x1, z1, x2, z2, width = 1.1) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const len = Math.sqrt(dx * dx + dz * dz);

      const geo = new THREE.BoxGeometry(width, 0.04, len);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#222831"),
        roughness: 0.9
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((x1 + x2) * 0.5, 0.035, (z1 + z2) * 0.5);
      mesh.rotation.y = Math.atan2(dx, dz);
      mesh.receiveShadow = true;
      root.add(mesh);

      const lineGeo = new THREE.BoxGeometry(0.08, 0.045, len * 0.86);
      const lineMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#d8c76d"),
        roughness: 0.8
      });

      const line = new THREE.Mesh(lineGeo, lineMat);
      line.position.copy(mesh.position);
      line.position.y += 0.025;
      line.rotation.y = mesh.rotation.y;
      root.add(line);
    }

    function addFloor(o) {
      const w = num(o.w, 20);
      const d = num(o.d, 20);

      const geo = new THREE.BoxGeometry(w, 0.12, d);
      const mat = new THREE.MeshStandardMaterial({
        color: color(o.color, "#2e5a3a"),
        roughness: 0.95,
        metalness: 0
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(num(o.x), num(o.y) - 0.06, num(o.z));
      mesh.receiveShadow = true;
      root.add(mesh);

      const grid = new THREE.GridHelper(Math.max(w, d), Math.max(w, d), "#34513a", "#263b2c");
      grid.position.y = 0.025;
      root.add(grid);

      addRoad(-10, -8, 0, -8);
      addRoad(0, -8, 10, 8);
      addRoad(-6, -10, 10, 8);
      addRoad(-10, -8, 10, 8);

      addTree(-14, -12);
      addTree(-13, 1);
      addTree(-4, 7);
      addTree(4, -13);
      addTree(15, 0);
      addTree(16, 14);
      addTree(-16, 12);

      addLamp(-8, -8);
      addLamp(0, -8);
      addLamp(6, 2);
      addLamp(10, 8);
    }

    function addCube(o) {
      const size = num(o.size, 1);
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = makeMaterial(o, "#ffffff");

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(num(o.x), num(o.y), num(o.z));
      mesh.name = String(o.id || "cube");
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      root.add(mesh);

      addLabelFor(o, size * 0.75);
    }

    function addBox(o) {
      const w = num(o.w, 1);
      const h = num(o.h, 1);
      const d = num(o.d, 1);
      const x = num(o.x);
      const y = num(o.y);
      const z = num(o.z);

      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = makeMaterial(o, "#999999", 0.78);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.name = String(o.id || "box");
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      root.add(mesh);

      const roofGeo = new THREE.BoxGeometry(w * 1.08, 0.18, d * 1.08);
      const roofMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#151d28"),
        roughness: 0.85
      });

      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(x, y + h / 2 + 0.12, z);
      roof.castShadow = true;
      roof.receiveShadow = true;
      root.add(roof);

      addWindows(x, z, w, h, d, y);

      if (String(o.id || "").includes("mall")) {
        addSign(x, y + h / 2 + 0.55, z - d / 2 - 0.08, "MALL");
      } else if (String(o.id || "").includes("shop")) {
        addSign(x, y + h / 2 + 0.4, z - d / 2 - 0.08, "SHOP");
      }

      addLabelFor(o, h * 0.65);
    }

    function addWindows(x, z, w, h, d, centerY) {
      const rows = Math.max(1, Math.floor(h / 1.2));
      const colsFront = Math.max(2, Math.floor(w / 1.1));
      const colsSide = Math.max(2, Math.floor(d / 1.1));

      const winMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#cde8ff"),
        emissive: new THREE.Color("#4d8fbd"),
        emissiveIntensity: 0.35,
        roughness: 0.35
      });

      function addWindow(wx, wy, wz, rotY) {
        const geo = new THREE.BoxGeometry(0.36, 0.36, 0.035);
        const win = new THREE.Mesh(geo, winMat);
        win.position.set(wx, wy, wz);
        win.rotation.y = rotY;
        root.add(win);
      }

      for (let r = 0; r < rows; r++) {
        const wy = centerY - h / 2 + 0.75 + r * 1.05;

        for (let c = 0; c < colsFront; c++) {
          const wx = x - w / 2 + 0.6 + c * ((w - 1.2) / Math.max(1, colsFront - 1));

          // front
          addWindow(wx, wy, z - d / 2 - 0.021, 0);

          // back
          addWindow(wx, wy, z + d / 2 + 0.021, Math.PI);
        }

        for (let c = 0; c < colsSide; c++) {
          const wz = z - d / 2 + 0.6 + c * ((d - 1.2) / Math.max(1, colsSide - 1));

          // left
          addWindow(x - w / 2 - 0.021, wy, wz, Math.PI / 2);

          // right
          addWindow(x + w / 2 + 0.021, wy, wz, -Math.PI / 2);
        }
      }
    }

    function addPerson(o) {
      const x = num(o.x);
      const baseY = num(o.y, 1);
      const z = num(o.z);
      const bob = Math.sin(Date.now() * 0.008 + x * 0.3 + z * 0.2) * 0.05;

      const group = new THREE.Group();
      group.name = String(o.id || "person");
      group.position.set(x, baseY + bob, z);

      const bodyGeo = new THREE.CapsuleGeometry(0.28, 0.75, 4, 10);
      const bodyMat = makeMaterial(o, "#55ccff", 0.6);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.25;
      body.castShadow = true;
      group.add(body);

      const headGeo = new THREE.SphereGeometry(0.24, 16, 12);
      const headMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color("#f0c8a0"),
        roughness: 0.75
      });

      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 0.95;
      head.castShadow = true;
      group.add(head);

      const shadowGeo = new THREE.CircleGeometry(0.42, 24);
      const shadowMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.24,
        depthWrite: false
      });

      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -0.97 - bob;
      group.add(shadow);

      root.add(group);

      const labelText = o.target ? `${o.id} -> ${o.target}` : o.id;
      addLabelFor({ id: labelText, x, y: baseY + 1.65, z }, 0);
    }

    function addLocation(o) {
      const x = num(o.x);
      const y = num(o.y, 0.08);
      const z = num(o.z);

      const geo = new THREE.CylinderGeometry(0.55, 0.55, 0.12, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: color(o.color, "#ddddff"),
        emissive: color(o.color, "#ddddff"),
        emissiveIntensity: 0.35,
        roughness: 0.45
      });

      const marker = new THREE.Mesh(geo, mat);
      marker.position.set(x, y, z);
      marker.castShadow = true;
      marker.receiveShadow = true;
      root.add(marker);

      const ringGeo = new THREE.TorusGeometry(0.74, 0.025, 8, 40);
      const ringMat = new THREE.MeshBasicMaterial({
        color: color(o.color, "#ddddff"),
        transparent: true,
        opacity: 0.75
      });

      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.set(x, y + 0.08, z);
      root.add(ring);

      addLabelFor(o, 0.7);
    }

    function addRoute(o) {
      const from = new THREE.Vector3(num(o.fromX), num(o.fromY, 1.05), num(o.fromZ));
      const to = new THREE.Vector3(num(o.toX), num(o.toY, 0.15), num(o.toZ));

      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const mat = new THREE.LineBasicMaterial({
        color: color(o.color, "#ffffff"),
        transparent: true,
        opacity: 0.58
      });

      const line = new THREE.Line(geo, mat);
      root.add(line);

      // route dot disabled for performance
    });

      const dot = new THREE.Mesh(dotGeo, dotMat);
      const pulse = (Math.sin(Date.now() * 0.004) + 1) * 0.5;
      dot.position.lerpVectors(from, to, pulse);
      dot.castShadow = true;
      root.add(dot);
    }

    function addLight(o) {
      const light = new THREE.PointLight(
        color(o.color, "#ffffff"),
        num(o.intensity, 1.2),
        24
      );

      light.position.set(num(o.x), num(o.y, 8), num(o.z));
      root.add(light);
    }

    function addTree(x, z) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.16, 1.1, 8),
        new THREE.MeshStandardMaterial({ color: new THREE.Color("#6a4528"), roughness: 0.9 })
      );
      trunk.position.set(x, 0.55, z);
      trunk.castShadow = true;
      root.add(trunk);

      const crown = new THREE.Mesh(
        new THREE.SphereGeometry(0.68, 14, 10),
        new THREE.MeshStandardMaterial({ color: new THREE.Color("#1e6b3a"), roughness: 0.85 })
      );
      crown.position.set(x, 1.35, z);
      crown.castShadow = true;
      crown.receiveShadow = true;
      root.add(crown);
    }

    function addLamp(x, z) {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.045, 2.2, 8),
        new THREE.MeshStandardMaterial({ color: new THREE.Color("#303946"), roughness: 0.45 })
      );
      pole.position.set(x, 1.1, z);
      pole.castShadow = true;
      root.add(pole);

      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 12, 8),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color("#fff2aa"),
          emissive: new THREE.Color("#ffd86b"),
          emissiveIntensity: 1.2
        })
      );
      bulb.position.set(x, 2.25, z);
      root.add(bulb);

      const light = new THREE.PointLight("#ffd86b", 0.65, 8);
      light.position.set(x, 2.25, z);
      root.add(light);
    }

    function addSign(x, y, z, text) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 96;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#10151e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#79c7ff";
      ctx.lineWidth = 6;
      ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);
      ctx.fillStyle = "#eaf6ff";
      ctx.font = "bold 42px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 50);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex });
      const geo = new THREE.PlaneGeometry(2.4, 0.9);

      const sign = new THREE.Mesh(geo, mat);
      sign.position.set(x, y, z);
      root.add(sign);
    }

    function applyCamera(o) {
      target.set(num(o.tx), num(o.ty), num(o.tz));
      camera.position.set(num(o.x, 20), num(o.y, 16), num(o.z, 28));
      radius = camera.position.distanceTo(target);
      camera.lookAt(target);
    }

    function addLabelFor(o, yOffset) {
      if (!o.id) return;

      const id = String(o.id);
      const important =
        id.includes("mall") ||
        id.includes("shop") ||
        id.includes("school") ||
        id.includes("office") ||
        id.includes("station") ||
        id.includes("park") ||
        id.includes("plaza");

      if (!important) return;

      const label = makeLabel(id);
      label.position.set(num(o.x), num(o.y) + yOffset, num(o.z));
      root.add(label);
    }

    function makeLabel(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 384;
      canvas.height = 80;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(0,0,0,0.62)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(160,210,255,0.35)";
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
      ctx.fillStyle = "white";
      ctx.font = "30px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 192, 40);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(3.2, 0.68, 1);

      return sprite;
    }

    async function loadScene() {
      errorEl.textContent = "";

      try {
        const res = await fetch("/api/scene?file=examples/simla3d_demo.sim&cacheBust=" + Date.now());
        const raw = await res.json();
        const data = normalizeSceneItems(raw);

        clearRoot();

        let count = 0;

        for (const o of data) {
          if (!o || typeof o !== "object") continue;

          if (o.type === "floor") addFloor(o);
          else if (o.type === "cube") addCube(o);
          else if (o.type === "box") addBox(o);
          else if (o.type === "person") addPerson(o);
          else if (o.type === "agent") addPerson(o);
          else if (o.type === "location") addLocation(o);
          else if (o.type === "route") addRoute(o);
          else if (o.type === "light") addLight(o);
          else if (o.type === "camera") applyCamera(o);

          count++;
        }

        statusEl.textContent = `loaded ${count} Simla3D objects`;
      } catch (err) {
        errorEl.textContent = String(err.message || err);
        statusEl.textContent = "scene load failed";
      }
    }

    function updateCamera() {
      const speed = 0.24;

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      if (keys.has("w") || keys.has("arrowup")) target.addScaledVector(forward, speed);
      if (keys.has("s") || keys.has("arrowdown")) target.addScaledVector(forward, -speed);
      if (keys.has("a") || keys.has("arrowleft")) target.addScaledVector(right, -speed);
      if (keys.has("d") || keys.has("arrowright")) target.addScaledVector(right, speed);

      camera.position.x = target.x + Math.sin(yaw) * Math.cos(pitch) * radius;
      camera.position.z = target.z + Math.cos(yaw) * Math.cos(pitch) * radius;
      camera.position.y = target.y + Math.sin(-pitch) * radius;

      camera.lookAt(target);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCamera();
      renderer.render(scene, camera);
    }

    loadScene();
    setInterval(loadScene, 900);
    animate();
  </script>
</body>
</html>
