<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simλ Terrain 3D</title>
<style>
body {
  margin: 0;
  background: #050812;
  color: #e6f3ff;
  font-family: system-ui;
  overflow: hidden;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,.65);
  border: 1px solid rgba(102,204,255,.25);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 0 24px rgba(102,204,255,.14);
}

canvas {
  display: block;
}
</style>
</head>
<body>
<div id="hud">Simλ Terrain 3D</div>
<canvas id="view"></canvas>

<script type="module">
import { parse } from "./src/parser.js";
import { compile } from "./src/compiler.js";
import { run } from "./src/vm.js";

function tokenize(code) {
  return code
    .replace(/;;.*$/gm, "")
    .replace(/\(/g, " ( ")
    .replace(/\)/g, " ) ")
    .match(/"[^"]*"|\S+/g);
}

function get(list, key) {
  if (!Array.isArray(list)) return null;
  for (let i = 0; i < list.length; i += 2) {
    if (list[i] === key) return list[i + 1];
  }
  return null;
}

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

const code = await fetch("./examples/terrain_16.sim").then(r => r.text());
const ast = parse(tokenize(code));
const bytecode = compile(ast);
const terrain = run(bytecode, {}).result;

const width = get(terrain, "width");
const height = get(terrain, "height");
const tiles = get(terrain, "tiles") || [];
const playerSpawns = get(terrain, "playerSpawns") || [];
const enemySpawns = get(terrain, "enemySpawns") || [];

function biomeColor(tile) {
  const biome = get(tile, "biome");

  if (biome === "water") return [35, 90, 170];
  if (biome === "grass") return [55, 160, 90];
  if (biome === "hill") return [130, 125, 80];
  if (biome === "mountain") return [190, 190, 185];

  return [90, 90, 90];
}

function iso(x, y, h) {
  const tileW = Math.min(canvas.width, canvas.height) / 15;
  const tileH = tileW * 0.5;
  const elev = tileW * 0.45;

  const ox = canvas.width / 2;
  const oy = canvas.height * 0.22;

  return {
    x: ox + (x - y) * tileW * 0.5,
    y: oy + (x + y) * tileH * 0.5 - h * elev,
    tileW,
    tileH,
    elev
  };
}

function shade([r,g,b], amount) {
  return `rgb(${Math.max(0, r * amount)},${Math.max(0, g * amount)},${Math.max(0, b * amount)})`;
}

function drawDiamond(cx, cy, tw, th, color) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - th / 2);
  ctx.lineTo(cx + tw / 2, cy);
  ctx.lineTo(cx, cy + th / 2);
  ctx.lineTo(cx - tw / 2, cy);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBlock(tile) {
  const x = get(tile, "x");
  const y = get(tile, "y");
  const h = get(tile, "height") || 1;
  const base = biomeColor(tile);

  const p = iso(x, y, h);
  const ground = iso(x, y, 0);

  const cx = p.x;
  const cy = p.y;
  const gx = ground.x;
  const gy = ground.y;

  const tw = p.tileW;
  const th = p.tileH;

  const depth = gy - cy;

  // left side
  ctx.beginPath();
  ctx.moveTo(cx - tw / 2, cy);
  ctx.lineTo(cx, cy + th / 2);
  ctx.lineTo(gx, gy + th / 2);
  ctx.lineTo(gx - tw / 2, gy);
  ctx.closePath();
  ctx.fillStyle = shade(base, 0.55);
  ctx.fill();

  // right side
  ctx.beginPath();
  ctx.moveTo(cx + tw / 2, cy);
  ctx.lineTo(cx, cy + th / 2);
  ctx.lineTo(gx, gy + th / 2);
  ctx.lineTo(gx + tw / 2, gy);
  ctx.closePath();
  ctx.fillStyle = shade(base, 0.72);
  ctx.fill();

  // top
  drawDiamond(cx, cy, tw, th, shade(base, 1.08));

  // height glint
  if (depth > 20) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.22, depth / 260)})`;
    drawDiamond(cx, cy, tw * 0.72, th * 0.72, ctx.fillStyle);
  }
}

function isSpawn(tile, list) {
  const x = get(tile, "x");
  const y = get(tile, "y");

  return list.some(t => get(t, "x") === x && get(t, "y") === y);
}

function drawSpawnMarker(tile, color) {
  const x = get(tile, "x");
  const y = get(tile, "y");
  const h = get(tile, "height") || 1;
  const p = iso(x, y, h + 0.2);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 14;
  ctx.shadowColor = color;

  ctx.beginPath();
  ctx.arc(p.x, p.y, p.tileW * 0.16, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  ctx.fillStyle = "#050812";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const sorted = [...tiles].sort((a, b) => {
    const da = get(a, "x") + get(a, "y");
    const db = get(b, "x") + get(b, "y");
    return da - db;
  });

  for (const tile of sorted) {
    drawBlock(tile);
  }

  for (const tile of playerSpawns) {
    drawSpawnMarker(tile, "rgba(120,220,255,.95)");
  }

  for (const tile of enemySpawns) {
    drawSpawnMarker(tile, "rgba(255,90,90,.95)");
  }

  hud.textContent =
    `Simλ Terrain 3D — ${width}×${height}, ${tiles.length} tiles, ` +
    `${playerSpawns.length} player spawns, ${enemySpawns.length} enemy spawns`;
}

draw();
</script>
</body>
</html>
