<!DOCTYPE html>
<html>
<head>
  <title>Simλ Combat Simulation</title>
  <style>
    body { margin:0; background:#050713; color:#fff; font-family:monospace; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; background:#050713; }
    #hud {
      position:fixed;
      left:10px; top:10px; right:10px;
      background:rgba(0,0,0,.62);
      border:1px solid rgba(255,255,255,.18);
      padding:8px;
      font-size:12px;
      white-space:pre-wrap;
      z-index:10;
      max-height:24vh;
      overflow:auto;
    }
  </style>
</head>
<body>
<div id="hud">loading...</div>
<canvas id="view"></canvas>

<script type="module">
import { parse } from "./src/parser.js";
import { run } from "./src/vm.js";
import { compile } from "./src/compiler.js";

const hud = document.getElementById("hud");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playHitSound(power = 1) {
  if (!audioCtx) return;

  const now = audioCtx.currentTime;

  // Per-hit variation.
  const pitchJitter = 0.75 + Math.random() * 0.65;
  const dropJitter = 0.75 + Math.random() * 0.5;
  const filterJitter = 0.75 + Math.random() * 0.7;
  const durationJitter = 0.09 + Math.random() * 0.09;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = Math.random() > 0.5 ? "sawtooth" : "square";
  osc.frequency.setValueAtTime((120 + power * 18) * pitchJitter, now);
  osc.frequency.exponentialRampToValueAtTime(45 * dropJitter, now + durationJitter);

  filter.type = "lowpass";
  filter.frequency.setValueAtTime((700 + power * 70) * filterJitter, now);
  filter.frequency.exponentialRampToValueAtTime(120 + Math.random() * 120, now + durationJitter);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durationJitter + 0.04);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + durationJitter + 0.05);

  // Short noise burst for impact.
  const bufferSize = audioCtx.sampleRate * 0.08;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }

  const noise = audioCtx.createBufferSource();
  const noiseGain = audioCtx.createGain();
  const noiseFilter = audioCtx.createBiquadFilter();

  noise.buffer = buffer;
  noiseFilter.type = "bandpass";
  noiseFilter.frequency.setValueAtTime((500 + power * 55) * (0.8 + Math.random() * 0.8), now);
  noiseFilter.Q.setValueAtTime(0.9, now);

  noiseGain.gain.setValueAtTime(0.13, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);

  noise.start(now);
  noise.stop(now + 0.09);
}

function playDeathSound() {
  if (!audioCtx) return;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(45, now + 0.35);

  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.42);
}

function tokenize(code) {
  return code.replace(/;;.*$/gm,"")
    .replace(/\(/g," ( ")
    .replace(/\)/g," ) ")
    .match(/"[^"]*"|\S+/g);
}

function get(e,k,f){
  if(!Array.isArray(e)) return f;
  for(let i=0;i<e.length;i+=2)
    if(e[i]===k) return e[i+1];
  return f;
}

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);
addEventListener("pointerdown", ensureAudio, { once:true });
addEventListener("touchstart", ensureAudio, { once:true });

let bytecode;
let status = "loading";
let stepIndex = 0;
let lastEvents = [];
let lastAction = "boot";
let lastStepTime = 0;
let eventAnims = [];
let particles = [];
let shake = 0;

let state = [
  "round",1,
  "entities",[
    ["id",1,"team","player","hp",40,"tile",7,"attack",8,"move",4,"dead",0,"scale",1.35],
    ["id",2,"team","enemy","hp",10,"tile",10,"attack",3,"move",2,"dead",0],
    ["id",3,"team","enemy","hp",8,"tile",12,"attack",2,"move",2,"dead",0],
    ["id",4,"team","enemy","hp",12,"tile",14,"attack",4,"move",1,"dead",0]
  ]
];

const script = [
  ["move", 9],

  ["end", 0],
  ["end", 0],
  ["end", 0],

  ["attack", 2],
  ["attack", 2],

  ["end", 0],

  ["attack", 3],
  ["attack", 3],

  ["end", 0],
  ["end", 0],

  ["attack", 4],
  ["attack", 4]
];

async function init(){
  try {
    const code = await fetch("./examples/combat_loop_multi_enemy.sim").then(r => {
      if (!r.ok) throw new Error("fetch failed " + r.status);
      return r.text();
    });
    const ast = parse(tokenize(code));
    bytecode = compile(ast);
    status = "ongoing";
    requestAnimationFrame(frame);
  } catch (err) {
    hud.textContent = "INIT ERROR:\n" + (err.stack || err);
  }
}

function act(type, val){
  const result = run(bytecode,{
    state,
    actionType: type,
    actorId:1,
    targetId: type==="attack"?val:0,
    actionTile: type==="move"?val:0
  }).result;

  state = get(result,"state",state);
  lastEvents = (get(result,"events",[]) || []).filter(Array.isArray);
  status = get(result,"result","unknown");
  lastAction = type + ":" + val;

  for (const ev of lastEvents) {
    if (ev[0] === "attack") {
      playHitSound(ev[3] || 1);
      shake = Math.max(shake, 8 + (ev[3] || 1));
      eventAnims.push({ type:"attack", attacker:ev[1], target:ev[2], dmg:ev[3], t:0 });
      eventAnims.push({ type:"slash", attacker:ev[1], target:ev[2], dmg:ev[3], t:0 });
      eventAnims.push({ type:"damage", target:ev[2], dmg:ev[3], t:0 });
    }
    if (ev[0] === "move") {
      eventAnims.push({ type:"move", id:ev[1], from:ev[2], to:ev[3], t:0 });
    }
    if (ev[0] === "death") {
      playDeathSound();
      shake = Math.max(shake, 18);
      eventAnims.push({ type:"death", id:ev[1], t:0 });
      spawnDeathParticles(ev[1]);
    }
  }
}

function maybeStep(time){
  if(status !== "ongoing") return;
  if(stepIndex >= script.length) return;
  if(time - lastStepTime < 1100) return;

  const [type,val] = script[stepIndex++];
  act(type,val);
  lastStepTime = time;
}

function frame(time){
  maybeStep(time);

  for (const a of eventAnims) a.t += 0.045;
  eventAnims = eventAnims.filter(a => a.t < 1.4);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= 0.025;
  }
  particles = particles.filter(p => p.life > 0);
  shake *= 0.88;

  draw(time);
  requestAnimationFrame(frame);
}

function spawnDeathParticles(id) {
  const entities = get(state, "entities", []);
  const target = entities.find(e => get(e, "id") === id);
  if (!target) return;

  const TILE_SIZE = Math.min(42, Math.max(24, canvas.width / 17.5));
  const offsetX = canvas.width/2 - (16*TILE_SIZE)/2;
  const offsetY = canvas.height*0.48;
  const pos = entityPos(target, TILE_SIZE, offsetX, offsetY);

  for (let i = 0; i < 28; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 4;
    particles.push({
      x: pos.x,
      y: pos.y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd - 1.5,
      r: 2 + Math.random() * 4,
      life: 1,
      color: get(target, "team") === "player" ? "#4aa8ff" : "#ff5757"
    });
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSlashTrails(entities, TILE_SIZE, offsetX, offsetY) {
  for (const a of eventAnims) {
    if (a.type !== "slash") continue;

    const attacker = entities.find(e => get(e, "id") === a.attacker);
    const target = entities.find(e => get(e, "id") === a.target);
    if (!attacker || !target) continue;

    const pa = entityPos(attacker, TILE_SIZE, offsetX, offsetY);
    const pt = entityPos(target, TILE_SIZE, offsetX, offsetY);

    const k = Math.min(1, a.t / 0.35);
    const alpha = Math.max(0, 1 - k);

    const mx = pa.x + (pt.x - pa.x) * k;
    const my = pa.y + (pt.y - pa.y) * k;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = get(attacker, "team") === "player" ? "#ffe08a" : "#ff8a8a";
    ctx.lineWidth = 6;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 18;

    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y - 22);
    ctx.quadraticCurveTo(
      (pa.x + pt.x) / 2,
      (pa.y + pt.y) / 2 - 80,
      mx,
      my - 22
    );
    ctx.stroke();

    ctx.restore();
  }
}

function entityPos(e, TILE_SIZE, offsetX, offsetY) {
  const id = get(e,"id");
  const team = get(e,"team");
  let tile = get(e,"tile");

  for (const a of eventAnims) {
    if (a.type === "move" && a.id === id && a.t < 1) {
      const k = ease(a.t);
      tile = a.from + (a.to - a.from) * k;
    }
  }

  // Mobile vertical arena:
  // tile controls horizontal lane,
  // team controls vertical side.
  let x = offsetX + tile*TILE_SIZE + TILE_SIZE*0.35;
  let y = team==="player" ? offsetY + TILE_SIZE*2.2 : offsetY - TILE_SIZE*1.7;

  for (const a of eventAnims) {
    if (a.type === "attack" && a.attacker === id && a.t < 0.45) {
      const dir = team === "player" ? -1 : 1;
      y += dir * Math.sin(a.t * Math.PI / 0.45) * 34;
    }
    if (a.type === "attack" && a.target === id && a.t < 0.25) {
      x += Math.sin(a.t * 80) * 5;
      y += Math.sin(a.t * 95) * 4;
    }
  }

  return {x,y};
}

function ease(t) {
  t = Math.max(0, Math.min(1, t));
  return t*t*(3-2*t);
}

function drawFighter(e, pos, time) {
  const id = get(e,"id");
  const team = get(e,"team");
  const hp = get(e,"hp");
  const dead = get(e,"dead");
  const maxHp = team === "player" ? 40 : (id === 2 ? 10 : id === 3 ? 8 : 12);
  const scale = get(e, "scale", 1);

  const isPlayer = team === "player";
  const color = isPlayer ? "#4aa8ff" : "#ff5757";
  const dark = isPlayer ? "#1f5f9f" : "#8f2222";

  const bodyScale = isPlayer ? 1.55 : 1.0;
  const weaponScale = isPlayer ? 1.75 : 1.0;
  const bodyWidth = isPlayer ? 11 : 8;
  const limbWidth = isPlayer ? 8 : 6;
  const headSize = isPlayer ? 15 : 11;

  const hit = eventAnims.some(a => a.type === "attack" && a.target === id && a.t < 0.28);
  const death = dead || eventAnims.some(a => a.type === "death" && a.id === id);
  const attack = eventAnims.some(a => a.type === "attack" && a.attacker === id && a.t < 0.45);

  ctx.save();
  ctx.translate(pos.x, pos.y);

  if (death) {
    ctx.rotate(1.15);
    ctx.globalAlpha = 0.55;
  }

  ctx.scale(bodyScale, bodyScale);

  ctx.scale(scale, scale);

  if (hit) {
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 22;
  }

  const bob = Math.sin(time * 0.006 + id) * 2;
  const armSwing = attack ? 1 : Math.sin(time * 0.008 + id) * 0.25;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // shadow
  ctx.globalAlpha *= 0.45;
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(0, 35, 24, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = death ? 0.55 : 1;

  // legs
  ctx.strokeStyle = dark;
  ctx.lineWidth = limbWidth;
  ctx.beginPath();
  ctx.moveTo(-7, 17+bob);
  ctx.lineTo(-15, 34+bob);
  ctx.moveTo(7, 17+bob);
  ctx.lineTo(15, 34+bob);
  ctx.stroke();

  // body
  ctx.strokeStyle = color;
  ctx.lineWidth = bodyWidth;
  ctx.beginPath();
  ctx.moveTo(0, -8+bob);
  ctx.lineTo(0, 18+bob);
  ctx.stroke();

  // arms
  ctx.strokeStyle = hit ? "#fff" : color;
  ctx.lineWidth = limbWidth;
  ctx.beginPath();
  if (isPlayer) {
    ctx.moveTo(0, 0+bob);
    ctx.lineTo(-15, 12+bob);
    ctx.moveTo(0, 0+bob);
    ctx.lineTo(18 + armSwing*18, -2+bob);
  } else {
    ctx.moveTo(0, 0+bob);
    ctx.lineTo(15, 12+bob);
    ctx.moveTo(0, 0+bob);
    ctx.lineTo(-18 - armSwing*18, -2+bob);
  }
  ctx.stroke();

  // weapon
  ctx.strokeStyle = isPlayer ? "#dff6ff" : "#ffd0d0";
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (isPlayer) {
    ctx.moveTo(18 + armSwing*18, -2+bob);
    ctx.lineTo((34 + armSwing*22) * weaponScale, (-18+bob) * weaponScale);
  } else {
    ctx.moveTo(-18 - armSwing*18, -2+bob);
    ctx.lineTo(-34 - armSwing*22, -18+bob);
  }
  ctx.stroke();

  // head
  ctx.fillStyle = hit ? "#fff" : color;
  ctx.beginPath();
  ctx.arc(0, -22+bob, headSize, 0, Math.PI*2);
  ctx.fill();

  // hp bar
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#1b2436";
  ctx.fillRect(-24, -52, 48, 6);
  ctx.fillStyle = hp <= 0 ? "#555" : "#59ff8a";
  ctx.fillRect(-24, -52, 48 * Math.max(0, hp / maxHp), 6);

  ctx.fillStyle = "#fff";
  ctx.font = "12px monospace";
  ctx.fillText("id " + id, -14, -60);
  ctx.fillText(String(hp), -7, -40);

  ctx.restore();
}

function drawDamageNumbers(entities, TILE_SIZE, offsetX, offsetY) {
  for (const a of eventAnims) {
    if (a.type !== "damage") continue;
    const target = entities.find(e => get(e,"id") === a.target);
    if (!target) continue;

    const pos = entityPos(target, TILE_SIZE, offsetX, offsetY);
    const rise = a.t * 44;

    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - a.t);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 20px monospace";
    ctx.fillText("-" + a.dmg, pos.x - 10, pos.y - 70 - rise);
    ctx.restore();
  }
}

function draw(time){
  ctx.save();
  const sx = (Math.random() * 2 - 1) * shake;
  const sy = (Math.random() * 2 - 1) * shake;
  ctx.translate(sx, sy);

  ctx.fillStyle="#050713";
  ctx.fillRect(-40,-40,canvas.width+80,canvas.height+80);

  const entities = get(state,"entities",[]);
  const TILE_SIZE = Math.min(42, Math.max(24, canvas.width / 17.5));
  const offsetX = canvas.width/2 - (16*TILE_SIZE)/2;
  const offsetY = canvas.height*0.48;

  // arena glow
  const g = ctx.createRadialGradient(canvas.width/2, offsetY, 10, canvas.width/2, offsetY, canvas.width*0.75);
  g.addColorStop(0, "rgba(40,80,140,.25)");
  g.addColorStop(1, "rgba(5,7,19,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // mobile lane grid
  for(let i=0;i<16;i++){
    const x = offsetX + i*TILE_SIZE;
    const y = offsetY;

    ctx.fillStyle = i % 2 === 0 ? "rgba(30,50,82,.42)" : "rgba(22,38,64,.34)";
    ctx.fillRect(x, y, TILE_SIZE-3, TILE_SIZE*1.6);

    ctx.strokeStyle="#2e4568";
    ctx.lineWidth=1;
    ctx.strokeRect(x,y,TILE_SIZE-3,TILE_SIZE*1.6);

    ctx.fillStyle="#8ca0bd";
    ctx.font = "11px monospace";
    ctx.fillText(i,x+6,y+TILE_SIZE*1.6+12);
  }

  // front/back lanes
  ctx.strokeStyle = "rgba(74,168,255,.25)";
  ctx.beginPath();
  ctx.moveTo(offsetX, offsetY + TILE_SIZE*2.2);
  ctx.lineTo(offsetX + 16*TILE_SIZE, offsetY + TILE_SIZE*2.2);
  ctx.stroke();

  ctx.strokeStyle = "rgba(255,87,87,.25)";
  ctx.beginPath();
  ctx.moveTo(offsetX, offsetY - TILE_SIZE*1.7);
  ctx.lineTo(offsetX + 16*TILE_SIZE, offsetY - TILE_SIZE*1.7);
  ctx.stroke();

  // event lines
  for (const ev of lastEvents) {
    if (!Array.isArray(ev) || ev[0] !== "attack") continue;

    const a = entities.find(e => get(e,"id") === ev[1]);
    const b = entities.find(e => get(e,"id") === ev[2]);
    if (!a || !b) continue;

    const pa = entityPos(a, TILE_SIZE, offsetX, offsetY);
    const pb = entityPos(b, TILE_SIZE, offsetX, offsetY);

    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y-20);
    ctx.lineTo(pb.x, pb.y-20);
    ctx.stroke();
  }

  drawSlashTrails(entities, TILE_SIZE, offsetX, offsetY);

  for(const e of entities){
    const pos = entityPos(e, TILE_SIZE, offsetX, offsetY);
    drawFighter(e, pos, time);
  }

  drawDamageNumbers(entities, TILE_SIZE, offsetX, offsetY);
  drawParticles();

  ctx.restore();

  hud.textContent =
    "Simλ visual combat simulation" +
    "\nstep: " + stepIndex + "/" + script.length +
    "\naction: " + lastAction +
    "\nstatus: " + status +
    "\nevents: " + JSON.stringify(lastEvents);
}

init();
</script>
</body>
</html>
