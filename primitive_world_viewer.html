<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Primitive World Viewer</title>

<style>

body {
  margin: 0;
  overflow: hidden;
  background: #202530;
  touch-action: none;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  font-family: sans-serif;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 8px;
  z-index: 20;
}

.joystick {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  bottom: 24px;
  z-index: 20;
  touch-action: none;
}

#moveZone {
  left: 24px;
}

#lookZone {
  right: 24px;
}

.knob {
  position: absolute;
  width: 128px;
  height: 128px;
  left: 76px;
  top: 76px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.3);
}

</style>
</head>

<body>

<div id="hud">
Simla Primitive Sandbox
</div>

<div id="moveZone" class="joystick">
  <div id="moveKnob" class="knob"></div>
</div>

<div id="lookZone" class="joystick">
  <div id="lookKnob" class="knob"></div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202530);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

camera.position.set(0, 45, 140);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(10,20,10);
scene.add(sun);

scene.add(new THREE.GridHelper(200,200));

function prop(obj, key, fallback=null) {

  if (Array.isArray(obj)) {

    for (let i = 0; i < obj.length; i += 2) {

      if (obj[i] === key) {
        return obj[i + 1];
      }
    }

    return fallback;
  }

  if (obj && typeof obj === "object") {
    return obj[key] ?? fallback;
  }

  return fallback;
}

function isPairList(value) {

  if (!Array.isArray(value)) return false;
  if (value.length % 2 !== 0) return false;

  for (let i = 0; i < value.length; i += 2) {

    if (typeof value[i] !== "string") {
      return false;
    }
  }

  return true;
}

function isSimlaObject(value) {

  return (
    !!value
    && typeof value === "object"
    && value.__simlaKind === "object"
    && value.props
  );
}

function isSimlaNode(value) {

  return (
    !!value
    && typeof value === "object"
    && value.__simlaKind === "node"
  );
}

function pairsToObj(arr) {

  const obj = {};

  for (let i = 0; i < arr.length - 1; i += 2) {

    if (typeof arr[i] === "string") {
      obj[arr[i]] = arr[i + 1];
    }
  }

  return obj;
}

function objectProps(value) {

  if (isSimlaObject(value)) {
    return value.props;
  }

  if (isPairList(value)) {
    return pairsToObj(value);
  }

  if (
    value
    && typeof value === "object"
    && !Array.isArray(value)
  ) {
    return value;
  }

  return {};
}

function num(value, fallback=0) {

  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function extractNodeProps(node) {

  if (isSimlaNode(node)) {
    return objectProps(node.props);
  }

  if (isSimlaObject(node)) {
    return objectProps(node.props);
  }

  if (isPairList(node)) {
    return pairsToObj(node);
  }

  if (
    node
    && typeof node === "object"
    && !Array.isArray(node)
  ) {
    return node;
  }

  return {};
}

function extractNodeChildren(node, props) {

  if (isSimlaNode(node)) {

    return Array.isArray(node.children)
      ? node.children
      : [];
  }

  return Array.isArray(props.children)
    ? props.children
    : [];
}

function readNodeTransform(props) {

  const tf = objectProps(prop(props, "transform", null));

  const uniformScale =
    num(
      prop(tf, "scale", prop(props, "scale", 1)),
      1
    );

  return {

    x: num(prop(tf, "x", prop(props, "x", 0))),
    y: num(prop(tf, "y", prop(props, "y", 0))),
    z: num(prop(tf, "z", prop(props, "z", 0))),

    rotX: num(
      prop(tf, "rotX", prop(tf, "rx", prop(props, "rotX", 0)))
    ),

    rotY: num(
      prop(tf, "rotY", prop(tf, "ry", prop(props, "rotY", 0)))
    ),

    rotZ: num(
      prop(tf, "rotZ", prop(tf, "rz", prop(props, "rotZ", 0)))
    ),

    scaleX: num(
      prop(
        tf,
        "scaleX",
        prop(tf, "sx", prop(props, "scaleX", uniformScale))
      ),
      uniformScale
    ),

    scaleY: num(
      prop(
        tf,
        "scaleY",
        prop(tf, "sy", prop(props, "scaleY", uniformScale))
      ),
      uniformScale
    ),

    scaleZ: num(
      prop(
        tf,
        "scaleZ",
        prop(tf, "sz", prop(props, "scaleZ", uniformScale))
      ),
      uniformScale
    )
  };
}

function buildLocalMatrix(tf) {

  const position =
    new THREE.Vector3(tf.x, tf.y, tf.z);

  const rotation =
    new THREE.Euler(tf.rotX, tf.rotY, tf.rotZ, "XYZ");

  const quaternion =
    new THREE.Quaternion().setFromEuler(rotation);

  const scale =
    new THREE.Vector3(tf.scaleX, tf.scaleY, tf.scaleZ);

  return new THREE.Matrix4().compose(
    position,
    quaternion,
    scale
  );
}

function normalizeSceneItems(payload) {

  const rootValue =
    payload && payload.result
      ? payload.result
      : payload;

  const out = [];

  function addWorldTransformedPrimitive(baseProps, worldMatrix) {

    const worldPos = new THREE.Vector3();
    const worldQuat = new THREE.Quaternion();
    const worldScale = new THREE.Vector3();

    worldMatrix.decompose(
      worldPos,
      worldQuat,
      worldScale
    );

    const worldRot =
      new THREE.Euler().setFromQuaternion(
        worldQuat,
        "XYZ"
      );

    out.push({
      ...baseProps,
      x: worldPos.x,
      y: worldPos.y,
      z: worldPos.z,
      rotX: worldRot.x,
      rotY: worldRot.y,
      rotZ: worldRot.z,
      worldScaleX: worldScale.x,
      worldScaleY: worldScale.y,
      worldScaleZ: worldScale.z
    });
  }

  function walkNodeLike(node, parentWorldMatrix) {

    const props = extractNodeProps(node);
    const localTf = readNodeTransform(props);
    const localMatrix = buildLocalMatrix(localTf);

    const worldMatrix =
      new THREE.Matrix4().multiplyMatrices(
        parentWorldMatrix,
        localMatrix
      );

    if (props.type) {
      addWorldTransformedPrimitive(props, worldMatrix);
    }

    const children =
      extractNodeChildren(node, props);

    for (const child of children) {
      walkNodeLike(child, worldMatrix);
    }
  }

  const identity = new THREE.Matrix4();

  if (Array.isArray(rootValue)) {

    for (const item of rootValue) {

      walkNodeLike(item, identity);
    }
  }

  else {
    walkNodeLike(rootValue, identity);
  }

  return out;
}

function makeMaterial(o) {

  return new THREE.MeshStandardMaterial({

    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });
}

function addCube(o) {

  const geo = new THREE.BoxGeometry(
    prop(o, "sx", prop(o, "size", 1)),
    prop(o, "sy", prop(o, "size", 1)),
    prop(o, "sz", prop(o, "size", 1))
  );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
}

function addSphere(o) {

  const geo =
    new THREE.SphereGeometry(
      prop(o, "radius", 1),
      32,
      16
    );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
}

function addCylinder(o) {

  const geo =
    new THREE.CylinderGeometry(
      prop(o, "radiusTop", 1),
      prop(o, "radiusBottom", 1),
      prop(o, "height", 2),
      24
    );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
}

function addWedge(o) {

  const width = prop(o, "width", prop(o, "sx", 1));
  const height = prop(o, "height", prop(o, "sy", 1));
  const depth = prop(o, "depth", prop(o, "sz", 1));

  const group = new THREE.Group();

  const backBox = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.01, depth),
    makeMaterial(o)
  );
  backBox.position.y = -height / 2;
  group.add(backBox);

  const frontBox = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    makeMaterial(o)
  );
  frontBox.position.z = depth / 2;
  group.add(frontBox);

  const sideLeft = new THREE.Mesh(
    new THREE.BoxGeometry(0.01, height / 2, depth),
    makeMaterial(o)
  );
  sideLeft.position.x = -width / 2;
  sideLeft.position.y = height / 4;
  group.add(sideLeft);

  const sideRight = new THREE.Mesh(
    new THREE.BoxGeometry(0.01, height / 2, depth),
    makeMaterial(o)
  );
  sideRight.position.x = width / 2;
  sideRight.position.y = height / 4;
  group.add(sideRight);

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  group.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(group);
}

function addStair(o) {

  const width = prop(o, "width", prop(o, "sx", 1));
  const stepCount = prop(o, "stepCount", 3);
  const stepHeight = prop(o, "stepHeight", 0.3);
  const stepDepth = prop(o, "stepDepth", 0.4);

  const group = new THREE.Group();

  for (let i = 0; i < stepCount; i++) {

    const step = new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        stepHeight,
        stepDepth
      ),
      makeMaterial(o)
    );

    step.position.y = stepHeight / 2 + i * stepHeight;
    step.position.z = i * stepDepth;

    group.add(step);
  }

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  group.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(group);
}

async function loadScene() {

  const params =
    new URLSearchParams(location.search);

  const sceneFile =
    params.get("file")
    || "examples/building/primitive_world.sim";

  const res = await fetch(
    "/api/scene?file="
    + encodeURIComponent(sceneFile)
  );

  const raw = await res.json();

  console.log("RAW", raw);

  const objects =
    normalizeSceneItems(raw);

  console.log(
    "NORMALIZED OBJECTS",
    objects
  );

  for (const o of objects) {

    const type =
      prop(o, "type");

    console.log(
      "DRAW",
      type,
      o
    );

    if (type === "cube") {
      addCube(o);
    }

    else if (type === "sphere") {
      addSphere(o);
    }

    else if (type === "cylinder") {
      addCylinder(o);
    }

    else if (type === "wedge") {
      addWedge(o);
    }

    else if (type === "stair") {
      addStair(o);
    }
  }
}

await loadScene();

const moveInput = { x:0, y:0 };
const lookInput = { x:0, y:0 };
const keyState = {
  w: false,
  a: false,
  s: false,
  d: false
};

const hud = document.getElementById("hud");

hud.innerHTML = [
  "Simla Primitive Sandbox",
  "Click to lock mouse",
  "WASD to move"
].join("<br>");

function setupJoystick(zoneId, knobId, state) {

  const zone =
    document.getElementById(zoneId);

  const knob =
    document.getElementById(knobId);

  let active = false;

  zone.addEventListener("touchstart", () => {
    active = true;
  });

  zone.addEventListener("touchend", () => {

    active = false;

    state.x = 0;
    state.y = 0;

    knob.style.left = "76px";
    knob.style.top = "76px";
  });

  zone.addEventListener("touchmove", e => {

    e.preventDefault();

    if (!active) return;

    const rect =
      zone.getBoundingClientRect();

    const touch = e.touches[0];

    const x =
      touch.clientX
      - rect.left
      - 70;

    const y =
      touch.clientY
      - rect.top
      - 70;

    const dist =
      Math.min(
        90,
        Math.hypot(x,y)
      );

    const ang =
      Math.atan2(y,x);

    const dx =
      Math.cos(ang) * dist;

    const dy =
      Math.sin(ang) * dist;

    knob.style.left =
      (76 + dx) + "px";

    knob.style.top =
      (76 + dy) + "px";

    state.x = dx / 90;
    state.y = dy / 90;
  });
}

setupJoystick(
  "moveZone",
  "moveKnob",
  moveInput
);

setupJoystick(
  "lookZone",
  "lookKnob",
  lookInput
);

renderer.domElement.addEventListener("click", () => {

  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener("pointerlockchange", () => {

  if (document.pointerLockElement === renderer.domElement) {

    hud.innerHTML = [
      "Simla Primitive Sandbox",
      "Mouse look active (Esc to unlock)",
      "WASD to move"
    ].join("<br>");
  }

  else {

    hud.innerHTML = [
      "Simla Primitive Sandbox",
      "Click to lock mouse",
      "WASD to move"
    ].join("<br>");
  }
});

document.addEventListener("mousemove", e => {

  if (document.pointerLockElement !== renderer.domElement) {
    return;
  }

  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0018;
});

window.addEventListener("keydown", e => {

  const key = e.key.toLowerCase();

  if (key === "w") keyState.w = true;
  if (key === "a") keyState.a = true;
  if (key === "s") keyState.s = true;
  if (key === "d") keyState.d = true;
});

window.addEventListener("keyup", e => {

  const key = e.key.toLowerCase();

  if (key === "w") keyState.w = false;
  if (key === "a") keyState.a = false;
  if (key === "s") keyState.s = false;
  if (key === "d") keyState.d = false;
});

let yaw = 0;
let pitch = -0.3;

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth
    / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

function animate() {

  requestAnimationFrame(animate);

  yaw -= lookInput.x * 0.03;
  pitch -= lookInput.y * 0.02;

  pitch = Math.max(
    -1.5,
    Math.min(1.5, pitch)
  );

  const forward =
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    ).normalize();

  const right =
    new THREE.Vector3(
      forward.z,
      0,
      -forward.x
    ).normalize();

  const moveSpeed = 0.15;

  let keyX = 0;
  let keyY = 0;

  if (keyState.w) keyY -= 1;
  if (keyState.s) keyY += 1;
  if (keyState.a) keyX -= 1;
  if (keyState.d) keyX += 1;

  const totalX =
    Math.max(-1, Math.min(1, moveInput.x + keyX));

  const totalY =
    Math.max(-1, Math.min(1, moveInput.y + keyY));

  const moveForward =
    -totalY * moveSpeed;

  const moveRight =
    -totalX * moveSpeed;

  camera.position.x +=
    forward.x * moveForward +
    right.x * moveRight;

  camera.position.z +=
    forward.z * moveForward +
    right.z * moveRight;

  camera.lookAt(
    camera.position.x + Math.sin(yaw),
    camera.position.y + pitch,
    camera.position.z + Math.cos(yaw)
  );

  renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
