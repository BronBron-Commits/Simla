// Procedural asphalt texture
function generateAsphaltTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  
  // Base dark asphalt color
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Add noise and texture
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    // Random dark noise
    const noise = (Math.random() - 0.5) * 40;
    data[i] += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
    
    // Occasional lighter spots (gravel/aggregate)
    if (Math.random() < 0.15) {
      const brightness = Math.random() * 60 + 40;
      data[i] += brightness;
      data[i + 1] += brightness;
      data[i + 2] += brightness;
    }
    
    // Occasional dark streaks
    if (Math.random() < 0.05) {
      const darkness = Math.random() * 30;
      data[i] -= darkness;
      data[i + 1] -= darkness;
      data[i + 2] -= darkness;
    }
  }
  
  ctx.putImageData(imageData, 0, 0);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearFilter;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 4); // Tile the texture
  return texture;
}

// Sun and Moon objects

// Day-night cycle time (0 to 1, where 0=midnight, 0.5=noon)
let cycleTime = 0.3; // Start at morning

function updateSkyForTime(time) {
  // time goes 0 to 1 for full day cycle
  // 0 = midnight (dark), 0.25 = sunrise, 0.5 = noon, 0.75 = sunset, 1 = back to midnight
  
  let r, g, b;
  
  if (time < 0.25) {
    // Night to sunrise (dark blue to orange)
    const t = time / 0.25;
    r = Math.floor(10 + (200 - 10) * t);
    g = Math.floor(10 + (150 - 10) * t);
    b = Math.floor(20 + (80 - 20) * t);
  } else if (time < 0.5) {
    // Sunrise to noon (orange to blue)
    const t = (time - 0.25) / 0.25;
    r = Math.floor(200 + (0 - 200) * t);
    g = Math.floor(150 + (102 - 150) * t);
    b = Math.floor(80 + (204 - 80) * t);
  } else if (time < 0.75) {
    // Noon to sunset (blue to orange)
    const t = (time - 0.5) / 0.25;
    r = Math.floor(0 + (180 - 0) * t);
    g = Math.floor(102 + (100 - 102) * t);
    b = Math.floor(204 + (50 - 204) * t);
  } else {
    // Sunset to night (orange to dark)
    const t = (time - 0.75) / 0.25;
    r = Math.floor(180 + (10 - 180) * t);
    g = Math.floor(100 + (10 - 100) * t);
    b = Math.floor(50 + (20 - 50) * t);
  }
  
  return { r: Math.max(0, Math.min(255, r)), g: Math.max(0, Math.min(255, g)), b: Math.max(0, Math.min(255, b)) };
}

function generateSkyTextureForTime(time) {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  
  const skyColor = updateSkyForTime(time);
  
  // Create equirectangular sky texture
  const imageData = ctx.createImageData(canvas.width, canvas.height);
  const data = imageData.data;
  
  for (let y = 0; y < canvas.height; y++) {
    const lat = (y / canvas.height) * Math.PI;
    const v = lat / Math.PI;
    
    // Gradient from sky color at top to lighter at horizon
    let r = Math.floor(skyColor.r * (1 - v * 0.3));
    let g = Math.floor(skyColor.g * (1 - v * 0.3));
    let b = Math.floor(skyColor.b + (255 - skyColor.b) * v * 0.3);
    
    for (let x = 0; x < canvas.width; x++) {
      const idx = (y * canvas.width + x) * 4;
      
      // Add clouds with better distribution
      const cloudDensity = Math.sin(x * 0.01 + y * 0.005) * 0.5 + 0.5;
      const cloudNoise = Math.sin(x * 0.002) * Math.cos(y * 0.003) * 0.3;
      const cloudAmount = cloudDensity * cloudNoise;
      
      if (v > 0.15 && v < 0.75 && cloudAmount > 0.2) {
        const cloudOpacity = Math.max(0, (cloudAmount - 0.2) * 0.15);
        data[idx] = Math.min(255, r + (255 - r) * cloudOpacity);
        data[idx + 1] = Math.min(255, g + (255 - g) * cloudOpacity);
        data[idx + 2] = Math.min(255, b + (255 - b) * cloudOpacity);
      } else {
        data[idx] = r;
        data[idx + 1] = g;
        data[idx + 2] = b;
      }
      
      data[idx + 3] = 255;
    }
  }
  
  ctx.putImageData(imageData, 0, 0);
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearFilter;
  return texture;
}

const skyboxGeometry = new THREE.SphereGeometry(1500, 32, 32);
const skyboxMaterial = new THREE.MeshBasicMaterial({ 
  map: generateSkyTextureForTime(0.3), 
  side: THREE.BackSide 
});
const skybox = new THREE.Mesh(skyboxGeometry, skyboxMaterial);
scene.add(skybox);

// 3D floating clouds
const clouds = [];

function createCloud(x, y, z, scale) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  
  const cloudMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xcccccc,
    roughness: 0.8,
    metalness: 0,
    transparent: true,
    opacity: 0.7,
  });
  
  // Create cloud from overlapping spheres
  for (let i = 0; i < 6; i++) {
    const sphereGeo = new THREE.SphereGeometry(scale * (0.5 + Math.random() * 0.5), 16, 16);
    const sphere = new THREE.Mesh(sphereGeo, cloudMaterial);
    
    const angle = (i / 6) * Math.PI * 2;
    sphere.position.x = Math.cos(angle) * scale * 0.6;
    sphere.position.y = Math.sin(angle * 0.5) * scale * 0.4;
    sphere.position.z = Math.sin(angle) * scale * 0.6;
    
    group.add(sphere);
  }
  
  scene.add(group);
  
  return {
    mesh: group,
    speed: 0.05 + Math.random() * 0.05,
    direction: Math.random() * Math.PI * 2,
    yVariation: (Math.random() - 0.5) * 0.02
  };
}

// Create several clouds at different heights
for (let i = 0; i < 6; i++) {
  const x = (Math.random() - 0.5) * 800;
  const y = 200 + Math.random() * 400;
  const z = (Math.random() - 0.5) * 800;
  const scale = 30 + Math.random() * 50;
  clouds.push(createCloud(x, y, z, scale));
}

function prop(obj, key, fallback=null) {

  if (Array.isArray(obj)) {

    for (let i = 0; i < obj.length; i += 2) {

      if (obj[i] === key) {
        return obj[i + 1];
      }
    }

    return fallback;
  }

  if (obj && typeof obj === "object") {
    return obj[key] ?? fallback;
  }

  return fallback;
}

function isPairList(value) {

  if (!Array.isArray(value)) return false;
  if (value.length % 2 !== 0) return false;

  for (let i = 0; i < value.length; i += 2) {

    if (typeof value[i] !== "string") {
      return false;
    }
  }

  return true;
}

function isSimlaObject(value) {

  return (
    !!value
    && typeof value === "object"
    && value.__simlaKind === "object"
    && value.props
  );
}

function isSimlaNode(value) {

  return (
    !!value
    && typeof value === "object"
    && value.__simlaKind === "node"
  );
}

function pairsToObj(arr) {

  const obj = {};

  for (let i = 0; i < arr.length - 1; i += 2) {

    if (typeof arr[i] === "string") {
      obj[arr[i]] = arr[i + 1];
    }
  }

  return obj;
}

function objectProps(value) {

  if (isSimlaObject(value)) {
    return value.props;
  }

  if (isPairList(value)) {
    return pairsToObj(value);
  }

  if (
    value
    && typeof value === "object"
    && !Array.isArray(value)
  ) {
    return value;
  }

  return {};
}

function num(value, fallback=0) {

  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function extractNodeProps(node) {

  if (isSimlaNode(node)) {
    return objectProps(node.props);
  }

  if (isSimlaObject(node)) {
    return objectProps(node.props);
  }

  if (isPairList(node)) {
    return pairsToObj(node);
  }

  if (
    node
    && typeof node === "object"
    && !Array.isArray(node)
  ) {
    return node;
  }

  return {};
}

function extractNodeChildren(node, props) {

  if (isSimlaNode(node)) {

    return Array.isArray(node.children)
      ? node.children
      : [];
  }

  return Array.isArray(props.children)
    ? props.children
    : [];
}

function readNodeTransform(props) {

  const tf = objectProps(prop(props, "transform", null));

  const uniformScale =
    num(
      prop(tf, "scale", prop(props, "scale", 1)),
      1
    );

  return {

    x: num(prop(tf, "x", prop(props, "x", 0))),
    y: num(prop(tf, "y", prop(props, "y", 0))),
    z: num(prop(tf, "z", prop(props, "z", 0))),

    rotX: num(
      prop(tf, "rotX", prop(tf, "rx", prop(props, "rotX", 0)))
    ),

    rotY: num(
      prop(tf, "rotY", prop(tf, "ry", prop(props, "rotY", 0)))
    ),

    rotZ: num(
      prop(tf, "rotZ", prop(tf, "rz", prop(props, "rotZ", 0)))
    ),

    scaleX: num(
      prop(
        tf,
        "scaleX",
        prop(tf, "sx", prop(props, "scaleX", uniformScale))
      ),
      uniformScale
    ),

    scaleY: num(
      prop(
        tf,
        "scaleY",
        prop(tf, "sy", prop(props, "scaleY", uniformScale))
      ),
      uniformScale
    ),

    scaleZ: num(
      prop(
        tf,
        "scaleZ",
        prop(tf, "sz", prop(props, "scaleZ", uniformScale))
      ),
      uniformScale
    )
  };
}

function buildLocalMatrix(tf) {

  const position =
    new THREE.Vector3(tf.x, tf.y, tf.z);

  const rotation =
    new THREE.Euler(tf.rotX, tf.rotY, tf.rotZ, "XYZ");

  const quaternion =
    new THREE.Quaternion().setFromEuler(rotation);

  const scale =
    new THREE.Vector3(tf.scaleX, tf.scaleY, tf.scaleZ);

  return new THREE.Matrix4().compose(
    position,
    quaternion,
    scale
  );
}

function normalizeSceneItems(payload) {

  const rootValue =
    payload && payload.result
      ? payload.result
      : payload;

  const out = [];

  function addWorldTransformedPrimitive(baseProps, worldMatrix) {

    const worldPos = new THREE.Vector3();
    const worldQuat = new THREE.Quaternion();
    const worldScale = new THREE.Vector3();

    worldMatrix.decompose(
      worldPos,
      worldQuat,
      worldScale
    );

    const worldRot =
      new THREE.Euler().setFromQuaternion(
        worldQuat,
        "XYZ"
      );

    out.push({
      ...baseProps,
      x: worldPos.x,
      y: worldPos.y,
      z: worldPos.z,
      rotX: worldRot.x,
      rotY: worldRot.y,
      rotZ: worldRot.z,
      worldScaleX: worldScale.x,
      worldScaleY: worldScale.y,
      worldScaleZ: worldScale.z
    });
  }

  function walkNodeLike(node, parentWorldMatrix) {

    const props = extractNodeProps(node);
    const localTf = readNodeTransform(props);
    const localMatrix = buildLocalMatrix(localTf);

    const worldMatrix =
      new THREE.Matrix4().multiplyMatrices(
        parentWorldMatrix,
        localMatrix
      );

    if (props.type) {
      addWorldTransformedPrimitive(props, worldMatrix);
    }

    const children =
      extractNodeChildren(node, props);

    for (const child of children) {
      walkNodeLike(child, worldMatrix);
    }
  }

  const identity = new THREE.Matrix4();

  if (Array.isArray(rootValue)) {

    for (const item of rootValue) {

      walkNodeLike(item, identity);
    }
  }

  else {
    walkNodeLike(rootValue, identity);
  }

  return out;
}

function generateFacadeTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  
  const ctx = canvas.getContext("2d");
  
  // Base color (concrete/brick)
  ctx.fillStyle = "#8B8680";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Add subtle noise
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 20;
    data[i] += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
  }
  ctx.putImageData(imageData, 0, 0);
  
  // Window grid
  const windowSize = 16;
  const gap = 4;
  
  for (let row = 0; row < 256 / (windowSize + gap); row++) {
    for (let col = 0; col < 256 / (windowSize + gap); col++) {
      const x = col * (windowSize + gap) + 2;
      const y = row * (windowSize + gap) + 2;
      
      // Random window light (80% chance lit)
      const isLit = Math.random() < 0.8;
      ctx.fillStyle = isLit ? "#FFE5B4" : "#1a1a1a";
      ctx.fillRect(x, y, windowSize - 2, windowSize - 2);
      
      // Window frame (dark)
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, windowSize - 2, windowSize - 2);
      
      // Vertical mullion
      ctx.strokeRect(x + (windowSize - 2) * 0.5, y, 0.5, windowSize - 2);
    }
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// Procedural brick texture
function generateBrickTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext("2d");
  
  const brickWidth = 32;
  const brickHeight = 16;
  const mortarThickness = 1;
  
  for (let row = 0; row < canvas.height; row += brickHeight + mortarThickness) {
    // Offset every other row
    const offset = (Math.floor(row / (brickHeight + mortarThickness)) % 2) * (brickWidth / 2);
    
    for (let col = -brickWidth; col < canvas.width + brickWidth; col += brickWidth + mortarThickness) {
      const x = col + offset;
      const y = row;
      
      // Brick base color with variation
      const brickBase = 190 + Math.floor(Math.random() * 40);
      const brickGreen = 80 + Math.floor(Math.random() * 30);
      const brickBlue = 60 + Math.floor(Math.random() * 30);
      
      ctx.fillStyle = `rgb(${brickBase}, ${brickGreen}, ${brickBlue})`;
      ctx.fillRect(x, y, brickWidth, brickHeight);
      
      // Add subtle texture variation
      const imageData = ctx.getImageData(x, y, brickWidth, brickHeight);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 30;
        data[i] = Math.max(0, Math.min(255, data[i] + noise));
        data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise * 0.5));
        data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise * 0.3));
      }
      ctx.putImageData(imageData, x, y);
    }
  }
  
  // Draw mortar lines
  ctx.strokeStyle = "#c4a57b";
  ctx.lineWidth = mortarThickness;
  
  // Horizontal mortar
  for (let row = brickHeight; row < canvas.height; row += brickHeight + mortarThickness) {
    ctx.beginPath();
    ctx.moveTo(0, row);
    ctx.lineTo(canvas.width, row);
    ctx.stroke();
  }
  
  // Vertical mortar
  for (let row = 0; row < canvas.height; row += brickHeight + mortarThickness) {
    const offset = (Math.floor(row / (brickHeight + mortarThickness)) % 2) * (brickWidth / 2);
    for (let col = brickWidth + offset; col < canvas.width + brickWidth; col += brickWidth + mortarThickness) {
      ctx.beginPath();
      ctx.moveTo(col, row);
      ctx.lineTo(col, row + brickHeight);
      ctx.stroke();
    }
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearFilter;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2, 2);
  return texture;
}

function makeMaterial(o) {

  const baseConfig = {
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    ),
    roughness: prop(o, "roughness", 0.8),
    metalness: prop(o, "metallic", 0),
  };

  const emissiveValue = prop(o, "emissive", null);
  if (emissiveValue !== null) {
    if (typeof emissiveValue === "string") {
      baseConfig.emissive = new THREE.Color(emissiveValue);
    } else {
      const em = emissiveValue;
      baseConfig.emissive = new THREE.Color(em / 255 || 0, em / 255 || 0, em / 255 || 0);
    }
  }

  // Detect ground/plaza (flat, large surface)
  const sx = prop(o, "sx", prop(o, "size", 1));
  const sy = prop(o, "sy", prop(o, "size", 1));
  const sz = prop(o, "sz", prop(o, "size", 1));
  const isGround = sy < 2 && sx > 20 && sz > 20;
  
  if (isGround) {
    const groundConfig = { ...baseConfig, map: generateAsphaltTexture() };
    return new THREE.MeshStandardMaterial(groundConfig);
  }

  // Apply building facade texture to tall structures
  const isTall = sy > 5 || sy / sx > 1.5;
  
  if (isTall && !prop(o, "noTexture", false)) {
    const facadeMat = new THREE.MeshStandardMaterial({
      ...baseConfig,
      map: generateFacadeTexture()
    });
    
    const roofMat = new THREE.MeshStandardMaterial(baseConfig);
    
    // Material array: [right, left, top, bottom, front, back]
    // Top (index 2) gets flat roof, others get facade
    return [facadeMat, facadeMat, roofMat, facadeMat, facadeMat, facadeMat];
  }

  // Apply brick texture to arches and other marked elements
  if (prop(o, "noTexture", false)) {
    return new THREE.MeshStandardMaterial({
      ...baseConfig,
      map: generateBrickTexture()
    });
  }

  return new THREE.MeshStandardMaterial(baseConfig);
}

function addCube(o) {

  const geo = new THREE.BoxGeometry(
    prop(o, "sx", prop(o, "size", 1)),
    prop(o, "sy", prop(o, "size", 1)),
    prop(o, "sz", prop(o, "size", 1))
  );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
  return mesh;
}

function addSphere(o) {

  const geo =
    new THREE.SphereGeometry(
      prop(o, "radius", 1),
      32,
      16
    );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
  return mesh;
}

function addCylinder(o) {

  const geo =
    new THREE.CylinderGeometry(
      prop(o, "radiusTop", 1),
      prop(o, "radiusBottom", 1),
      prop(o, "height", 2),
      24
    );

  const mesh =
    new THREE.Mesh(
      geo,
      makeMaterial(o)
    );

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  mesh.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(mesh);
  return mesh;
}

function addWedge(o) {

  const width = prop(o, "width", prop(o, "sx", 1));
  const height = prop(o, "height", prop(o, "sy", 1));
  const depth = prop(o, "depth", prop(o, "sz", 1));

  const group = new THREE.Group();

  const backBox = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.01, depth),
    makeMaterial(o)
  );
  backBox.position.y = -height / 2;
  group.add(backBox);

  const frontBox = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    makeMaterial(o)
  );
  frontBox.position.z = depth / 2;
  group.add(frontBox);

  const sideLeft = new THREE.Mesh(
    new THREE.BoxGeometry(0.01, height / 2, depth),
    makeMaterial(o)
  );
  sideLeft.position.x = -width / 2;
  sideLeft.position.y = height / 4;
  group.add(sideLeft);

  const sideRight = new THREE.Mesh(
    new THREE.BoxGeometry(0.01, height / 2, depth),
    makeMaterial(o)
  );
  sideRight.position.x = width / 2;
  sideRight.position.y = height / 4;
  group.add(sideRight);

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  group.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(group);
  return group;
}

function addStair(o) {

  const width = prop(o, "width", prop(o, "sx", 1));
  const stepCount = prop(o, "stepCount", 3);
  const stepHeight = prop(o, "stepHeight", 0.3);
  const stepDepth = prop(o, "stepDepth", 0.4);

  const group = new THREE.Group();

  for (let i = 0; i < stepCount; i++) {

    const step = new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        stepHeight,
        stepDepth
      ),
      makeMaterial(o)
    );

    step.position.y = stepHeight / 2 + i * stepHeight;
    step.position.z = i * stepDepth;

    group.add(step);
  }

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  group.scale.set(
    prop(o, "worldScaleX", 1),
    prop(o, "worldScaleY", 1),
    prop(o, "worldScaleZ", 1)
  );

  scene.add(group);
  return group;
}

function isCharacterSceneFile(sceneFile) {
  return /(^|\/)character\.sim$/i.test(sceneFile || "");
}

function isFloorLikeObject(o) {
  const type = prop(o, "type", "");
  if (type !== "cube") return false;
  const sx = prop(o, "sx", prop(o, "size", 1));
  const sy = prop(o, "sy", prop(o, "size", 1));
  const sz = prop(o, "sz", prop(o, "size", 1));
  const y = prop(o, "y", 0);
  return sy <= 1.0 && sx >= 10 && sz >= 10 && y <= 1.0;
}

function addExtendedGround(objects) {
  if (!objects || objects.length === 0) return;

  let minX = Infinity;
  let maxX = -Infinity;
  let minZ = Infinity;
  let maxZ = -Infinity;
  let minY = Infinity;

  for (const o of objects) {
    const x = prop(o, "x", 0);
    const y = prop(o, "y", 0);
    const z = prop(o, "z", 0);

    const scaleX = prop(o, "worldScaleX", 1);
    const scaleY = prop(o, "worldScaleY", 1);
    const scaleZ = prop(o, "worldScaleZ", 1);

    const sx = prop(o, "sx", prop(o, "width", prop(o, "size", prop(o, "radius", 1) * 2))) * scaleX;
    const sy = prop(o, "sy", prop(o, "height", prop(o, "size", prop(o, "radius", 1) * 2))) * scaleY;
    const sz = prop(o, "sz", prop(o, "depth", prop(o, "size", prop(o, "radius", 1) * 2))) * scaleZ;

    minX = Math.min(minX, x - sx / 2);
    maxX = Math.max(maxX, x + sx / 2);
    minZ = Math.min(minZ, z - sz / 2);
    maxZ = Math.max(maxZ, z + sz / 2);
    minY = Math.min(minY, y - sy / 2);
  }

  if (!Number.isFinite(minX) || !Number.isFinite(maxX) || !Number.isFinite(minZ) || !Number.isFinite(maxZ)) {
    return;
  }

  const padding = 320;
  const spanX = maxX - minX + padding * 2;
  const spanZ = maxZ - minZ + padding * 2;
  const centerX = (minX + maxX) / 2;
  const centerZ = (minZ + maxZ) / 2;
  const groundY = Math.min(0, minY) - 0.08;

  const extendedGround = new THREE.Mesh(
    new THREE.PlaneGeometry(spanX, spanZ),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color(0x2f2f2f),
      roughness: 0.9,
      metalness: 0,
      map: generateAsphaltTexture()
    })
  );

  if (extendedGround.material.map) {
    extendedGround.material.map.wrapS = THREE.RepeatWrapping;
    extendedGround.material.map.wrapT = THREE.RepeatWrapping;
    extendedGround.material.map.repeat.set(Math.max(4, spanX / 150), Math.max(4, spanZ / 150));
  }

  extendedGround.rotation.x = -Math.PI / 2;
  extendedGround.position.set(centerX, groundY, centerZ);
  scene.add(extendedGround);
}

function extendPrimaryGroundObject(objects) {
  let bestGround = null;
  let bestArea = 0;

  for (const o of objects) {
    if (prop(o, "type") !== "cube") continue;

    const sx = prop(o, "sx", prop(o, "size", 1));
    const sy = prop(o, "sy", prop(o, "size", 1));
    const sz = prop(o, "sz", prop(o, "size", 1));
    const y = prop(o, "y", 0);

    const isGroundCandidate = sy < 2 && sx > 20 && sz > 20 && y <= 2;
    if (!isGroundCandidate) continue;

    const area = sx * sz;
    if (area > bestArea) {
      bestArea = area;
      bestGround = o;
    }
  }

  if (!bestGround) return false;

  const currentSX = prop(bestGround, "sx", prop(bestGround, "size", 1));
  const currentSZ = prop(bestGround, "sz", prop(bestGround, "size", 1));

  bestGround.sx = Math.max(currentSX, currentSX + 600);
  bestGround.sz = Math.max(currentSZ, currentSZ + 600);
  return true;
}

async function loadScene() {

  const params =
    new URLSearchParams(location.search);

  const sceneFile =
    params.get("file")
    || "examples/building/primitive_world.sim";

  const res = await fetch(
    "/api/scene?file="
    + encodeURIComponent(sceneFile)
  );

  const raw = await res.json();

  console.log("RAW", raw);

  const objects =
    normalizeSceneItems(raw);

  controlledPrimitiveParts = [];
  controlledPrimitiveGroup = null;
  const controlCharacterPrimitives = isCharacterSceneFile(sceneFile);

  const extendedPrimaryGround =
    extendPrimaryGroundObject(objects);

  console.log(
    "NORMALIZED OBJECTS",
    objects
  );

  for (const o of objects) {

    const type =
      prop(o, "type");

    console.log(
      "DRAW",
      type,
      o
    );

    let rendered = null;

    if (type === "cube") {
      rendered = addCube(o);
    }

    else if (type === "sphere") {
      rendered = addSphere(o);
    }

    else if (type === "cylinder") {
      rendered = addCylinder(o);
    }

    else if (type === "wedge") {
      rendered = addWedge(o);
    }

    else if (type === "stair") {
      rendered = addStair(o);
    }

    if (rendered && controlCharacterPrimitives && !isFloorLikeObject(o)) {
      controlledPrimitiveParts.push({
        obj: rendered,
        source: o
      });
    }
  }

  if (!extendedPrimaryGround) {
    addExtendedGround(objects);
  }

  if (controlledPrimitiveParts.length > 0) {
    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let minZ = Infinity;
    let maxZ = -Infinity;

    for (const part of controlledPrimitiveParts) {
      const o = part.source;
      const x = prop(o, "x", 0);
      const y = prop(o, "y", 0);
      const z = prop(o, "z", 0);
      const sx = prop(o, "sx", prop(o, "size", prop(o, "radius", 1) * 2));
      const sy = prop(o, "sy", prop(o, "size", prop(o, "radius", 1) * 2));
      const sz = prop(o, "sz", prop(o, "size", prop(o, "radius", 1) * 2));

      minX = Math.min(minX, x - sx / 2);
      maxX = Math.max(maxX, x + sx / 2);
      minY = Math.min(minY, y - sy / 2);
      minZ = Math.min(minZ, z - sz / 2);
      maxZ = Math.max(maxZ, z + sz / 2);
    }

    const anchorX = (minX + maxX) / 2;
    const anchorY = minY;
    const anchorZ = (minZ + maxZ) / 2;

    controlledPrimitiveGroup = new THREE.Group();
    controlledPrimitiveGroup.position.set(anchorX, anchorY, anchorZ);
    scene.add(controlledPrimitiveGroup);

    for (const part of controlledPrimitiveParts) {
      const o = part.source;
      scene.remove(part.obj);
      part.obj.position.set(
        prop(o, "x", 0) - anchorX,
        prop(o, "y", 0) - anchorY,
        prop(o, "z", 0) - anchorZ
      );
      part.obj.rotation.set(
        prop(o, "rotX", 0),
        prop(o, "rotY", 0),
        prop(o, "rotZ", 0)
      );
      controlledPrimitiveGroup.add(part.obj);
    }

    characterPosition.set(anchorX, Math.max(FLOOR_Y, anchorY), anchorZ);
  }
}

await loadScene();

const moveInput = { x:0, y:0 };
const lookInput = { x:0, y:0 };
const keyState = {
  w: false,
  a: false,
  s: false,
  d: false
};

const hud = document.getElementById("hud");

hud.innerHTML = [
  "Simla Primitive Sandbox",
  "Click to lock mouse",
  "WASD to move"
].join("<br>");

function setupJoystick(zoneId, knobId, state) {

  const zone =
    document.getElementById(zoneId);

  const knob =
    document.getElementById(knobId);

  let active = false;

  zone.addEventListener("touchstart", () => {
    active = true;
  });

  zone.addEventListener("touchend", () => {

    active = false;

    state.x = 0;
    state.y = 0;

    knob.style.left = "76px";
    knob.style.top = "76px";
  });

  zone.addEventListener("touchmove", e => {

    e.preventDefault();

    if (!active) return;

    const rect =
      zone.getBoundingClientRect();

    const touch = e.touches[0];

    const x =
      touch.clientX
      - rect.left
      - 70;

    const y =
      touch.clientY
      - rect.top
      - 70;

    const dist =
      Math.min(
        90,
        Math.hypot(x,y)
      );

    const ang =
      Math.atan2(y,x);

    const dx =
      Math.cos(ang) * dist;

    const dy =
      Math.sin(ang) * dist;

    knob.style.left =
      (76 + dx) + "px";

    knob.style.top =
      (76 + dy) + "px";

    state.x = dx / 90;
    state.y = dy / 90;
  });
}

setupJoystick(
  "moveZone",
  "moveKnob",
  moveInput
);

setupJoystick(
  "lookZone",
  "lookKnob",
  lookInput
);

renderer.domElement.addEventListener("click", () => {

  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener("pointerlockchange", () => {

  if (document.pointerLockElement === renderer.domElement) {

    hud.innerHTML = [
      "Simla Primitive Sandbox",
      "Mouse look active (Esc to unlock)",
      "WASD to move"
    ].join("<br>");
  }

  else {

    hud.innerHTML = [
      "Simla Primitive Sandbox",
      "Click to lock mouse",
      "WASD to move"
    ].join("<br>");
  }
});

document.addEventListener("mousemove", e => {

  if (document.pointerLockElement !== renderer.domElement) {
    return;
  }

  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0018;
});

window.addEventListener("keydown", e => {

  const key = e.key.toLowerCase();

  if (key === "w") keyState.w = true;
  if (key === "a") keyState.a = true;
  if (key === "s") keyState.s = true;
  if (key === "d") keyState.d = true;
  if (key === " ") {
    e.preventDefault();
    if (isOnGround) {
      playerVelocityY = JUMP_FORCE;
      isOnGround = false;
    }
  }
});

window.addEventListener("keyup", e => {

  const key = e.key.toLowerCase();

  if (key === "w") keyState.w = false;
  if (key === "a") keyState.a = false;
  if (key === "s") keyState.s = false;
  if (key === "d") keyState.d = false;
});

let yaw = 0;
let pitch = -0.3;

// Player physics
let playerVelocityY = 0;

// Load player character model
let playerCharacter = null;
const avatarEnabled = (new URLSearchParams(location.search).get("avatar") || "0") === "1";

if (avatarEnabled) {
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/libs/draco/');

  const loader = new GLTFLoader();
  loader.setDRACOLoader(dracoLoader);
  loader.load('newcharacter_compressed.glb', (gltf) => {
    playerCharacter = gltf.scene;
    playerCharacter.scale.set(0.125, 0.125, 0.125); // Scale down character even further
    scene.add(playerCharacter);

    // Find skeleton and collect all neck/head bones for rig demo
    playerCharacter.rigBones = [];
    playerCharacter.lastHeadBone = null;
    playerCharacter.neckBone = null;
    playerCharacter.hipBone = null;
    playerCharacter.traverse((obj) => {
      if (obj.isSkinnedMesh && obj.skeleton) {
        for (const bone of obj.skeleton.bones) {
          const name = bone.name.toLowerCase();
          if (!playerCharacter.hipBone && (name.includes('hip') || name === 'root' || name === 'root1')) {
            playerCharacter.hipBone = bone;
          }
          if (name.includes('neck')) {
            playerCharacter.neckBone = bone;
          }
          if (name.includes('head')) {
            playerCharacter.lastHeadBone = bone;
          }
          if (name.includes('head') || name.includes('neck')) {
            playerCharacter.rigBones.push(bone);
          }
          // Log all bone names for debugging
          console.log('Bone:', bone.name);
        }
      }
    });
    if (!playerCharacter.lastHeadBone && !playerCharacter.neckBone) {
      console.warn('No head/neck bone found. See bone names above.');
    }
  }, undefined, (err) => {
    console.warn('Optional avatar failed to load:', err?.message || err);
  });
}

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth
    / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});


function animate() {
  requestAnimationFrame(animate);

  yaw -= lookInput.x * 0.03;
  pitch -= lookInput.y * 0.02;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));

  // Movement directions
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
  const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();
  const moveSpeed = 0.15;

  let keyX = 0, keyY = 0;
  if (keyState.w) keyY -= 1;
  if (keyState.s) keyY += 1;
  if (keyState.a) keyX -= 1;
  if (keyState.d) keyX += 1;
  const totalX = Math.max(-1, Math.min(1, moveInput.x + keyX));
  const totalY = Math.max(-1, Math.min(1, moveInput.y + keyY));
  const moveForward = -totalY * moveSpeed;
  const moveRight = -totalX * moveSpeed;

  // Apply movement to character
  characterPosition.x += forward.x * moveForward + right.x * moveRight;
  characterPosition.z += forward.z * moveForward + right.z * moveRight;

  // Apply gravity
  characterVelocityY -= GRAVITY;
  characterPosition.y += characterVelocityY;

  // Floor collision
  if (characterPosition.y < FLOOR_Y) {
    characterPosition.y = FLOOR_Y;
    characterVelocityY = 0;
    isOnGround = true;
  } else {
    isOnGround = false;
  }

  // Camera follows behind and above character
  camera.position.x = characterPosition.x - Math.sin(yaw) * CAMERA_DISTANCE;
  camera.position.y = characterPosition.y + CAMERA_HEIGHT;
  camera.position.z = characterPosition.z - Math.cos(yaw) * CAMERA_DISTANCE;
  // Aim camera using yaw + pitch so mouse can look up/down.
  const lookDirection = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  ).normalize();
  const lookTarget = new THREE.Vector3().copy(camera.position).addScaledVector(lookDirection, 120);
  camera.lookAt(lookTarget);

  // Keep skybox centered on camera
  skybox.position.copy(camera.position);

  // Update player character position and rotation
  if (playerCharacter) {
    playerCharacter.position.copy(characterPosition);

    // Do NOT rotate the character root at all!
    // Instead, apply yaw to the hip/root bone if available

    if (playerCharacter.hipBone) {
      playerCharacter.hipBone.rotation.x = 0;
      playerCharacter.hipBone.rotation.z = 0;
      playerCharacter.hipBone.rotation.y = yaw;
    }

    // Rig demo: reset and rotate all neck/head bones
    if (playerCharacter.rigBones && playerCharacter.rigBones.length > 0) {
      for (const bone of playerCharacter.rigBones) {
        bone.rotation.x = 0;
        bone.rotation.y = 0;
        bone.rotation.z = 0;
      }
      // Apply pitch to last head bone, and a fraction to neck (only X axis)
      if (playerCharacter.lastHeadBone) {
        playerCharacter.lastHeadBone.rotation.x = pitch;
        playerCharacter.lastHeadBone.rotation.y = 0;
        playerCharacter.lastHeadBone.rotation.z = 0;
      }
      if (playerCharacter.neckBone) {
        playerCharacter.neckBone.rotation.x = pitch * 0.4;
        playerCharacter.neckBone.rotation.y = 0;
        playerCharacter.neckBone.rotation.z = 0;
      }
    }
  }

  if (controlledPrimitiveGroup) {
    controlledPrimitiveGroup.position.x = characterPosition.x;
    controlledPrimitiveGroup.position.y = characterPosition.y;
    controlledPrimitiveGroup.position.z = characterPosition.z;
    controlledPrimitiveGroup.rotation.y = yaw;
  }

  // Update day-night cycle
  cycleTime += 0.0001; // Slow day-night cycle
  if (cycleTime >= 1) cycleTime -= 1;
  
  // Position sun and moon
  const sunAngle = cycleTime * Math.PI * 2; // 0 = east, PI = west
  const sunDistance = 1000;
  const sunHeight = Math.sin(sunAngle - Math.PI / 2) * sunDistance + 500; // Oscillates +/- 1000 around 500
  
  sunObject.position.x = Math.cos(sunAngle) * sunDistance;
  sunObject.position.y = sunHeight;
  sunObject.position.z = Math.sin(sunAngle) * sunDistance * 0.5;
  
  // Moon is opposite sun
  const moonAngle = sunAngle + Math.PI;
  moonObject.position.x = Math.cos(moonAngle) * sunDistance;
  moonObject.position.y = Math.sin(moonAngle - Math.PI / 2) * sunDistance + 500;
  moonObject.position.z = Math.sin(moonAngle) * sunDistance * 0.5;
  
  // Update sun color based on time
  let sunColor = 0xffdd00; // Bright yellow at noon
  if (cycleTime < 0.25) {
    // Night to sunrise - orange
    sunColor = 0xff8800;
  } else if (cycleTime < 0.35) {
    // Sunrise - orange to yellow
    const t = (cycleTime - 0.25) / 0.1;
    sunColor = new THREE.Color().lerpColors(new THREE.Color(0xff8800), new THREE.Color(0xffdd00), t).getHex();
  } else if (cycleTime < 0.65) {
    // Day - bright yellow
    sunColor = 0xffdd00;
  } else if (cycleTime < 0.75) {
    // Sunset - yellow to orange
    const t = (cycleTime - 0.65) / 0.1;
    sunColor = new THREE.Color().lerpColors(new THREE.Color(0xffdd00), new THREE.Color(0xff8800), t).getHex();
  } else {
    // Night - orange red
    sunColor = 0xff4400;
  }
  sunMaterial.color.setHex(sunColor);
  
  // Update directional light to follow sun and change intensity
  sunLight.position.copy(sunObject.position);
  const lightIntensity = Math.max(0.35, Math.sin(sunAngle) + 0.6); // 0.35 at night, 1.6 at noon
  sunLight.intensity = lightIntensity * 2.2;
  ambientLight.intensity = Math.max(0.25, lightIntensity * 0.65);
  fillLight.intensity = Math.max(0.35, lightIntensity * 0.35);
  
  // Update skybox texture based on time
  skyboxMaterial.map = generateSkyTextureForTime(cycleTime);
  skyboxMaterial.map.needsUpdate = true;

  // Update player character rotation
  if (playerCharacter) {
    playerCharacter.rotation.order = "YXZ";
    playerCharacter.rotation.y = yaw;
    playerCharacter.rotation.x = pitch;
  }

  // Animate clouds
  const time = Date.now() * 0.0001;
  for (let i = 0; i < clouds.length; i++) {
    const cloud = clouds[i];
    const cloudTime = time + i * 10;
    
    // Circular movement pattern
    cloud.mesh.position.x = Math.cos(cloudTime * cloud.speed) * 400 + (i % 3 - 1) * 200;
    cloud.mesh.position.z = Math.sin(cloudTime * cloud.speed * 0.7) * 400 + Math.floor(i / 3) * 300 - 300;
    
    // Gentle up-down bobbing
    cloud.mesh.position.y += cloud.yVariation;
    if (cloud.mesh.position.y < 100) cloud.yVariation = Math.abs(cloud.yVariation);
    if (cloud.mesh.position.y > 600) cloud.yVariation = -Math.abs(cloud.yVariation);
    
    // Slow rotation
    cloud.mesh.rotation.y += 0.0001;
  }

  renderer.render(scene, camera);
}

animate();
