<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Primitive World Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #202530;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  font-family: sans-serif;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 8px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="hud">
Simla Primitive Sandbox
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202530);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(10, 8, 12);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(10,20,10);
scene.add(sun);

scene.add(new THREE.GridHelper(50,50));

function prop(obj, key, fallback=null) {

  if (!Array.isArray(obj)) return fallback;

  for (let i = 0; i < obj.length; i += 2) {
    if (obj[i] === key) {
      return obj[i + 1];
    }
  }

  return fallback;
}

function addCube(o) {

  const geo = new THREE.BoxGeometry(
    prop(o, "sx", prop(o, "size", 1)),
    prop(o, "sy", prop(o, "size", 1)),
    prop(o, "sz", prop(o, "size", 1))
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  scene.add(mesh);
}

function addSphere(o) {

  const geo = new THREE.SphereGeometry(
    prop(o, "radius", 1),
    32,
    16
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  scene.add(mesh);
}

function addCylinder(o) {

  const geo = new THREE.CylinderGeometry(
    prop(o, "radiusTop", 1),
    prop(o, "radiusBottom", 1),
    prop(o, "height", 2),
    24
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  scene.add(mesh);
}

async function loadScene() {

  const res = await fetch(
    "/api/scene?file=examples/building/primitive_world.sim"
  );

  const data = await res.json();

  console.log(data);

  const objects =
    Array.isArray(data) && data[0] === "objects"
      ? data[1]
      : [];

  for (const o of objects) {

    const type = prop(o, "type");

    if (type === "cube") {
      addCube(o);
    }

    else if (type === "sphere") {
      addSphere(o);
    }

    else if (type === "cylinder") {
      addCylinder(o);
    }
  }
}

await loadScene();

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

function animate() {

  requestAnimationFrame(animate);

  renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
