<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Primitive World Viewer</title>

<style>

body {
  margin: 0;
  overflow: hidden;
  background: #202530;
  touch-action: none;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  font-family: sans-serif;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 8px;
  z-index: 20;
}

.joystick {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  bottom: 24px;
  z-index: 20;
  touch-action: none;
}

#moveZone {
  left: 24px;
}

#lookZone {
  right: 24px;
}

.knob {
  position: absolute;
  width: 128px;
  height: 128px;
  left: 76px;
  top: 76px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.3);
}

</style>
</head>

<body>

<div id="hud">
Simla Primitive Sandbox
</div>

<div id="moveZone" class="joystick">
  <div id="moveKnob" class="knob"></div>
</div>

<div id="lookZone" class="joystick">
  <div id="lookKnob" class="knob"></div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202530);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(10, 8, 12);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(10,20,10);
scene.add(sun);

scene.add(new THREE.GridHelper(100,100));

function prop(obj, key, fallback=null) {

  if (!Array.isArray(obj)) return fallback;

  for (let i = 0; i < obj.length; i += 2) {
    if (obj[i] === key) {
      return obj[i + 1];
    }
  }

  return fallback;
}

function addCube(o) {

  const geo = new THREE.BoxGeometry(
    prop(o, "sx", prop(o, "size", 1)),
    prop(o, "sy", prop(o, "size", 1)),
    prop(o, "sz", prop(o, "size", 1))
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  const group = new THREE.Group();

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.position.set(
    prop(o, "localX", 0),
    prop(o, "localY", 0),
    prop(o, "localZ", 0)
  );

  group.add(mesh);

  scene.add(group);
}

function addSphere(o) {

  const geo = new THREE.SphereGeometry(
    prop(o, "radius", 1),
    32,
    16
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  const group = new THREE.Group();

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.position.set(
    prop(o, "localX", 0),
    prop(o, "localY", 0),
    prop(o, "localZ", 0)
  );

  group.add(mesh);

  scene.add(group);
}

function addCylinder(o) {

  const geo = new THREE.CylinderGeometry(
    prop(o, "radiusTop", 1),
    prop(o, "radiusBottom", 1),
    prop(o, "height", 2),
    24
  );

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(
      prop(o, "r", 255) / 255,
      prop(o, "g", 255) / 255,
      prop(o, "b", 255) / 255
    )
  });

  const mesh = new THREE.Mesh(geo, mat);

  const group = new THREE.Group();

  group.position.set(
    prop(o, "x", 0),
    prop(o, "y", 0),
    prop(o, "z", 0)
  );

  group.rotation.set(
    prop(o, "rotX", 0),
    prop(o, "rotY", 0),
    prop(o, "rotZ", 0)
  );

  mesh.position.set(
    prop(o, "localX", 0),
    prop(o, "localY", 0),
    prop(o, "localZ", 0)
  );

  group.add(mesh);

  scene.add(group);
}

async function loadScene() {

  const params = new URLSearchParams(location.search);

  const sceneFile =
    params.get("file")
    || "examples/building/primitive_world.sim";

  const res = await fetch(
    "/api/scene?file=" + encodeURIComponent(sceneFile)
  );

  const raw = await res.json();

  const data = raw && raw.result ? raw.result : raw;

  const objects =
    Array.isArray(data)
      ? data
      : Array.isArray(data?.result)
        ? data.result
        : []; 

  for (const o of objects) {

    const type = prop(o, "type");

    if (type === "cube") {
      addCube(o);
    }

    else if (type === "sphere") {
      addSphere(o);
    }

    else if (type === "cylinder") {
      addCylinder(o);
    }
  }
}

await loadScene();

const moveInput = { x:0, y:0 };
const lookInput = { x:0, y:0 };

function setupJoystick(zoneId, knobId, state) {

  const zone = document.getElementById(zoneId);
  const knob = document.getElementById(knobId);

  let active = false;

  zone.addEventListener("touchstart", e => {
    active = true;
  });

  zone.addEventListener("touchend", e => {

    active = false;

    state.x = 0;
    state.y = 0;

    knob.style.left = "76px";
    knob.style.top = "76px";
  });

  zone.addEventListener("touchmove", e => {

    if (!active) return;

    const rect = zone.getBoundingClientRect();

    const touch = e.touches[0];

    const x = touch.clientX - rect.left - 70;
    const y = touch.clientY - rect.top - 70;

    const dist = Math.min(
      90,
      Math.hypot(x,y)
    );

    const ang = Math.atan2(y,x);

    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist;

    knob.style.left = (76 + dx) + "px";
    knob.style.top = (76 + dy) + "px";

    state.x = dx / 90;
    state.y = dy / 90;

  });

}

setupJoystick("moveZone", "moveKnob", moveInput);
setupJoystick("lookZone", "lookKnob", lookInput);

let yaw = 0;
let pitch = -0.3;

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

function animate() {

  requestAnimationFrame(animate);

  yaw -= lookInput.x * 0.03;
  pitch -= lookInput.y * 0.02;

  pitch = Math.max(
    -1.5,
    Math.min(1.5, pitch)
  );

  const forward = new THREE.Vector3(
    Math.sin(yaw),
    0,
    Math.cos(yaw)
  ).normalize();

  const right = new THREE.Vector3(
    forward.z,
    0,
    -forward.x
  ).normalize();

  const moveSpeed = 0.15;

  const moveForward =
    -moveInput.y * moveSpeed;

  const moveRight =
    -moveInput.x * moveSpeed;

  camera.position.x +=
    forward.x * moveForward +
    right.x * moveRight;

  camera.position.z +=
    forward.z * moveForward +
    right.z * moveRight;

  camera.lookAt(
    camera.position.x + Math.sin(yaw),
    camera.position.y + pitch,
    camera.position.z + Math.cos(yaw)
  );

  renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
