<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simλ Spec</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #070b14;
      color: #e6f3ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(102,204,255,.18);
      padding: 14px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
      color: #bcecff;
      text-shadow: 0 0 16px rgba(102,204,255,.45);
    }

    main {
      width: min(900px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 48px;
    }

    h1, h2, h3 {
      line-height: 1.2;
    }

    h1 {
      font-size: 30px;
    }

    h2 {
      margin-top: 36px;
      color: #9fe4ff;
      border-bottom: 1px solid rgba(102,204,255,.18);
      padding-bottom: 8px;
    }

    p, li {
      font-size: 16px;
    }

    code {
      background: rgba(255,255,255,.08);
      padding: 2px 5px;
      border-radius: 5px;
      color: #d7f6ff;
    }

    pre {
      overflow-x: auto;
      background: #0e1422;
      border: 1px solid rgba(102,204,255,.16);
      border-radius: 12px;
      padding: 14px;
      box-shadow: inset 0 0 18px rgba(0,0,0,.35);
    }

    pre code {
      background: transparent;
      padding: 0;
      font-size: 14px;
      white-space: pre;
    }

    blockquote {
      margin: 18px 0;
      padding: 10px 14px;
      border-left: 4px solid #66ccff;
      background: rgba(102,204,255,.08);
      border-radius: 8px;
    }

    @media (max-width: 520px) {
      header h1 {
        font-size: 20px;
      }

      main {
        width: calc(100vw - 22px);
        padding-top: 12px;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 21px;
      }

      p, li {
        font-size: 15.5px;
      }

      pre {
        padding: 12px;
        border-radius: 10px;
      }

      pre code {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Simλ Docs</h1>
  </header>

  <main id="content">Loading...</main>

  <script>
    fetch("docs/SPEC.md")
      .then(r => r.text())
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("content").textContent = err.message;
      });
  </script>
</body>
</html>
