function canvasTexture(draw){
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext("2d");
  draw(ctx, c.width, c.height);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function noisyTexture(base, line, speck){
  return canvasTexture((ctx,w,h) => {
    ctx.fillStyle = base;
    ctx.fillRect(0,0,w,h);

    ctx.globalAlpha = .18;
    ctx.strokeStyle = line;
    for(let i=0;i<w;i+=8){
      ctx.beginPath();
      ctx.moveTo(i,0);
      ctx.lineTo(i,h);
      ctx.stroke();
    }
    for(let j=0;j<h;j+=10){
      ctx.beginPath();
      ctx.moveTo(0,j);
      ctx.lineTo(w,j);
      ctx.stroke();
    }

    ctx.globalAlpha = .22;
    ctx.fillStyle = speck;
    for(let i=0;i<600;i++){
      ctx.fillRect(Math.random()*w, Math.random()*h, 1 + Math.random()*2, 1 + Math.random()*2);
    }

    ctx.globalAlpha = 1;
  });
}


function bumpTexture(strength=1){
  return canvasTexture((ctx,w,h) => {
    ctx.fillStyle = "#808080";
    ctx.fillRect(0,0,w,h);
    ctx.globalAlpha = .35;
    for(let i=0;i<1200;i++){
      const v = 100 + Math.random() * 80;
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(Math.random()*w, Math.random()*h, 1 + Math.random()*3, 1 + Math.random()*3);
    }
    ctx.globalAlpha = .2;
    ctx.strokeStyle = "#ffffff";
    for(let y=0;y<h;y+=12){
      ctx.beginPath();
      ctx.moveTo(0,y + Math.sin(y)*2);
      ctx.lineTo(w,y);
      ctx.stroke();
    }
  });
}

const skinBump = bumpTexture();
const clothBump = bumpTexture();
const leatherBump = bumpTexture();

const skinTex = noisyTexture("#d9a27c", "#f0bc96", "#8a5a3d");
const clothTex = noisyTexture("#1f5cff", "#6aa0ff", "#071a80");
const robeTex = noisyTexture("#172554", "#304a9a", "#061030");
const leatherTex = noisyTexture("#5a321d", "#9a6338", "#1f1008");
const goldTex = noisyTexture("#ffcc55", "#fff1a8", "#8b5c00");
const darkTex = noisyTexture("#111827", "#253044", "#02040a");

const skin = new THREE.MeshStandardMaterial({ color:"#d9a27c", map:skinTex, bumpMap:skinBump, bumpScale:.018, roughness:.82 });
const cloth = new THREE.MeshStandardMaterial({ color:"#1f5cff", map:clothTex, bumpMap:clothBump, bumpScale:.035, roughness:.78, metalness:.02 });
const dark = new THREE.MeshStandardMaterial({ color:"#111827", map:darkTex, roughness:.82 });
const gold = new THREE.MeshStandardMaterial({ color:"#ffcc55", map:goldTex, roughness:.28, metalness:.65 });
const leather = new THREE.MeshStandardMaterial({ color:"#5a321d", map:leatherTex, bumpMap:leatherBump, bumpScale:.04, roughness:.92 });
const glow = new THREE.MeshStandardMaterial({ color:"#66ccff", emissive:"#1888ff", emissiveIntensity:1.4 });

function capsule(radius, length, mat){
  const group = new THREE.Group();

  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 24), mat);
  group.add(cyl);

  const top = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 12), mat);
  top.position.y = length / 2;
  group.add(top);

  const bot = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 12), mat);
  bot.position.y = -length / 2;
  group.add(bot);

  group.traverse(o => {
    if(o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });

  return group;
}

hips.position.y = 1.1;
player.add(hips);


function makeConnectedBodyGeometry(){
  const verts = [];
  const faces = [];
  const seg = 32;

  const rings = [
    { y:-0.10, rx:0.38, rz:0.25, cx:0, z:0 },
    { y: 0.20, rx:0.48, rz:0.30, cx:0, z:0 },
    { y: 0.62, rx:0.45, rz:0.28, cx:0, z:0 },
    { y: 1.02, rx:0.34, rz:0.24, cx:0, z:0 },
    { y: 1.25, rx:0.17, rz:0.15, cx:0, z:0 },
    { y: 1.42, rx:0.25, rz:0.22, cx:0, z:-0.015 },
    { y: 1.64, rx:0.34, rz:0.30, cx:0, z:-0.035 },
    { y: 1.86, rx:0.31, rz:0.28, cx:0, z:-0.02 },
    { y: 2.02, rx:0.20, rz:0.18, cx:0, z:0 }
  ];

  for(const r of rings){
    const base = verts.length / 3;

    for(let i=0;i<seg;i++){
      const a = (i / seg) * Math.PI * 2;

      const squash = 1 + Math.sin(a) * 0.04;

      verts.push(
        r.cx + Math.cos(a) * r.rx * squash,
        r.y,
        r.z + Math.sin(a) * r.rz
      );
    }

    r.base = base;
  }

  for(let j=0;j<rings.length-1;j++){
    const a = rings[j];
    const b = rings[j+1];

    for(let i=0;i<seg;i++){
      const n = (i + 1) % seg;

      faces.push(
        a.base + i, b.base + i, b.base + n,
        a.base + i, b.base + n, a.base + n
      );
    }
  }

  const bottomCenter = verts.length / 3;
  verts.push(0, rings[0].y - 0.03, 0);

  for(let i=0;i<seg;i++){
    const n = (i + 1) % seg;
    faces.push(bottomCenter, rings[0].base + n, rings[0].base + i);
  }

  const topCenter = verts.length / 3;
  const top = rings[rings.length - 1];
  verts.push(0, top.y + 0.06, top.z);

  for(let i=0;i<seg;i++){
    const n = (i + 1) % seg;
    faces.push(topCenter, top.base + i, top.base + n);
  }

  const geo = new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(verts, 3)
  );

  geo.setIndex(faces);
  geo.computeVertexNormals();

  return geo;
}

const connectedBody = new THREE.Mesh(
  makeConnectedBodyGeometry(),
  cloth
);

connectedBody.castShadow = true;
connectedBody.receiveShadow = true;
hips.add(connectedBody);

const hair = new THREE.Mesh(new THREE.SphereGeometry(.37, 24, 12, 0, Math.PI*2, 0, Math.PI*.58), dark);
hair.position.y = 1.78;

function makeArm(side){
  const shoulder = new THREE.Group();
  shoulder.position.set(side * .55, 1.05, 0);
  hips.add(shoulder);

  const upper = capsule(.13, .52, cloth);
  upper.position.y = -.28;
  shoulder.add(upper);

  const elbow = new THREE.Group();
  elbow.position.y = -.58;
  shoulder.add(elbow);

  const fore = capsule(.115, .5, skin);
  fore.position.y = -.25;
  elbow.add(fore);

  const hand = new THREE.Mesh(new THREE.SphereGeometry(.13, 18, 12), skin);
  hand.position.y = -.55;
  elbow.add(hand);

  return { shoulder, elbow, hand };
}

function makeLeg(side){
  const hip = new THREE.Group();
  hip.position.set(side * .22, .05, 0);
  hips.add(hip);

  const thigh = capsule(.16, .58, dark);
  thigh.position.y = -.32;
  hip.add(thigh);

  const knee = new THREE.Group();
  knee.position.y = -.66;
  hip.add(knee);

  const shin = capsule(.14, .54, dark);
  shin.position.y = -.28;
  knee.add(shin);

  const foot = new THREE.Mesh(new THREE.BoxGeometry(.28, .16, .48), leather);
  foot.position.set(0, -.62, -.1);
  foot.castShadow = true;
  knee.add(foot);

  return { hip, knee, foot };
}

eye(-.105);

function fingers(hand, side){

// boots with toe caps

// staff metal rings
const staffRingMat = gold;
for(const y of [-.35, .55, .92]){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.06,.012,8,18), staffRingMat);
  ring.position.y = y;
  ring.rotation.x = Math.PI / 2;
  staff.add(ring);

// small floating magic shards
const shardMat = new THREE.MeshStandardMaterial({
  color:"#9fd3ff",
  emissive:"#2288ff",
  emissiveIntensity:.9,
  roughness:.25
});

const shards = [];
for(let i=0;i<4;i++){
  const sh = new THREE.Mesh(new THREE.OctahedronGeometry(.07), shardMat);
  sh.position.set(Math.sin(i*1.57)*.55, 1.45 + i*.11, Math.cos(i*1.57)*.22);
  hips.add(sh);
  shards.push(sh);
}

const staffOrb = new THREE.Mesh(new THREE.SphereGeometry(.16, 24, 16), glow);
staffOrb.position.y = 1.12;
staff.add(staffOrb);

let yaw = Math.PI;
let pitch = -0.25;
const keys = new Set();

addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

document.body.addEventListener("click", () => document.body.requestPointerLock?.());

document.addEventListener("mousemove", e => {
  if(document.pointerLockElement !== document.body) return;
  yaw -= e.movementX * .0025;
  pitch -= e.movementY * .0025;
  pitch = Math.max(-.9, Math.min(.45, pitch));
});

function updatePlayer(dt, t){
  let mx = 0, mz = 0;
  if(keys.has("w")) mz += 1;
  if(keys.has("s")) mz -= 1;
  if(keys.has("a")) mx -= 1;
  if(keys.has("d")) mx += 1;

  const moving = Math.hypot(mx,mz) > .05;

  if(moving){
    const f = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const r = new THREE.Vector3(f.z, 0, -f.x);
    const move = new THREE.Vector3().addScaledVector(r,mx).addScaledVector(f,mz).normalize();

    player.position.addScaledVector(move, dt * 3.2);
    player.rotation.y = Math.atan2(move.x, move.z) + Math.PI;
  }

  const walk = moving ? Math.sin(t * 9) : Math.sin(t * 2) * .08;
  const armSwing = moving ? walk * .62 : .08 * Math.sin(t * 2.1);
  const legSwing = moving ? walk * .72 : 0;

  leftArm.shoulder.rotation.x = armSwing;
  rightArm.shoulder.rotation.x = -armSwing;
  leftArm.elbow.rotation.x = -.25;
  rightArm.elbow.rotation.x = -.35;

  leftLeg.hip.rotation.x = -legSwing;
  rightLeg.hip.rotation.x = legSwing;
  leftLeg.knee.rotation.x = -Math.max(0, legSwing) * .75;
  rightLeg.knee.rotation.x = -Math.max(0, -legSwing) * .75;

  hips.position.y = 1.1 + Math.abs(walk) * .035;
  cape.rotation.x = .2 + Math.sin(t * 3) * .04;
  chestGem.rotation.y += dt * 2;
  staffOrb.rotation.y += dt * 3;
  for(let i=0;i<shards.length;i++){
    const sh = shards[i];
    sh.rotation.y += dt * (1.2 + i * .25);
    sh.position.y += Math.sin(t * 2.2 + i) * .002;
  }

}

function updateCamera(dt){
  const target = player.position.clone().add(new THREE.Vector3(0, 1.55, 0));

  const offset = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch) * 5.2,
    Math.sin(pitch) * 5.2 + 2.4,
    Math.cos(yaw) * Math.cos(pitch) * 5.2
  );

  camera.position.lerp(target.clone().add(offset), Math.min(1, dt * 8));
  camera.lookAt(target);
}

let last = performance.now();

function animate(now){
  requestAnimationFrame(animate);
  const dt = (now - last) / 1000;
  last = now;
  const t = now * .001;

  updatePlayer(dt, t);
  updateCamera(dt);

  renderer.render(scene, camera);
}

animate(performance.now());

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
