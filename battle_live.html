<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simλ Live Battle</title>
  <style>
    body { margin: 0; background: #050812; color: #dff6ff; font-family: system-ui; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      background: rgba(0,0,0,.65); border: 1px solid rgba(102,204,255,.25);
      border-radius: 12px; padding: 12px 14px; box-shadow: 0 0 28px rgba(102,204,255,.15);
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">Simλ Battle</div>

  <script type="module">
    import { parse } from "./src/parser.js";
    import { compile } from "./src/compiler.js";
    import { run } from "./src/vm.js";

    function tokenize(code) {
      return code.replace(/;;.*$/gm, "").replace(/\(/g, " ( ").replace(/\)/g, " ) ").match(/"[^"]*"|\S+/g);
    }

    function get(e, k) {
      for (let i = 0; i < e.length; i += 2) if (e[i] === k) return e[i + 1];
      return 0;
    }

    function makeEntities() {
      const out = [];
      for (let i = 0; i < 30; i++) {
        out.push(["id", i, "team", "player", "hp", 20, "attack", 1, "x", 80 + (i % 10) * 22, "y", 90 + Math.floor(i / 10) * 22]);
      }
      for (let i = 0; i < 30; i++) {
        out.push(["id", 100+i, "team", "enemy", "hp", 15, "attack", 1, "x", innerWidth - 300 + (i % 10) * 22, "y", 90 + Math.floor(i / 10) * 22]);
      }
      return out;
    }

    const tickCode = `(begin (damage_all entities tick))`;
    const reportCode = `(begin (battle_report entities ticks 600 450))`;

    const tickBytecode = compile(parse(tokenize(tickCode)));
    const reportBytecode = compile(parse(tokenize(reportCode)));

    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");

    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", resize);
    resize();

    let state = makeEntities();
    let ticks = 0;
    let done = false;
    let lastStep = 0;

    function drawEntity(e) {
      const team = get(e, "team");
      const hp = get(e, "hp");
      const maxHp = team === "player" ? 20 : 15;
      const x = get(e, "x");
      const y = get(e, "y");
      const r = 5 + Math.max(0, hp / maxHp) * 4;

      ctx.beginPath();
      ctx.fillStyle = team === "player" ? "rgba(90,180,255,.9)" : "rgba(255,80,80,.9)";
      ctx.shadowBlur = 12;
      ctx.shadowColor = ctx.fillStyle;
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function frame(time) {
      ctx.fillStyle = "rgba(5,8,18,.28)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!done && time - lastStep > 900) {
        const step = run(tickBytecode, { entities: state, tick: ticks });
        state = step.result;
        ticks++;
        lastStep = time;

        const players = state.filter(e => get(e, "team") === "player").length;
        const enemies = state.filter(e => get(e, "team") === "enemy").length;
        if (players === 0 || enemies === 0 || ticks >= 1000) done = true;
      }

      for (const e of state) drawEntity(e);

      const report = run(reportBytecode, { entities: state, ticks }).result;

      hud.textContent =
        `Simλ Battle\\n` +
        `Winner: ${done ? get(report, "winner") : "fighting"}\\n` +
        `Tick: ${ticks}\\n` +
        `Players: ${get(report, "playersAlive")}\\n` +
        `Enemies: ${get(report, "enemiesAlive")}\\n` +
        `Player Damage: ${get(report, "playerDamageTaken")}\\n` +
        `Enemy Damage: ${get(report, "enemyDamageTaken")}`;

      requestAnimationFrame(frame);
    }

    frame(0);
  </script>
</body>
</html>
